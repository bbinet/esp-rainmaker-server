# Production-like NGINX Ingress emulation for the docker-compose stack.
# Three server blocks mirror the three Kubernetes Ingress hostnames:
#
#   api.local    — JWT-only routes (user-facing REST + admin)
#   claim.local  — /claim/initiate, /claim/verify (no client auth)
#   node.local   — node mTLS routes; verify_client on, propagates the
#                  validated CN as X-SSL-Client-CN to the backend
#
# Client cert verification on `node.local` uses the same intermediate
# CA chain that signed every device cert at /claim/verify time.

worker_processes auto;
events { worker_connections 1024; }

http {
    upstream rainmaker_api {
        # Round-robin across all api replicas. Docker resolves the
        # service name to all replica IPs.
        server api:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    log_format mtls '$remote_addr "$ssl_client_s_dn" "$request" '
                    '$status $body_bytes_sent';
    access_log /var/log/nginx/access.log;

    # Extract the Common Name from the validated client cert's
    # Subject DN. Format is "CN=<value>" optionally followed by
    # ",..." or preceded by other RDN components.
    map $ssl_client_s_dn $client_cn {
        default                     "";
        "~CN=(?<n>[^,]+)"           $n;
    }

    # Common proxy settings.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---------- api.local (JWT) ----------
    server {
        listen 443 ssl;
        server_name api.local;

        ssl_certificate     /etc/nginx/certs/nginx-chain.pem;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://rainmaker_api;
        }
    }

    # ---------- claim.local (no client cert required) ----------
    server {
        listen 444 ssl;
        server_name claim.local;

        ssl_certificate     /etc/nginx/certs/nginx-chain.pem;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # `optional` so self-claim (no JWT, no cert) also flows through.
        ssl_verify_client off;

        location /claim/ {
            proxy_pass http://rainmaker_api;
        }

        # Block everything else on this host.
        location / { return 404; }
    }

    # ---------- node.local (mTLS) ----------
    server {
        listen 445 ssl;
        server_name node.local;

        ssl_certificate     /etc/nginx/certs/nginx-chain.pem;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Verify the device cert against our CA chain. Reject connections
        # without a valid cert.
        ssl_client_certificate /etc/nginx/certs/ca-chain.pem;
        ssl_verify_client on;
        ssl_verify_depth 2;

        # Pull the CN out of the validated cert and pass it to the backend.
        # `$client_cn` (nginx >=1.11.6) gives just the CN; older
        # builds expose the full DN, which we strip with a map.
        set_real_ip_from 0.0.0.0/0;
        add_header X-Verified-CN $client_cn always;

        access_log /var/log/nginx/access.log mtls;

        location /v1/node/ {
            proxy_set_header X-SSL-Client-CN $client_cn;
            proxy_pass http://rainmaker_api;
        }

        location / { return 404; }
    }
}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: rainmaker-server:latest
          command: ["python", "-m", "app.entrypoints.worker"]
          envFrom:
            - configMapRef:
                name: rainmaker-config
            - secretRef:
                name: rainmaker-db
            - secretRef:
                name: rainmaker-garage
            - secretRef:
                name: rainmaker-smtp
            - secretRef:
                name: rainmaker-jwt
            - secretRef:
                name: rainmaker-mqtt-internal
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}

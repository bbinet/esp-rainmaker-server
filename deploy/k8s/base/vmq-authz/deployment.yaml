apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmq-authz
  labels:
    app.kubernetes.io/name: vmq-authz
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vmq-authz
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmq-authz
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vmq-authz
          image: rainmaker-server:latest
          command: ["python", "-m", "app.entrypoints.vmq_authz"]
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: rainmaker-config
            - secretRef:
                name: rainmaker-db
            - secretRef:
                name: rainmaker-jwt
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

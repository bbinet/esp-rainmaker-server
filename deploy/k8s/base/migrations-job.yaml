apiVersion: batch/v1
kind: Job
metadata:
  name: alembic-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alembic-migrate
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alembic
          image: rainmaker-server:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: rainmaker-config
            - secretRef:
                name: rainmaker-db
            - secretRef:
                name: rainmaker-jwt
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

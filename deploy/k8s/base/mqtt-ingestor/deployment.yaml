apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt-ingestor
  labels:
    app.kubernetes.io/name: mqtt-ingestor
spec:
  # Singleton-ish: scale via shared-subscription groups on VerneMQ if needed.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mqtt-ingestor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mqtt-ingestor
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mqtt-ingestor
          image: rainmaker-server:latest
          command: ["python", "-m", "app.entrypoints.mqtt_ingestor"]
          envFrom:
            - configMapRef:
                name: rainmaker-config
            - secretRef:
                name: rainmaker-db
            - secretRef:
                name: rainmaker-mqtt-internal
            - secretRef:
                name: rainmaker-jwt
          volumeMounts:
            - name: pki
              mountPath: /etc/rainmaker/pki
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: pki
          secret:
            secretName: rainmaker-pki-ca-intermediate
        - name: tmp
          emptyDir: {}

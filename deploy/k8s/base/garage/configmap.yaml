apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "lmdb"
    replication_factor = 3
    rpc_bind_addr = "[::]:3901"
    rpc_secret = "REPLACE_WITH_64_HEX_CHARS_RPC_SECRET"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.garage.local"

    [admin]
    api_bind_addr = "[::]:3903"
    admin_token = "REPLACE_WITH_ADMIN_TOKEN"
    metrics_token = "REPLACE_WITH_METRICS_TOKEN"

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rainmaker-dev

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: vmq-authz
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: StatefulSet
      name: vernemq
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: StatefulSet
      name: garage
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: ConfigMap
      name: rainmaker-config
    patch: |-
      - op: replace
        path: /data/RM_ENV
        value: dev
      - op: replace
        path: /data/RM_LOG_LEVEL
        value: DEBUG

## VerneMQ reference config for production-like deployments.
##
## This file documents the configuration applied in k8s manifests via env
## vars (DOCKER_VERNEMQ_*). In docker-compose it's set inline. The real
## broker host enables mTLS on 8883 and pushes all auth decisions to the
## `vmq-authz` webhook service.

allow_anonymous = off

## ---- mTLS listener (devices) ----
listener.ssl.default = 0.0.0.0:8883
listener.ssl.default.cafile = /etc/vernemq/certs/ca-chain.pem
listener.ssl.default.certfile = /etc/vernemq/certs/server.pem
listener.ssl.default.keyfile = /etc/vernemq/certs/server.key
listener.ssl.default.require_certificate = on
listener.ssl.default.use_identity_as_username = on
listener.ssl.default.tls_version = tlsv1.2

## ---- WSS listener (mobile app) ----
listener.wss.default = 0.0.0.0:8084
listener.wss.default.cafile = /etc/vernemq/certs/ca-chain.pem
listener.wss.default.certfile = /etc/vernemq/certs/server.pem
listener.wss.default.keyfile = /etc/vernemq/certs/server.key
listener.wss.default.require_certificate = off

## ---- Plain TCP (loopback only, internal backend publisher) ----
listener.tcp.internal = 127.0.0.1:1883
listener.tcp.internal.allowed_protocol_versions = 3,4,5

## ---- Webhooks plugin ----
plugins.vmq_webhooks = on
plugins.vmq_passwd = off
plugins.vmq_acl = off

vmq_webhooks.pool_timeout = 5000
vmq_webhooks.pool_max_connections = 100

vmq_webhooks.auth_on_register.hook = auth_on_register
vmq_webhooks.auth_on_register.endpoint = http://vmq-authz.rainmaker.svc.cluster.local:8001/auth/on_register

vmq_webhooks.auth_on_publish.hook = auth_on_publish
vmq_webhooks.auth_on_publish.endpoint = http://vmq-authz.rainmaker.svc.cluster.local:8001/auth/on_publish

vmq_webhooks.auth_on_subscribe.hook = auth_on_subscribe
vmq_webhooks.auth_on_subscribe.endpoint = http://vmq-authz.rainmaker.svc.cluster.local:8001/auth/on_subscribe

vmq_webhooks.on_client_online.hook = on_client_online
vmq_webhooks.on_client_online.endpoint = http://vmq-authz.rainmaker.svc.cluster.local:8001/on_client_online

vmq_webhooks.on_client_offline.hook = on_client_offline
vmq_webhooks.on_client_offline.endpoint = http://vmq-authz.rainmaker.svc.cluster.local:8001/on_client_offline

## ---- Behaviour ----
max_connections = 10000
max_inflight_messages = 100
max_message_size = 1048576
persistent_client_expiration = 7d

## ---- Cluster ----
nodename = VerneMQ@127.0.0.1
distributed_cookie = REPLACE_WITH_SHARED_COOKIE

## ---- Metrics ----
metrics_endpoint = http
listener.http.default = 0.0.0.0:8888

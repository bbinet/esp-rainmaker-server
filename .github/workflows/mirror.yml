name: mirror-third-party-images

# Mirrors the third-party container images we depend on from Docker Hub
# to ghcr.io, so that:
#   1. We can run `docker compose up` without hitting Docker Hub's
#      anonymous pull rate-limit (100 pulls / 6h per IP).
#   2. The exact digests we test against are pinned in our own registry
#      and survive upstream tag mutations or repository deletions.
#
# Destinations are under `ghcr.io/<repo>/<image>` (repo namespace),
# not `ghcr.io/<user>/<image>` (user namespace). GITHUB_TOKEN cannot
# create new packages in the user namespace without manual UI setup
# (which would yield `denied: permission_denied: write_package` on
# first push), but it has write access by default to packages owned
# by the repo. This trades a longer image name for zero manual setup.
#
# Runs weekly (Monday 03:00 UTC) and on manual trigger. Re-pulling the
# same tag is cheap: only changed layers are pushed.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      # Serialize: 7 parallel anonymous Docker Hub pulls from the same
      # runner egress IP trip the 100-pulls/6h limit. One at a time
      # gives the rate-limiter a chance to refill and produces
      # readable logs.
      max-parallel: 1
      fail-fast: false
      matrix:
        image:
          - src: "timescale/timescaledb:latest-pg16"
            dst: "timescaledb:pg16"
          - src: "dxflrs/garage:v1.0.1"
            dst: "garage:v1.0.1"
          - src: "vernemq/vernemq:2.0.1"
            dst: "vernemq:2.0.1"
          - src: "rnwood/smtp4dev:v3"
            dst: "smtp4dev:v3"
          - src: "nginx:1.27-alpine"
            dst: "nginx:1.27-alpine"
          - src: "prodrigestivill/postgres-backup-local:16"
            dst: "postgres-backup-local:16"
          - src: "alpine:3.20"
            dst: "alpine:3.20"
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticated Docker Hub pull doubles the rate-limit (100 → 200
      # /6h). Optional but recommended.
      #
      # `secrets.*` cannot be referenced in step-level `if:` expressions
      # (GitHub Actions parser rejects "Unrecognized named-value:
      # 'secrets'"), so we expose the secret as an env var and check
      # env.* in the conditional instead.
      - name: Login to Docker Hub (optional)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Diagnostics
        run: |
          echo "::group::docker info"
          docker info
          echo "::endgroup::"
          echo "::group::buildx ls"
          docker buildx ls
          echo "::endgroup::"
          echo "::group::Docker config (paths only)"
          ls -la ~/.docker/ || true
          echo "Auth keys configured:"
          jq -r '.auths | keys[]?' ~/.docker/config.json 2>/dev/null || echo "  (no config)"
          echo "::endgroup::"

      - name: Pull and push (preserve all platforms)
        env:
          SRC: ${{ matrix.image.src }}
          # Push under the REPO namespace, not the user namespace.
          # GITHUB_TOKEN has write access by default to packages owned
          # by the repo (`ghcr.io/<repo>/<image>`), but cannot create
          # new packages in the user namespace (`ghcr.io/<user>/<image>`
          # → 403 denied: permission_denied: write_package).
          DST: ghcr.io/${{ github.repository }}/${{ matrix.image.dst }}
        run: |
          set -euo pipefail
          echo "::group::imagetools create $SRC -> $DST"
          # `imagetools create` does a registry-to-registry manifest
          # copy: no local docker daemon storage involved, multi-arch
          # manifest list preserved. Needs read access on source +
          # write access on destination.
          docker buildx imagetools create -t "$DST" "$SRC"
          echo "::endgroup::"

          echo "::group::Verify ghcr digest"
          # Don't pipe through `head` — pipefail + SIGPIPE would mask
          # the real exit status.
          docker buildx imagetools inspect "$DST"
          echo "::endgroup::"

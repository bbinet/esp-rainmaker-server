name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  # Lint + unit tests + mypy run inside a Debian Trixie container so
  # the CI environment matches the runtime base image (Trixie). The
  # GHA runner host stays Ubuntu (no Debian-native hosted runners on
  # github.com), but everything Python sees is Trixie.
  lint-type-unit:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim-trixie
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git build-essential libpq-dev curl
          rm -rf /var/lib/apt/lists/*
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check app tests
          ruff format --check app tests
      - name: Mypy
        run: mypy app
      - name: Unit tests
        run: pytest tests/unit/ -q --cov=app --cov-report=xml

  # Integration tests use testcontainers, which needs a Docker daemon.
  # That's not available inside a container, so this job runs on the
  # host runner. The runtime image being tested still uses Trixie.
  integration:
    runs-on: ubuntu-latest
    needs: lint-type-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Integration tests
        run: pytest tests/integration/ -q

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-type-unit
    steps:
      - uses: actions/checkout@v4
      - name: Build image (multi-arch sanity, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: rainmaker-server:ci

name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check app tests
          ruff format --check app tests
      - name: Mypy
        run: mypy app
      - name: Tests
        run: pytest --cov=app --cov-report=xml

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-type-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t rainmaker-server:ci -f deploy/docker/Dockerfile .

                value:
                  "message_subject": "updated_message_subject"
                  "message_text": "updated_message_text"
                  "template_type": "EMAIL_INVITE_MESSAGE"
                  "locale": "locale"
                  "new_locale": "updated_locale"
                  "default": true/false (updated_default value)
      responses:

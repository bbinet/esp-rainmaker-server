        - AccessToken: []

    put:
      tags:
        - Matter Setup APIs for Getting DAC
      summary: API to update or confirm input for matter batch config
      description: "This API is used to update or confirm the matter batch config which will be used for matter custom data generation when device requests for it via command response"
      operationId: updatematterbatchconfig
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: 'v1'
        - name: batch_id
          in: query
          description: batch id
          required: true
          schema:
            type: string
            example: B64577ABJWG
        - name: confirm
          in: query
          description: Customer should send this as true to confirm the input and this batch will be eligible for matter custom data generation when device requests for it via command response
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APIRequestUpdateMatterBatchConfig"
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APISuccessResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure
            <br> Error codes and Error Description
            <br> 100001 - Error in fetching user details
            <br> 100002 - API Version not supported
            <br> 100004 - You are not authorized to perform this operation, Please contact administrator
            <br> 100006 - Invalid request body
            <br> 141012 - Invalid product finish. Valid values are [other, matte, satin, polished, rugged, fabric]
            <br> 141013 - Invalid product color. Valid values are [black, navy, green, teal, maroon, purple, olive, gray, blue, lime, aqua, red, fuchsia, yellow, white, nickel, chrome, brass, copper, silver, gold]
            <br> 141004 - Batch id is missing
            <br> 140018 - Please specify atleast one input parameter to update
            <br> 140016 - Custom data input is already confirmed hence can't update or confirm it again
            <br> 140015 - No custom data input found for given batchID
            <br> 140012 - Invalid product finish. Valid values are [other, matte, satin, polished, rugged, fabric]
            <br> 140013 - Invalid product color. Valid values are [black, navy, green, teal, maroon, purple, olive, gray, blue, lime, aqua, red, fuchsia, yellow, white, nickel, chrome, brass, copper, silver, gold]

        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure
            <br> Error codes and Error Description
            <br> 100070 - Too many requests, try again later
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure
            <br> Error codes and Error Description
            <br> 140020 - Error occurred while updating input for matter custom data
            <br> 140017 - Error occurred while generating custom data
            <br> 140014 - Error getting custom data input from db
      security:
        - AccessToken: []
    get:
      tags:
        - Matter Setup APIs for Getting DAC
      summary: API to get the input for matter batch config
      description: "This API is used to get the batch config which is the input for matter custom data generation along with the status confirmed/unconfirmed."
      operationId: getinputmattercustomdata
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: 'v1'
        - name: batch_id
          in: query
          description: batch id
          schema:
            type: string
            example: B64577ABJWG
        - name: refresh
          in: query
          description: "refresh the Matter batch fields dac_limit and dac_remaining to be in sync with the actual number of DACs available<br>This will apply only if the batch_id is specified"
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/APIGetInputMatterCustomDataResponse"
                  - $ref: "#/components/schemas/MatterBatchGetResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure
            <br>Error Codes and Error Description
            <br> 100001 - Error in fetching user details
            <br> 100002 - API Version is not supported
            <br> 100004 - You are not authorized to perform this operation, Please contact administrator
            <br> 140004 - Batch id is missing
            <br> 140015 - No custom data input found for given batchID
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure
            <br>Error Codes and Error Description
            <br> 100070 - Too many requests, try again later
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure
            <br>Error Codes and Error Description
            <br> 140014 - Error getting custom data input from db
      security:
        - AccessToken: []

  /{version}/admin/matter/batch/nodes:
      get:
        tags:
          - Matter Setup APIs for Getting DAC
        summary: API to get the nodes for a matter batch
        description: "This API is used to get the nodes for a matter batch.<br>
                     <ul><li> Batch_id is required parameter.By default array of node IDs associated with batch is displayed</li>
                     <li> If node_details is true, it will return the node details of the nodes associated with the batch_id.</li>
                     <li> If node_id is provided, it will return the node details for the given node_id.</li></ul>"
        operationId: getmatterbatchnodes
        parameters:
          - name: version
            in: path
            description: API Version (Current supported API Version is 'v1')
            required: true
            schema:
              type: string
              default: 'v1'
          - name: batch_id
            in: query
            description: batch id
            required: true
            schema:
              type: string
              example: B64577ABJWG
          - name: node_details
            in: query
            description: node details
            required: false
            schema:
              type: boolean
              default: false
          - name: node_id
            in: query
            description: node id
            required: true
            schema:
              type: string
              example: 1234567890
          - name: start_id
            in: query
            description: start id for pagination
            required: false
            schema:
              type: string
              example: 1234567890
          - name: num_records
            in: query
            description: number of records to be returned for pagination.Maximum number of records that can be returned is 25 in case of default response and 10 in case of node_details is true.
            required: false
            schema:
              type: integer
              example: 25

        responses:
          "200":
            description: success
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/APIGetMatterBatchNodesResponse"
          "400":
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/APIFailureResponse"
            description: failure
              <br>Error Codes and Error Description
              <br> 100001 - Error in fetching user details
              <br> 100002 - API Version is not supported
              <br> 100004 - You are not authorized to perform this operation, Please contact administrator
              <br> 141004 - Batch id is missing
              <br> 141006 - No Batch found with given batchID
              <br> 141025 - Node does not belong to the batch
              <br> 141026 - No nodes found for the given batch
          "500":
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/APIFailureResponse"
            description: failure
              <br>Error Codes and Error Description
              <br> 141005 - "Error occurred while getting batch details"
        security:
         - AccessToken: []


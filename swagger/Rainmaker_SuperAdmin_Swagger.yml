  /{version}/admin/push_notification/custom_message_template:
    post:
      tags:
        - Custom Mobile Platform Message Template
      summary: Create custom mobile platform message template
      description: "This API will be used to create custom mobile platform message template.<br>**Note:** This API cannot be used to update an existing template. Call the PUT method for that."
      operationId: createcustommessagetemplate
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: 'v1'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomMobileMessageTemplate'
            examples:
              Create Custom Mobile Message Template:
                value:
                  event_type: '<esp_rainmaker_sns_node_disconnected>'
                  message_title: '<message title>'
                  message_body: '<message body>'
                  event_data: '<enable/disable>'
                  priority:
                    android: 'high'
                    ios: 10
              Setting the common custom message title:
                value:
                  message_title: '<message title>'
              Setting custom message body for particular event type:
                value:
                  event_type: '<esp_rainmaker_sns_node_disconnected>'
                  message_body: '<message body>'
              Disabling event data for particular event type:
                value:
                  event_type: '<esp_rainmaker_sns_node_disconnected>'
                  event_data: '<enable/disable>'
              Setting priority for both platforms:
                value:
                  event_type: '<esp_rainmaker_sns_node_disconnected>'
                  priority:
                    android: 'normal'
                    ios: 5
              Setting priority for Android only:
                value:
                  event_type: '<esp_rainmaker_sns_node_disconnected>'
                  priority:
                    android: 'high'
              Setting priority for iOS only:
                value:
                  event_type: '<esp_rainmaker_sns_node_disconnected>'
                  priority:
                    ios: 10

        description: "Request body for creating custom mobile message template. The message title can have a maximum of 50 characters and message body can have maximum of 1500 characters.
                      <p>&nbsp; &nbsp; &nbsp;<strong>Event Data</strong> : When event data is enabled, Event's raw data is shared with mobile. </p>
                      <p>&nbsp; &nbsp; &nbsp;<strong>Event Type</strong> : Event topic name.[same as SNS topic name]</p>
                      <p>&nbsp; &nbsp; &nbsp;<strong>Priority</strong> : Configure notification priority for Android and iOS platforms separately.
                      <br>
                      <br>&nbsp; &nbsp; &nbsp;&nbsp; &nbsp; &nbsp;<strong>Android:</strong> Supports 'high' or 'normal' values.
                      <br>&nbsp; &nbsp; &nbsp;&nbsp; &nbsp; &nbsp;• <strong>Normal priority:</strong> Normal priority messages are delivered immediately when the app is in the foreground. For backgrounded apps, delivery may be delayed. For less time-sensitive messages, such as notifications of new email, keeping your UI in sync, or syncing app data in the background, choose normal delivery priority.
                      <br>&nbsp; &nbsp; &nbsp;&nbsp; &nbsp; &nbsp;• <strong>High priority:</strong> FCM attempts to deliver high priority messages immediately even if the device is in Doze mode. High priority messages are for time-sensitive, user visible content.
                      <br>
                      <br>&nbsp; &nbsp; &nbsp;&nbsp; &nbsp; &nbsp;<strong>iOS:</strong> Supports numeric values 1, 5, and 10.
                      <br>&nbsp; &nbsp; &nbsp;&nbsp; &nbsp; &nbsp;• <strong>Priority 10:</strong> Send the notification immediately (default if omitted).
                      <br>&nbsp; &nbsp; &nbsp;&nbsp; &nbsp; &nbsp;• <strong>Priority 5:</strong> Send the notification based on power considerations on the user's device.
                      <br>&nbsp; &nbsp; &nbsp;&nbsp; &nbsp; &nbsp;• <strong>Priority 1:</strong> Prioritize the device's power considerations over all other factors for delivery, and prevent awakening the device.</p>
                      <b>Custom messages for the events which are enabled for mobile push notifications should have number of '%s' depending on the event types. Default events should have '%s' which will get substituted by device ID. Specific event types will be mentioned in the below list. </b>

                    <p><b>Supported event topics:</b>
                    <li>esp_rainmaker_sns_user_node_added &nbsp; <b>(number of %s should be 3 which will get substituted by primary user name, request ID and Nodes)</b></li>
                    <li>esp_rainmaker_sns_user_node_removed &nbsp; <b>(number of %s should be 2 which will get substituted by primary user name and the removed nodes)</b></li>
                    <li>esp_rainmaker_sns_node_registration</li>
                    <li>esp_rainmaker_sns_node_parameter_modified <b>(number of %s should be 2 which will get substituted by Node ID and param change Payload)</b></li>
                    <li>esp_rainmaker_sns_node_status_modified</li>
                    <li>esp_rainmaker_sns_node_firmware_updated</li>
                    <li>esp_rainmaker_sns_user_node_sharing_add &nbsp; <b>(number of %s should be 3 which will get substituted by primary user name, request ID and Nodes)</b></li>
                    <li>esp_rainmaker_sns_node_connected</li>
                    <li>esp_rainmaker_sns_node_disconnected</li>
                    <li>esp_rainmaker_sns_node_registered</li>
                    <li>esp_rainmaker_sns_node_status_modified</li>
                    <li>esp_rainmaker_sns_admin_user_added</li>
                    <li>esp_rainmaker_sns_new_tags_added</li>
                    <li>esp_rainmaker_sns_existing_tags_attached</li>
                    <li>esp_rainmaker_sns_automation_triggered &nbsp;<b>(single %s will be replaced by Automation name )</b></li>
                    <li>esp_rainmaker_sns_user_node_group_sharing_add &nbsp;<b>(number of %s should be 2 which will get substituted by shared_from user name and group name)</b></li>
                    <li>esp_rainmaker_sns_user_node_group_sharing_add_declined &nbsp;<b>(number of '%s' should be 3 which will get substituted by Shared_to username, sharing request ID and groupname)</b></li>
                    <li>esp_rainmaker_sns_user_node_group_sharing_add_accepted &nbsp;<b>(number of '%s' should be 3 which will get substituted by Shared_to username, sharing request ID and groupname)</b></li>

                    <li>esp_rainmaker_sns_user_node_group_added <b>(single %s will be replaced by group name)</b></li>
                    <li>esp_rainmaker_sns_user_node_group_removed <b>(single %s will be replaced by group name)</b></li>
                    <li>esp_rainmaker_sns_node_config_modified</li>
                    <li>esp_rainmaker_sns_node_alert <b>(A single %s will be replaced by the message reported by the device. If there are two %s, the first will be replaced by the message reported by the device, and the second by the device ID. If no %s is present, the alert message reported by the device will override the custom message.)</b></li>
                          </p>"
        required: true
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APISuccessResponse"
        "400":
          description: failure <br>Error Codes and Error Description
            <br>100006- Invalid request body
            <br>112049- Message template of given template type and locale already exists
            <br>114028- Event type is missing
            <br>114047- Either message title, message body, event data or event type is missing
            <br>114038- Either enable or disable has to specified for event data
            <br>114041- The message body can have a maximum of 1500 characters.
            <br>114042- The message title can have a maximum of 50 characters.
            <br>114045- Either Message body or event data or priority is missing
            <br>114052- Number of '%s' should be 3 which will get substituted by primary user name, request ID and Nodes
            <br>114053- Number of '%s' should be 2 which will get substituted by Node ID and param change Payload
            <br>114054- Number of '%s' should be 2 which will get substituted by Shared_from username and Groupname
            <br>114055- Number of '%s' should be 3 which will get substituted by Shared_to username, Request ID and Groupname
            <br>114056- Number of '%s' should be 1 which will get substituted by Automation name
            <br>114057- Number of '%s' should be 1 which will get substituted by Device ID
            <br>114058- Number of '%s' should be 1 which will get substituted by GroupName
            <br>114062- Number of '%s' cannot be more than 2.
            <br>114063- Number of '%s' should be 2 which will get substituted by primary user name and nodes removed
            <br>114065- Invalid priority value. Priority for android should be either 'high' or 'normal' and for iOS should be either 1, 5, or 10
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformApplicationAPIFailureResponse"
        "429":
          description: failure <br>Error Codes and Error Description
            <br>100070- Too many requests, try again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformApplicationAPIFailureResponse"
        "500":
          description: failure <br>Error Codes and Error Description
            <br>114029- Error occurred while storing custom message template
            <br>114059- Please try again later as the previous operation is still ongoing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformApplicationAPIFailureResponse"
      security:
        - AccessToken: []
    get:
      tags:
        - Custom Mobile Platform Message Template
      summary: This API fetches configured custom mobile message template
      description: "This API fetches configured custom mobile message template."
      operationId: getcustommessagetemplate
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: 'v1'
        - name: event_type
          in: query
          description: event type
          schema:
            type: string
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCustomMobileMessageTemplateResponse"

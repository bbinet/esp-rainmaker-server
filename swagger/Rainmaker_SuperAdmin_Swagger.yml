          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformApplicationAPIFailureResponse"
        "500":
          description: failure<br>Error Codes and Error Description-
            <br>114031- Error occurred while updating custom message template
            <br>114059- Please try again later as the previous operation is still ongoing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformApplicationAPIFailureResponse"
      security:
        - AccessToken: []
    delete:
      tags:
        - Custom Mobile Platform Message Template
      summary: Delete or clear custom mobile message template
      description: "This API deletes or clears custom mobile message template based on the provided parameters.<br><br><strong>Parameters:</strong><br><strong>reset_to_default</strong>: When set to 'true', completely deletes the message template including event_data configurations. When set to 'false' (default), only clears the message body while preserving event_data configurations (defaults event_data to enabled).<br><strong>reset_priority</strong>: When set to 'true', clears only the priority field while preserving message_body and event_data configurations. Cannot be used with reset_to_default.<br><strong>event_type</strong>: When provided, operates on the specific event type. When provided with valid value: 'all', operates on all supported SNS event types."
      operationId: deletecustommessagetemplate
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: 'v1'
        - name: event_type
          in: query
          description: Event type to delete/clear template for. To operate on all supported SNS event types, valid value is 'all'.
          required: true
          schema:
            type: string
            enum:
              - esp_rainmaker_sns_user_node_added
              - esp_rainmaker_sns_user_node_removed
              - esp_rainmaker_sns_node_registration
              - esp_rainmaker_sns_node_parameter_modified
              - esp_rainmaker_sns_node_status_modified
              - esp_rainmaker_sns_node_firmware_updated
              - esp_rainmaker_sns_user_node_sharing_add
              - esp_rainmaker_sns_node_connected
              - esp_rainmaker_sns_node_disconnected
              - esp_rainmaker_sns_node_registered
              - esp_rainmaker_sns_admin_user_added
              - esp_rainmaker_sns_new_tags_added
              - esp_rainmaker_sns_existing_tags_attached
              - esp_rainmaker_sns_automation_triggered
              - esp_rainmaker_sns_user_node_group_sharing_add
              - esp_rainmaker_sns_user_node_group_sharing_add_declined
              - esp_rainmaker_sns_user_node_group_sharing_add_accepted
              - esp_rainmaker_sns_user_node_group_added
              - esp_rainmaker_sns_user_node_group_removed
              - esp_rainmaker_sns_node_config_modified
              - esp_rainmaker_sns_node_alert
              - all
            example: 'esp_rainmaker_sns_node_connected'
        - name: reset_to_default
          in: query
          description: When 'true', completely deletes the message template including event_data configurations. When 'false' (default), only clears the message body while preserving event_data configurations. Cannot be used with reset_priority.
          schema:
            type: boolean
            default: false
            example: false
        - name: reset_priority
          in: query
          description: When 'true', clears only the priority field while preserving message_body and event_data configurations. Cannot be used with reset_to_default.
          schema:
            type: boolean
            default: false
            example: false
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/APISuccessResponse'
              examples:
                Delete Message Template:
                  value:
                    status: 'success'
                    description: 'Successfully deleted custom message template/s'
                Clear Message Template Body:
                  value:
                    status: 'success'
                    description: 'Successfully cleared custom message template body'
                Clear Message Template Priority:
                  value:
                    status: 'success'
                    description: 'Successfully cleared custom message template priority'
        "400":
          description: failure<br>Error Codes and Error Description-
            <br>114034- Invalid event type
            <br>114033- No custom message templates found
            <br>114067- reset_to_default and reset_priority cannot be used together
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformApplicationAPIFailureResponse"
        "500":
          description: failure<br>Error Codes and Error Description-
            <br>114032- Error occurred while deleting custom message template
            <br>114064- Error occurred while clearing custom message template body
            <br>114066- Error occurred while clearing custom message template priority
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformApplicationAPIFailureResponse"
      security:
        - AccessToken: []

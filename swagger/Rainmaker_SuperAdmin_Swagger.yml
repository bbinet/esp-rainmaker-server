        - AccessToken: []

  /{version}/admin/deployment_settings/config/{service}:
    put:
      tags:
        - Deployment Setting
      summary: API for the super admin user to configure service's configuration
      description: |
        This API is used by customer's super admin users to configure service's configuration.
        <br><br>**RBAC**: API level fine grained access for admins. Can create policies, roles and assign to specific admins.
        <br><br>**Node APIs**: Nodes can use HTTP instead of MQTT to communicate with Cloud. Currently, supports just OTA operations.
        <br><br>**Encryption**: Encrypts sensitive fields of Users like email, phone number, username, etc. <font color='red'>Cannot be disable once enabled</font>
        <br><br>**Role-based Access Control**: Use RBAC(Role-based Access Control) to enable fine-grained access evaluation for users. If RBAC is disabled, flag-based approach is used to check user access to operations, as opposed to user roles and policies approach used by RBAC. RBAC can be enabled/disabled with this API.</font>
        <br><br>**User Archival**: Enables the archival service which warns year old inactive users that their data might be deleted. Deletes that User after 3 months of cooldown.
        <br><br>**Custom user context:** custom_auth_userid will be able carry out user operations on behalf of others by providing user identifier in the 'Custom-UserId' header
        <br><br>**OAuth only <b>(Beta)</b>:** Use OAuth for identity management instead of Cognito. Currently, only third party logins supported. <font color='red'>This is strictly to be enabled before phone apps are live. Please consult the RainMaker support team for more details.</font>
        <br><br>**Command Response History:** Enables/disables the command response history.
        <br><br>**Node Data Access:** Controls what admins can do with node data:
          <br>- <code>read</code>: View node params and config
          <br>- <code>write</code>: View and modify node params (config is always read-only)
        <br><br>**Custom SMS:** Sets the Sender ID, Entity ID, Template ID and Country to send Custom SMS to users via registered Sender ID. The {#var#} is replaced with the verification code while sending SMS. Country code from the phone number is used to get details of the country while sending SMS.
        <br><br>**OTA Network Serialisation:** The maximum number of OTAs that can be delivered in parallel for a given <code>network_id</code>.
                Applicable only to "Network Serialised" OTA jobs.
                <br>The default value is <code>3</code>.
        <br><br>**User Node History:** This feature enables storing comprehensive historical data about user-node associations, including current and past (removed) associations along with redundant association counts. Once enabled, removed associations are preserved as inactive entries rather than being deleted. The historical data is accessible through dedicated history admin and user APIs. <font color='red'>This feature cannot be disabled once enabled and cannot be enabled multiple times.</font> After enabling, it may take some time for the changes to be reflected correctly in the history API responses. Can be enabled by setting the value to true.
        <br>
        **Advanced User Features:** Controls the Cognito User Pool pricing tier and associated advanced user pool features:
          <br>- <code>enabled: true</code>: Sets tier to <b>ESSENTIALS</b> (enables advanced features like Passwordless Sign-In, Managed Login via Hosted UI, Password Reuse Prevention, etc.)
          <br>- <code>enabled: false</code>: Sets tier to <b>LITE</b> (basic user pool features)
          <br><font color='orange'>⚠️ Downgrading from ESSENTIALS to LITE requires disabling all advanced features first (Passwordless Sign-In, Managed Login via Hosted UI, Password Reuse Prevention, etc.)</font>
        <br>
        **Guest User:** When enabled, allows creation of guest users (POST /user/guest) and guest-to-regular conversion (POST /user/guest/conversion/initiate, POST /user/guest/conversion/verify). When disabled, those APIs return a service-not-enabled error. Enable or disable with <code>enabled: true</code> or <code>enabled: false</code>. Optionally set <code>config_data.expiry_duration_days</code> to control how many days after creation a guest user account expires (TTL). Value <code>0</code> disables expiry (guest users are never auto-deleted). If omitted, existing value is unchanged. Only newly created guest users use the configured duration; existing guest users keep their current expiry. <code>expiry_duration_days</code> must be &gt;= 0.
        <br>
        **Skip FW Command Response Support Check:** This setting bypasses the command response support check that normally verifies if command response is enabled on the node (when node configuration is published to the cloud). Enable this to allow command responses from nodes that haven't published their configuration.
        <br>- Node with command response support enabled: Works as expected
        <br>- Node with command response support disabled and skip_fw_cmd_resp_support_check not set/explicitly False: Error occurs as cmd response not supported
        <br>- Node with command response support disabled and skip_fw_cmd_resp_support_check set as True: Flow bypasses the error and processes the command response successfully
        <br>
        **Node Proxy:** Gates access to the node proxy API (`POST /user/nodes/{node_id}/proxy/{action}`). Disabled by default. When disabled, all proxy requests return a 400 error (Service is not enabled). Enabling this setting immediately updates the `esp-ProxyNodeMqtt` lambda's environment variable (`NODE_PROXY_ENABLED`) so the change takes effect without a cold start.
        <br>
        <br><br>**Location Triggers:** The default polling interval is 30 minutes.
        The default host url is 'https://api.openweathermap.org/data/2.5/weather?units=metric' with default units as 'metric'.
        The default max number of weather triggers requests per minute is 57.
        The supported units are 'standard', 'metric', 'imperial'.
        List of all parameters and supported units:
        <table>
        <thead>
          <tr>
            <th>Parameter<br></th>
            <th>Description<br></th>
            <th>Standard<br></th>
            <th>Metric<br></th>
            <th>Imperial<br></th>
          </tr>
        </thead>
        <tbody>
          <tr><td><font color='#fb3e3d'>o</font> temperature </td><td> Temperature </td><td> Kelvin </td><td>Celsius</td><td> Fahrenheit </td></tr>
          <tr><td><font color='#fb3e3d'>o</font> pressure </td><td> Atmospheric Pressure </td><td> hPa </td><td>hPa</td><td> hPa </td></tr>
          <tr><td><font color='#fb3e3d'>o</font> humidity </td><td> Humidity </td><td> % </td><td>%</td><td> % </td></tr>
          <tr><td><font color='#fb3e3d'>o</font> wind_speed </td><td> Wind Speed </td><td> meter/sec	 </td><td>meter/sec	</td><td> miles/hour</td></tr>
          <tr><td><font color='#fb3e3d'>o</font> weather_condition </td><td> Weather Conditions </td><td> check note</td><td>check note</td><td> check note</td></tr>
        </tbody>
        </table>
        <br>
        **Note:** <br> 1. The supported weather conditions are 'Thunderstorm', 'Drizzle', 'Rain', 'Snow', 'Clear', 'Clouds', 'Mist', 'Smoke', 'Haze', 'Dust', 'Fog', 'Sand', 'Ash', 'Squall', 'Tornado'
                  <br> 2. The recommended max_weather_triggers_requests_per_minute is 95% of your quota and keep the remaining 5% for user operations i.e. create/update automation triggers. This can be adjusted based on your usage patterns.
                  <br> 3. For services that require verification code for enable/disable confirmation, the code is valid for 1 day only."
      operationId: cofigureServiceConfiguration
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: 'v1'
        - name: service
          in: path
          description: Service to configure.
          required: true
          schema:
            type: string
            enum: ["rbac", "node_apis", "custom_user_context", "location_trigger", "encryption", "user_archival", "oauth_only", "cmd_resp_history", "custom_sms", "node_data_access", "ota_network_serialisation", "user_node_history", "advanced_user_features", "skip_fw_cmd_resp_support_check", "guest_user", "node_proxy"]
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/ConfigureRBAC"
                - $ref: "#/components/schemas/ConfigureNodeAPIsRequest"
                - $ref: "#/components/schemas/ConfigureCustomUserCtxRequest"
                - $ref: '#/components/schemas/UpdateLocationTriggerRequest'
                - $ref: "#/components/schemas/ServiceEnableDisableRequest"
                - $ref: "#/components/schemas/UpdateCustomeSMS"
                - $ref: "#/components/schemas/ConfigureNodeDataAccessDeploymentSetting"
                - $ref: "#/components/schemas/ConfigureNumericDeploymentSetting"
                - $ref: "#/components/schemas/ConfigureGuestUserDeploymentSetting"
                - $ref: "#/components/schemas/ConfigureOTANetworkSerialisationRequest"
            examples:
              RBAC - enable/disable:
                value:
                  {
                    "rbac_enabled": true,
                  }
              RBAC - allow same role level:
                value:
                  {
                    "allow_same_role_level": true
                  }
              User Archival, Command Response History, or User Node History:
                value:
                  {
                    "enabled": true
                  }
              Guest User - enable only:
                value:
                  {
                    "enabled": true
                  }
              Guest User - enable with configurable expiry (e.g. 30 days):
                value:
                  {
                    "enabled": true,
                    "config_data": {
                      "expiry_duration_days": 30
                    }
                  }
              Guest User - disable expiry (guest users never auto-deleted):
                value:
                  {
                    "enabled": true,
                    "config_data": {
                      "expiry_duration_days": 0
                    }
                  }
              Encryption or OAuth Enable Request:
                value:
                  {
                    "enabled": true
                  }
              Confirm Encryption or OAuth Enable Request:
                value:
                  {
                    "enabled": true,
                    "verification_code": "<code>"
                  }
              OAuth Disable Request:
                value:
                  {
                    "enabled": false
                  }
              Confirm OAuth Disable Request:
                value:
                  {
                    "enabled": false,
                    "verification_code": "<code>"
                  }
              Advanced User Features - Enable (LITE to ESSENTIALS):
                value:
                  {
                    "enabled": true
                  }
              Advanced User Features - Confirm Enable:
                value:
                  {
                    "enabled": true,
                    "verification_code": "<verification_code>"
                  }
              Advanced User Features - Disable (ESSENTIALS to LITE):
                value:
                  {
                    "enabled": false
                  }
              Advanced User Features - Confirm Disable:
                value:
                  {
                    "enabled": false,
                    "verification_code": "<verification_code>"
                  }
              Node APIs enable:
                value:
                  {
                    "enabled": true,
                    "config_data": {
                      "registered_domain_name": "<domain>",
                      "certificate_arn": "arn:aws:acm:<region>:<account_id>:certificate/<certificate_id>"
                    }
                  }
              Custom user context enable:
                value:
                  {
                    "enabled": true,
                    "config_data": {
                      "custom_auth_userid": "<rainmaker userid>"
                    }
                  }
              Location Trigger Configurations:
                value:
                  weather_trigger_api_key: "15d667eda2b450badfv4d"
                  weather_trigger_polling_interval: 30
                  weather_trigger_host_url: "https://api.openweathermap.org/data/2.5/weather?units=metric"
                  max_weather_triggers_requests_per_minute: 57
              Command Response History:
                value:
                  {
                    "enabled": true
                  }
              "Node Data Access: Admins can Read Params and Config":
                value:
                  enabled: true
                  config_data: "read"
              "Node Data Access: Admins can Write (and read) Params, Config is read-only":
                value:
                  enabled: true
                  config_data: "write"
              Custom SMS:
                value:
                  {
                    "enabled": true,
                    "config_data": {
                      "countries": {
                        "IN": {
                          "sender_id": "sender_id",
                          "entity_id": "entity_id",
                          "event": {
                            "signup": {
                              "id": "signup_sms_template_id",
                              "text": "{#var#} is the OTP for signup"
                            },
                            "forgotpassword": {
                              "id": "forgot_pass_sms_template_id",

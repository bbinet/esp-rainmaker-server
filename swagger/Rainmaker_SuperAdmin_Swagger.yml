    PostAPIConfig:
      type: object
      properties:
        service_name:
          type: string
          description: This field is used to specify the service name.Service name should be unique.
          example: OpenWeather
        api_url:
          type: string
          description: This field is used to specify the api endpoint url of external api.
          example: https://api.example.com
        storage_type:
          type: string
          description: This field is used to specify the storage type. All other configurations are stored in DynamoDB, while sensitive information such as auth token or API key is saved according to the specified storage type. Currently, DynamoDB is the only supported storage type.
          example: dynamodb
        auth_type:
          type: string
          description: This field is used to specify the authorization behaviour of external API.<br>
            Possible Values-<br>
            1. api_key:- This refers to a static API key that is used for     authorization of the external API. It is a fixed and provided by the API provider, which remains constant for each request.<br>
            2. static_auth_token:- This refers to a static auth token that is used for authorization of the external API. It is typically provided by the API provider and remains unchanged for each request. <br>
            3. rotating_auth_token:- This type of authorization involves generating an authentication token by calling a login API. Unlike static tokens, rotating tokens are dynamically generated, often with a limited lifespan. <br>
            4. none:- This indicates that no authorization is required for accessing the API.
          example: api_key
        api_key:
          type: string
          description: Static api key used for authorization of external api. Provide this field only if the auth_type is api_key.
          example:
        auth_token:
          type: string
          description: Static auth token used for authorization of external api. Provide this field only if the auth_type is static_auth_token.
          example:
        auth_send_medium:
          type: string
          description: The medium through which the external API accepts  authorization information.<br>
            Possible Values-<br>
            1. query_param:- This specifies that external api expect auth parameter(api key or auth token) in query params. <br>
            2. http_header:- This specifies that external api expect auth parameter(api key or auth token) in http header.<br>
            Default values-<br>
            1. The default value for the 'api_key' auth type is 'query_param'.<br>
            2. The default value for the 'static_auth_token' and 'rotating_auth_token' auth types is 'http_header'.
          example: query_param
        auth_field_name:
          type: string
          description: The name of the field when sending authorization information.For Ex  While sending an auth token through the HTTP header, the auth_field_name could be 'Authorization' or 'authorization'.<br>
            Default values-<br>
            1. For 'query_param' auth send medium default value is 'api_key'. <br>
            2. For 'http_header' auth send medium default value is 'Authorization'.
          example: Authorization
        login_api_url:
          type: string
          description: This field is used to specify the api endpoint url of login api.
          example: https://api.example.com/login
        login_api_request_type:
          type: string
          description: This field is used to specify the Http request type of login API.
          default: POST
          example: POST
        login_cred_send_medium:
          type: string
          description: The medium through which the login API accepts credentials. <br>
            Possible Values-<br>
            1. query_param:- This specifies that login api expect credentials  in query params. <br>
            2. http_header:- This specifies that login api expect credentials  in http header. <br>
            3. body:- This specifies that login api expect credentials  in request body.
          default: body
          example: body
        login_credentials:
          type: string
          description: Key and value pair of credentials in Json string format.
          example: "{\"user_name\":\"abc@gmail.com\",\"password\":\"1234\"}"
        login_cred_validation_time:
          type: string
          description: Authentication token validity duration, measured in seconds.
          example: 1800
        auth_field_name_in_resp:
          type: string
          description: The field name that contains the authentication token in the login API response.
            For example, if the login API response looks like this {"auth_token":"XXX"}, then the auth_field_name_in_resp is 'auth_token'.
          example: authtoken
        auth_prefix:
          type: string
          description: Prefix to be attached to the authentication token received from the login API before sending it through another API.
      required:
        - service_name
        - api_url
        - auth_type


  /{version}/admin/logs:
    put:
      tags:
        - Logs
      summary: Change log retention in days for log groups and log level for lambda functions
      description: |
        - This API is used to change the log level and/or log retention in days configuration of lambda functions and their respective log groups.
        - To explicitly specify the lambda function name/s, add the list of lambda function names in the `lambda_names` request body parameter.
        - The explicit operation will accept only upto 10 lambda function names as a list of strings.
        - If the `lambda_names` parameter is not provided or is empty, the updation will be performed on all lambda functions and their respective log groups.
        - You can update only the log level, only the retention, or both.
        - Valid values for level are: Debug, Info, Warn, Error
        - Valid values for retention are: 1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, and 3653 days.

        <b>Note:</b>
        - Certain log groups are default set to never expire as their retention settings.
        - Such log groups are only updated when they are explicitly specified in the `lambda_names` parameter.
        - No log group retention settings are updated for these lambda functions in case of all lambda functions updation operation when `lambda_names` parameter is not provided.

      operationId: updateloglevelorretention
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: 'v1'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLogConfigRequest"
            examples:
              Only Log Level for specific lambda functions:
                summary: Only Log Level for specific lambda functions
                value:
                  lambda_names: ["esp-lambda1", "esp-lambda2"]
                  level: "Info"
              Only Log Level for all lambda functions:
                summary: Only Log Level for all lambda functions
                value:
                  level: "Info"
              Only Log Retention for all lambda functions:
                summary: Only Log Retention for all lambda functions
                value:
                  retention: 7
              Only Log Retention for specific lambda functions:
                summary: Only Log Retention for specific lambda functions
                value:
                  lambda_names: ["esp-lambda1"]
                  retention: 7
              Both Log Level and Retention for all lambda functions:
                summary: Both Log Level and Retention for all lambda functions
                value:
                  level: "Debug"
                  retention: 14
              Both Log Level and Retention for specific lambda functions:
                summary: Both Log Level and Retention for specific lambda functions
                value:
                  lambda_names: ["esp-lambda1", "esp-lambda2", "esp-lambda3"]
                  level: "Debug"
                  retention: 14
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APISuccessResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: |
            failure
            <br> Error codes and Error Description
            <br> 100071 - Invalid log level. Valid values are: Debug, Info, Warn, Error
            <br> 100075 - Invalid log retention. Please check the valid values.
            <br> 100076 - Invalid lambda function name
            <br> 100077 - Duplicate lambda function names provided
            <br> 100078 - Too many lambda function names provided. Maximum allowed for explicit update is 10
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure
            <br> Error codes and Error Description
            <br> 100070 - Too many requests, try again later
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure
            <br> Error codes and Error Description
            <br> 100072 - Error while updating log level
            <br> 100073 - Error while updating log retention
            <br> 100074 - Error while listing functions
      security:
        - AccessToken: []


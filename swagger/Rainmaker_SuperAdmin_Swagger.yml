        description: |
          Request body for updating custom mobile message template. The message title can have a maximum of 50 characters and message body can have maximum of 1500 characters. Priority field allows individual configuration for Android and iOS platforms. Priority values are as follows:
          <br>Android: 'high' or 'normal'
          <br>iOS: 1, 5, or 10
        required: true
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/APISuccessResponse'
              examples:
                Update Custom Message Template:
                  value:
                    status: 'success'
                    description: 'Successfully updated custom message template'
        "400":
          description: failure<br>Error Codes and Error Description-
            <br>100006- Invalid request body
            <br>114035- Either message title, message body or event data is missing
            <br>114034- Invalid event type
            <br>114038- Either enable or disable has to specified for event data
            <br>114041- The message body can have a maximum of 1500 characters.
            <br>114042- The message title can have a maximum of 50 characters.
            <br>114046- Either Event Type or Message Title should be present
            <br>114052- Number of '%s' should be 3 which will get substituted by primary user name, request ID and Nodes
            <br>114053- Number of '%s' should be 2 which will get substituted by Node ID and param change Payload
            <br>114054- Number of '%s' should be 2 which will get substituted by Shared_from username and Groupname
            <br>114055- Number of '%s' should be 3 which will get substituted by Shared_to username, Request ID and Groupname
            <br>114056- Number of '%s' should be 1 which will get substituted by Automation name
            <br>114057- Number of '%s' should be 1 which will get substituted by Device ID
            <br>114058- Number of '%s' should be 1 which will get substituted by GroupName
            <br>114062- Number of '%s' cannot be more than 2.
            <br>114063- Number of '%s' should be 2 which will get substituted by primary user name and nodes removed
            <br>114065- Invalid priority value. Priority for android should be either 'high' or 'normal' and for iOS should be either 1, 5, or 10
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformApplicationAPIFailureResponse"
        "429":
          description: failure<br>Error Codes and Error Description-

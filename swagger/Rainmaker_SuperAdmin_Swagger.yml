  /{version}/admin/node_certificates:
    get:
      tags:
        - Node Registration
      summary: Get certificate registration requests, for which certificate registration is in progress.
      description: "This API is to get the certificate files
                    <ul><li>This API is used to fetch list of last 10 requests made that are in_progress when no query parameter is passed</li>
                    <li>If the file_name and request_id is specified certificate file pre-signed download URL is returned (Validity 1hr).</li>
                    <li>If the file_list is set to true then list of certificate files that were uploaded will be sent. </li>
                    <li>We will send the file path after the constant path which is /users/<user_id>/node_certificates/. To support pagination num_records and start_id are present</li><ul>"
      operationId: nodecertificates
      parameters:
        - name: file_name
          in: query
          description: Optional. Name of the file, for which pre-signed download URL is to be fetched.
          schema:
            type: string
        - name: file_list
          in: query
          description: Optional flag **(true/false)**, to indicate if the list of uploaded certificate files need to be returned. Default **(false)**
          schema:
            type: boolean
            default: false
        - name: num_records
          in: query
          description: Optional. Sets the maximum number of keys returned in the response. Default 10
          schema:
            type: string
        - name: start_id
          in: query
          description: Optional. Used for pagination.
          schema:
            type: string
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/GetInProgressCertificatesRegistrationRequestsResponse"
                  - $ref: "#/components/schemas/GetPreSignedDownloadUrlResponse"
                  - $ref: "#/components/schemas/CertificateFileListResponse"
              examples:
                Default Output:
                  value:
                    - status: in_progress
                      request_id: string
                      file_name: file.ext
                      request_timestamp: 1609331995
                      completed_count: 1234
                      total_count: 100000
                Pre Signed Url:
                  value:
                    url: 'pre_signed_url_of_file'
                    status: 'success'
                Get certificate file list from S3:
                  value:
                    keys_list:
                      - <request_id>/file1.ext
                      - file.ext
                    is_truncated: true
                    next_id: file.ext
                    status: success
        "400":
          description: failure
            <br>Error Codes and Error Description
            <br>100001- Error in fetching user details
            <br>100002- API Version is not supported
            <br>100004- You are not authorized to perform this operation, Please contact administrator
            <br>106016- Error occurred while fetching certificate node request
            <br>106017- No registration request in progress
            <br>106008- Error occurred while fetching pre-signed url
            <br>106019- Failed to fetch the certificate file list
            <br>106020- No Certificate have been uploaded
            <br>108129- Request ID is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeManufacturingAPIFailureResponse"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure
            <br>Error Codes and Error Description
            <br>100070- Too many requests, try again later
      security:
        - AccessToken: []

  /{version}/admin/node_certificates/register:
    get:
      tags:
        - Node Registration
      summary: Get Pre-signed url or status of the node certificate registration request
      description: "This API is used to fetch presigned url or status of the node certificate registration request.
                    <li>The user needs to specify either request_id or the file_name.</li>
                    <li>If the request_id is specified then the status of the request is returned.</li>
                    <li>If the file_name is specified then the pre-signed upload URL is returned.</li>"
      operationId: fetchPreSignedUrlOrRequestStatus
      parameters:
        - name: file_name
          in: query
          description: Name of the file, for which upload pre-signed URL is to be fetched.
          schema:
            type: string
        - name: request_id
          in: query
          description: request_id of the existing request to upload/register certificate
          schema:
            type: string
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/GetPreSignedUrlResponse"
                  - $ref: "#/components/schemas/GetRegisteredCertificateStatus"
                  - $ref: "#/components/schemas/GetRegisteredCertificateStatusFailure"
              examples:
                Pre Signed Url:
                  value:
                    url: 'pre_signed_url_of_file'
                    status: 'success'
                Get Request Status:
                  value:
                    status: 'success'
                    completed_count: 'count'
                    total_count: 'count'
                    group_name: 'test-group'
                    group_id: 'test-group-id'
                Get Failed Request Status:
                  value:
                    status: 'failure'
                    description: 'error description'
                    failed_registration: 'certificate_id,node_id'
        "400":
          description: failure<br>Error Codes and Error Description
            <br>100001- Error in fetching user details
            <br>100002- API Version is not supported
            <br>100004- You are not authorized to perform this operation, Please contact administrator
            <br>106003- Error occurred while getting request status. Please try again
            <br>106004- Request_id is not valid
            <br>106008- Error occurred while fetching pre-signed url
            <br>106018- Error occurred while fetching job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeManufacturingAPIFailureResponse"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure
            <br>Error Codes and Error Description
            <br>100070- Too many requests, try again later
      security:
        - AccessToken: []
    post:
      tags:
        - Node Registration
      summary: Triggers the registration of node certificates.
      description: "After the user uploads the .csv file containing the node certificates to s3 bucket this api will be called. It is expected that the user will upload the file containing node certificates separately using CLI/other tool. This API triggers the registration of node certificates and returns the RequestId.
                    <br><br>Filename, file MD5 and request ID(which will be provided in the GET {{url}}/v1/admin/node_certificates/register?file_name=node_certs.csv) are required request parameters while Type, Model, group_name , parent_group_id, subtype, tags, force, update_nodes and refresh_token are optional request parameters.
                    <br><br>Tags should be provided in the form of comma separated node tags e.g: tag1:value1,tag2:value2
                    <br><br>When group name is provided then nodes registered will be added to the given group.
                    <br><br>If group name is not provided then nodes are added to a new node group, the group name would be as below:
                    <li>If no type, model, group name provided, then group name will be Nodes-13Jan2022-16:38
                    <li>If only type is provided (Eg. Lightbulb), then group name will be Lightbulb-13Jan2022-16:38
                    <li>If only model is provided (Eg. led_light), then group name will be led_light-13Jan2022-16:38
                    <li>If both, type and model are provided as above, then group name will be Lightbulb_led_light-13Jan2022-16:38
                    <li>force: This argument will decide whether to ignore(force=True) or return the error (force=False) for duplicate node registration. also updates the existing certificates
                    <li>update_nodes: This argument will decide whether to skip the license check and registration of the device certificates, and only update the nodes table with type, model, subtype, and tags.
                    <li>update_nodes and --force: If both are given, only the existing nodes will be updated with the new type, model, subtype and tags, Also the certificates will be updated.New nodes will be skipped.
                    <li>node_policies: IoT access policies that can be attached to the manufactured nodes, eg. mqtt,videostream
                    <p><br>Either parent groupname or parent groupID can be provided.If both are provided, parent groupid will get precedence.
                    <p><br>If the refresh token is not provided then the nodes would not be added to the group.</p>
                    <br><font color='red'>The node_policies option cannot be used together with update_nodes. If both are provided, the API will fail. Please use only one of them.</font>"
      operationId: uploadnodescertificate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadCertificatesRequest'
        description: Request body to upload certificate files
        required: true
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadCertificatesResponse"
              examples:
                API Request with all allowed params:
                  value:
                    file_name: node_certs.csv
                    file_md5: 18116d4ae069ab2c3e8407b526df4924
                    request_id: <job_request_id>
                    type: LightBulb
                    model: LED1.1
                    group_name: test_group
                    refresh_token: <refresh_token>
                    parent_group_id: <parent_group_id>
                    parent_group_name: <parent_group_name>
                    subtype: bulb
                    tags: tag1:value1,tag2:value2
                    force: true
                    update_nodes: true
                    node_policy: <"","mqtt" or "videostream">
                API Request with mandatory params:
                  value:
                    file_name: node_certs.csv
                    file_md5: 18116d4ae069ab2c3e8407b526df4924
                    request_id: <job_request_id>
        "400":
          description: failure<br>Error Codes and Error Description
            <br>100001- Error in fetching user details
            <br>100002- API Version is not supported
            <br>100004- You are not authorized to perform this operation, Please contact administrator
            <br>100006- Invalid request body
            <br>100029- License file is missing. Please upload a valid license file
            <br>101017- Refresh token failed
            <br>106005- Error occurred while storing node certificate registration request
            <br>106009- File name is missing
            <br>106010- Error occurred while submitting thing registration job
            <br>106011- File md5 is missing
            <br>106022- The count of total registered nodes exceeds RainMaker registered nodes limit
            <br>106024- Please provide refresh token
            <br>106025- Either provide the parent groupname or subgroup along with the parent groupname
            <br>106026- Parent group should not have any parent
            <br>106027- Parent groupname doesn't exist
            <br>106028- Invalid CSV file
            <br>106029- Invalid tags have been passed, please recheck the tag formats and their column references
            <br>108128 - Invalid parent group name
            <br>108129 - Request ID is missing
            <br>106040 - node_policies cannot be used together with update_nodes option. Please use only one of them.

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeManufacturingAPIFailureResponse"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeManufacturingAPIFailureResponse"
          description: failure<br>Error Codes and Error Description
            <br>100070- Too many requests, try again later
        "500":
          description: failure<br>Error Codes and Error Description
            <br>100027- Error occured while parsing public key for license verification
            <br>100029- Error occured while fetching license file contents
            <br>100030- Error occured while parsing license file
            <br>100031- Error occured while verifying license file signature
            <br>100032- Error in decoding base64 encoded signature
            <br>106023- Error getting nodeLimit
            <br>106021- Error occurred while checking if node registration limit is exceeded
            <br>108002- Invalid group name. Group name must be 1 to 256 characters long and !@~#$%^&*()=+{}\|'";<>?[] are not allowed
            <br>108008- Error occurred while fetching node group info details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeManufacturingAPIFailureResponse"
      security:
        - AccessToken: []

  /{version}/admin/api_stats:
    get:
      tags:
        - API Statistics
      summary: This API is used to get the API Statistics
      description: "<p>This API is used to get the statistics for the RainMaker APIs called by clients like Mobile App, Dashboard, etc. Ex: /v1/user, /v1/user/nodes, etc. This information can be queried based on API Path, method and aggregation interval.
                    <br>The data can be retrieved for different aggregation intervals like day, week, month or year
                    and <b>start_time and end_time</b> to specify the date and time range.
                    <ol>
                    <li><b>Day</b> - Max Interval: 31 days and end_time must be strictly greater than the start_time.</li>
                    <li><b>Week</b> - Max Interval: 12 weeks.</li>
                    <li><b>Month</b> - Max Interval: 12 months</li>
                    <li><b>Year</b> - Max Interval: 3 years</li>
                    </ol></p>
                    <p>
                    How Does the API function?
                    <ol>
                    <li> By Default with no parameters passed the API returns the API count for previous day.</li>
                    <li> To get count for aggregation interval <b>day, week, month, year</b> provide repective aggregate, aggregation_interval, start_time, end_time
                      <ol>
                      <li> Start time and end time is used to provide the timeframe for these queries. </li>
                      <li> API path and method can be used in conjunction with group by.</li>
                      </ol>
                    <li> To get top 10 API's called or top 10 users calling the API for a given time duration using num_records and group_by.
                      <ol>
                      <li> Start time and end time is used to provide the timeframe, aggregation interval is not supported for these queries. </li>
                      <li> API path and method can be used in conjunction with group by.</li>
                      <li> Max Interval: 31 days
                      </ol>
                    </li>
                    </ol>
                    </p>
                    <p><font color='red'>Note: </font>
                    <li>If aggregation interval is provided then <b>start_time and end_time</b> needs to be provided for each query.</li>
                    <li>The Range of data that is retrieved are [StartTime,EndTime)</li>
                    <li>When using start_id the inputs passed (apart from start_id and num_records) need to be kept the same for every call.</li>
                    </p>"
      operationId: getAPIStats
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: 'v1'
        - name: api_path
          in: query
          description: "This parameter is used to specify the API path for which count needs to be returned.
                        <br><b>/</b> is a special charecter and encoded as <b>%2F</b> while sending the query parameter "
          required: false
          example: /v1/user
          schema:
            type: string
        - name: method
          in: query
          description: "Supported methods are -
                      <li>POST</li>
                      <li>PUT</li>
                      <li>GET</li>
                      <li>DELETE</li>
                      A single valid method need to be passed."
          example: "POST"
          required: false
          schema:
            type: string
        - name: aggregation_interval
          in: query
          description: "This parameter is used to specify the aggregation interval for the params.
                      They can be -
                      <li>day</li>
                      <li>week</li>
                      <li>month</li>
                      <li>year</li>"
          example: "day"
          required: false
          schema:
            type: string
            default: day
        - name: aggregate
          in: query
          description: "Following aggregate functions are supported -
                      <li><b>count</b> - Returns the number of calls made for the given aggregation interval and time range</li>
                      <br>Only one aggregate function can be specified at a time."
          example: "count"
          required: false
          schema:
            type: string
            default: count
        - name: start_time
          in: query
          description: "This parameter is used to set the start time. The expected Format for start time is epoch time in seconds. Ex: 1628557200"
          example: 1628557200
          required: false
          schema:
            type: number
        - name: end_time
          in: query
          description: "This parameter is used to set the end time. The expected Format for end_date is epoch time in seconds. Ex: 1628557200"
          example: 1628557200
          required: false
          schema:
            type: number
        - name: week_start
          in: query
          description: "This parameter is used to specify the start day of the week. This field is case insensitive.
            Only applicable in cases were the aggregation interval value is <b>week</b>."
          example: "Monday"
          required: false
          schema:
            type: string
            default: Monday
        - name: start_id
          in: query
          description: "This parameter is used for pagination.
                        <br><b>The pagination token can be used for up to 5 Query Invocations, OR for a duration of up to 1 hour whichever comes first.</b>"
          required: false
          schema:
            type: string
        - name: num_records
          in: query
          description: "This parameter is used for pagination and to get top 10 or 20 records."
          required: false
          schema:
            type: number
            default: 25
            maximum: 25
        - name: group_by
          in: query
          description: "This parameter is used to set the field for which the top records are to returned. This field is case-insensitive.
                        <br>Valid values are:
                        <li>api_path
                        <li>user"
          required: false
          example: api_path
          schema:
            type: string
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIStatsSuccessResponse"
              examples:
                Daily Data:
                  value:
                    api_stats:
                      - stats:
                          - api_path: /v1/user
                            method: POST
                            values:
                              - ts: 1625097600
                                val: 35
                              - ts: 1625184000
                                val: 37
                            num_records: 2
                        next_id: string
                        aggregation_interval: day
                        aggregate: count
                Weekly Data:
                  value:
                    api_stats:
                      - stats:
                          - api_path: /v1/user
                            method: POST
                            values:
                              - ts: 1625443200
                                val: 35
                              - ts: 1626048000
                                val: 35
                            num_records: 2
                        next_id: string
                        aggregation_interval: week
                        week_start: Monday
                        aggregate: count
                Monthly Data:
                  value:
                    api_stats:
                      - stats:
                          - api_path: /v1/user
                            method: POST
                            values:
                              - ts: 1625097600
                                val: 35
                              - ts: 1622505600
                                val: 35
                            num_records: 2
                        next_id: string
                        aggregation_interval: month
                        aggregate: count
                Yearly Data:
                  value:
                    api_stats:
                      - stats:
                          - api_path: /v1/user
                            method: POST
                            values:
                              - ts: 1609459200
                                val: 35
                              - ts: 1577836800
                                val: 35
                            num_records: 2
                        next_id: string
                        aggregation_interval: year
                        aggregate: count
                Top 2 API's, num_records=2, group_by=api_path:
                  value:
                    api_stats:
                      - stats:
                          values:
                            - api_path: /v1/user
                              ts: 1625097600
                              val: 35
                            - api_path: /v1/user/nodes
                              ts: 1625097600
                              val: 31
                          num_records: 2
                        next_id: string
                        aggregation_interval: custom
                        aggregate: count
                        group_by: api_path
                Top 2 users, num_records=2, group_by=user:
                  value:
                    api_stats:
                      - stats:
                          values:
                            - user_id: user_id1
                              ts: 1625097600
                              val: 37
                            - user_id: user_id2
                              ts: 1625097600
                              val: 35
                          num_records: 2
                        next_id: string
                        aggregation_interval: custom
                        aggregate: count
                        group_by: user
                Top 2 users calling login API, num_records=2, group_by=user, api_path=/v1/login:
                  value:
                    api_stats:
                      - stats:
                          api_path: /v1/login
                          values:
                            - user_id: user_id1
                              ts: 1625097600
                              val: 37
                            - user_id: user_id2
                              ts: 1625097600
                              val: 35
                          num_records: 2
                        next_id: string
                        aggregation_interval: custom
                        aggregate: count
                        group_by: user
        "400":
          description: failures
            <br>Error Codes And Error Description
            <br>100002- API Version is not supported
            <br>100004- You are not authorized to perform this operation, Please contact administrator
            <br>100021- Invalid query param
            <br>132001- Please provide a valid API Method. [Ex- POST, PUT, GET, DELETE]
            <br>132002- Please provide a valid group by attribute. [Ex- user, api_path]
            <br>132003- Please provide a valid aggregate. [Ex- count]
            <br>132004- Please provide a valid aggregation interval. [Ex- day, week, month, year]
            <br>132005- Please provide a valid week start. [Ex- Monday]
            <br>132006- Please provide a valid start time. The start time is in epoch time in seconds [Ex- 1609459200].
            <br>132007- Please provide a valid end time. The end time is in epoch time in seconds [Ex- 1609459200].
            <br>132008- Please provide a valid time duration
            <br>132009- Start time must be less than end time
            <br>132011- If aggregate is provided then start_time and end_time needs to be provided for each query
            <br>132012- Please provide a valid start id.
            <br>132013- If method is provided then API path needs to be provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TSAPIFailureResponse"
        "429":
          description: Server failures
            <br>Error Codes And Error Description
            <br>100070- Too many requests, try again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TSAPIFailureResponse"
        "500":
          description: Server failures
            <br>Error Codes And Error Description
            <br>100001- Error in fetching user details
            <br>132010- Error getting data from DB. Please try after some time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TSAPIFailureResponse"
      security:
        - AccessToken: []

  /{version}/admin/mqtt_stats:
    get:
      tags:
        - MQTT Statistics
      summary: This API is used to get the MQTT Statistics
      description: "<p>This API is used to get the Statistics for the messages posted by nodes to various MQTT topics like node/+/config, node/+/params/local, etc. and node ID.This information can be queried based on aggregation interval.
                    <br>The data can be retrieved for different aggregation intervals like day, week, month or year
                    and <b>start_time and end_time</b> to specify the date and time range.
                    <ol>
                    <li><b>Day</b> - Max Interval: 31 days and end_time must be strictly greater than the start_time.</li>
                    <li><b>Week</b> - Max Interval: 12 weeks.</li>
                    <li><b>Month</b> - Max Interval: 12 months</li>
                    <li><b>Year</b> - Max Interval: 3 years</li>
                    </ol></p>
                    <p>
                    How Does the API function?
                    <ol>
                    <li> By Default with no parameters passed the API returns the MQTT message count for previous day.</li>
                    <li> To get count for aggregation interval <b>day, week, month, year</b> provide repective aggregate, aggregation_interval, start_time, end_time
                      <ol>
                      <li> Start time and end time is used to provide the timeframe for these queries. </li>
                      <li> MQTT topic and/or node ID can be used in conjunction with group by.</li>
                      </ol>
                    <li> To get top 10 MQTT topics called or top 10 node Ids sending the messages over MQTT topics for a given time duration using num_records and group_by.
                      <ol>
                      <li> Start time and end time is used to provide the timeframe, aggregation interval is not supported for these queries. </li>
                      <li> MQTT topic and/or Node ID can be used in conjunction with group by.</li>
                      <li> Max Interval: 31 days
                      </ol>
                    </li>
                    <li> To get individual raw MQTT messages, use <b>aggregate=raw</b> with required <b>node_id</b> and <b>topic_name</b> parameters.
                      <ol>
                      <li> Returns individual MQTT messages ordered by timestamp descending, with pagination support via next_id/start_id. </li>
                      <li> Maximum time range for raw queries is 31 days. </li>
                      <li> aggregation_interval and group_by are not applicable when aggregate=raw. </li>
                      <li> Default page size is 100 for raw queries. </li>
                      </ol>
                    </li>
                    </ol>
                    </p>
                    <p>
                    <b>Filtering by device metadata:</b>
                    <br>Results can be filtered by device <b>type</b>, <b>model</b>, and <b>fw_version</b>. These form a hierarchy:
                    <li><b>fw_version</b> requires both <b>type</b> and <b>model</b> to be provided.</li>
                    <li><b>model</b> requires <b>type</b> to be provided.</li>
                    <li>These filters work with both <b>aggregate=count</b> and <b>aggregate=raw</b>.</li>
                    </p>
                    <p><font color='red'>Note: </font>
                    <li>If aggregation interval is provided then <b>start_time and end_time</b> needs to be provided for each query.</li>
                    <li>The Range of data that is retrieved are [StartTime,EndTime)</li>
                    <li>When using start_id the inputs passed (apart from start_id and num_records) need to be kept the same for every call.</li>
                    </p>"
      operationId: getStats
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: 'v1'
        - name: topic_name
          in: query
          description: "This parameter is used to specify the MQTT topic name for which count needs to be returned. <b>Required when aggregate=raw.</b>
                        <br><b>/</b> and <b>+</b> is a special charecter and encoded as <b>%2F</b> and <b>%2B</b> respectively while sending the query parameter.<br>Valid topic names are:
                      <ul><li>$aws/events/presence/disconnected/+</li>
                      <li>$aws/events/presence/connected/+</li>
                      <li>node/+/params/local/init</li>
                      <li>node/+/config</li>
                      <li>node/+/otafetch</li>
                      <li>node/+/otastatus</li>
                      <li>node/+/alert</li>
                      <li>node/+/params/local</li>
                      <li>node/+/alert</li>
                      <li>node/+/user/mapping</li>
                      <li>node/+/params/remote</li>
                      <li>node/+/otaurl</li>
                      <li>node/+/tsdata</li>
                      <li>node/+/from-node</ul>"
          required: false
          example: node/+/config
          schema:
            type: string
        - name: node_id
          in: query
          description: "Node IDs which are sending messages over MQTT topics. <b>Required when aggregate=raw.</b>"
          example: "<node_id>"
          required: false
          schema:
            type: string
        - name: aggregation_interval
          in: query
          description: "This parameter is used to specify the aggregation interval for the params.
                      They can be -
                      <li>day</li>
                      <li>week</li>
                      <li>month</li>
                      <li>year</li>
                      <br><b>Not allowed when aggregate=raw.</b>"
          example: "day"
          required: false
          schema:
            type: string
            default: day
        - name: aggregate
          in: query
          description: "Following aggregate functions are supported -
                      <li><b>count</b> - Returns the number of calls made for the given aggregation interval and time range</li>
                      <li><b>raw</b> - Returns individual MQTT messages with pagination. Requires node_id and topic_name. aggregation_interval and group_by are not applicable.</li>
                      <br>Only one aggregate function can be specified at a time."
          example: "count"
          required: false
          schema:
            type: string
            default: count
            enum:
              - count
              - raw
        - name: type
          in: query
          description: "Filter by device type."
          required: false
          example: "esp32"
          schema:
            type: string
        - name: model
          in: query
          description: "Filter by device model. Requires <b>type</b> to be provided."
          required: false
          example: "esp32s2"
          schema:
            type: string
        - name: fw_version
          in: query
          description: "Filter by firmware version. Requires both <b>type</b> and <b>model</b> to be provided."
          required: false
          example: "1.0.0"
          schema:
            type: string
        - name: start_time
          in: query
          description: "This parameter is used to set the start time. The expected Format for start time is epoch time in seconds. Ex: 1628557200"
          example: 1628557200
          required: false
          schema:
            type: number
        - name: end_time
          in: query
          description: "This parameter is used to set the end time. The expected Format for end_date is epoch time in seconds. Ex: 1628557200"
          example: 1628557200
          required: false
          schema:
            type: number
        - name: week_start
          in: query
          description: "This parameter is used to specify the start day of the week. This field is case insensitive.
            Only applicable in cases were the aggregation interval value is <b>week</b>."
          example: "Monday"
          required: false
          schema:
            type: string
            default: Monday
        - name: start_id
          in: query
          description: "This parameter is used for pagination.
                        <br><b>The pagination token can be used for up to 5 Query Invocations, OR for a duration of up to 1 hour whichever comes first.</b>"
          required: false
          schema:
            type: string
        - name: num_records
          in: query
          description: "This parameter is used for pagination and to get top 10 or 20 records.
                        <br>Default: 25 for aggregate=count, 100 for aggregate=raw."
          required: false
          schema:
            type: number
            default: 25
        - name: group_by
          in: query
          description: "This parameter is used to set the field for which the top records are to returned. This field is case-insensitive.
                        <br>Valid values are:
                        <li>topic_name
                        <li>node_id
                        <br><b>Not applicable when aggregate=raw.</b>"
          required: false
          example: topic_name
          schema:
            type: string
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MQTTStatsSuccessResponse"
              examples:
                Daily Data:
                  value:
                    mqtt_stats:
                      - stats:
                          - topic_name: node/+/config
                            node_id: <node_id>
                            values:
                              - ts: 1625097600
                                val: 35
                              - ts: 1625184000
                                val: 37
                            num_records: 2
                        next_id: string
                        aggregation_interval: day
                        aggregate: count
                Weekly Data:
                  value:
                    mqtt_stats:
                      - stats:
                          - topic_name: node/+/config
                            node_id: <node_id>
                            values:
                              - ts: 1625443200
                                val: 35
                              - ts: 1626048000
                                val: 35
                            num_records: 2
                        next_id: string
                        aggregation_interval: week
                        week_start: Monday
                        aggregate: count
                Monthly Data:
                  value:
                    mqtt_stats:
                      - stats:
                          - topic_name: node/+/config
                            node_id: <node_id>
                            values:
                              - ts: 1625097600
                                val: 35
                              - ts: 1622505600
                                val: 35
                            num_records: 2
                        next_id: string
                        aggregation_interval: month
                        aggregate: count
                Yearly Data:
                  value:
                    mqtt_stats:
                      - stats:
                          - topic_name: node/+/config
                            node_id: <node_id>
                            values:
                              - ts: 1609459200
                                val: 35
                              - ts: 1577836800
                                val: 35
                            num_records: 2
                        next_id: string
                        aggregation_interval: year
                        aggregate: count
                Top 2 MQTT topics, num_records=2, group_by=topic_name:
                  value:
                    mqtt_stats:
                      - stats:
                          values:
                            - topic_name: node/+/config
                              ts: 1625097600
                              val: 35
                            - topic_name: node/+/params/local
                              ts: 1625097600
                              val: 31
                          num_records: 2
                        next_id: string
                        aggregation_interval: custom
                        aggregate: count
                        group_by: topic_name
                Top 2 nodes, num_records=2, group_by=node_id:
                  value:
                    mqtt_stats:
                      - stats:
                          values:
                            - node_id: node_id1
                              ts: 1625097600
                              val: 37
                            - node_id: node_id2
                              ts: 1625097600
                              val: 35
                          num_records: 2
                        next_id: string
                        aggregation_interval: custom
                        aggregate: count
                        group_by: node_id
                Top 2 nodes sending messages over node/+/config MQTT topic, num_records=2, group_by=node_id, topic_name=node/+/config:
                  value:
                    mqtt_stats:
                      - stats:
                          topic_name: node/+/config
                          values:
                            - node_id: node_id1
                              ts: 1625097600
                              val: 37
                            - node_id: node_id2
                              ts: 1625097600
                              val: 35
                          num_records: 2
                        next_id: string
                        aggregation_interval: custom
                        aggregate: count
                        group_by: node_id
                Raw Data (aggregate=raw, node_id=<node_id>, topic_name=node/+/config):
                  value:
                    mqtt_stats:
                      - stats:
                          - topic_name: node/+/config
                            node_id: <node_id>
                            values:
                              - ts: 1625184000
                                user_id: user123
                                message_data: "{\"config\":{\"devices\":[{\"name\":\"Light\"}]}}"
                                type: esp32
                                model: esp32s2
                                fw_version: 1.0.0
                              - ts: 1625097600
                                message_data: "{\"config\":{\"devices\":[{\"name\":\"Switch\"}]}}"
                                type: esp32
                                model: esp32s2
                                fw_version: 1.0.0
                            num_records: 2
                        next_id: string
                        aggregate: raw
        "400":
          description: failures
            <br>Error Codes And Error Description
            <br>100004- You are not authorized to perform this operation, Please contact administrator
            <br>100021- Invalid query param
            <br>132002- Please provide a valid group by attribute. [Ex- node_id, topic_name]
            <br>132003- Please provide a valid aggregate. [Ex- count, raw]
            <br>132004- Please provide a valid aggregation interval. [Ex- day, week, month, year]
            <br>132005- Please provide a valid week start. [Ex- Monday]
            <br>132006- Please provide a valid start time. The start time is in epoch time in seconds [Ex- 1609459200].
            <br>132007- Please provide a valid end time. The end time is in epoch time in seconds [Ex- 1609459200].
            <br>132008- Please provide a valid time duration
            <br>132009- Start time must be less than end time
            <br>132011- If aggregate is provided then start_time and end_time needs to be provided for each query
            <br>132012- Please provide a valid start id.
            <br>132015- Invalid request, node_id is required when aggregate=raw
            <br>132016- Invalid request, topic_name is required when aggregate=raw
            <br>132017- Invalid request, aggregation_interval is not supported when aggregate=raw. Please remove aggregation_interval from the request.
            <br>132018- The time duration for raw aggregate must be less than or equal to 31 days
            <br>132019- Invalid request, type is required when model is provided
            <br>132020- Invalid request, type and model is required when fw_version is provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TSAPIFailureResponse"
        "429":
          description: Server failures
            <br>Error Codes And Error Description
            <br>100001- Error in fetching user details
            <br>132010- Error getting data from DB. Please try after some time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TSAPIFailureResponse"
        "500":
          description: Server failures
            <br>Error Codes And Error Description
            <br>100001- Error in fetching user details
            <br>132010- Error getting data from DB. Please try after some time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TSAPIFailureResponse"
      security:
        - AccessToken: []

  /{version}/admin/change_super_admin:
    put:
      tags:
        - Super Admin User Management
      summary: Updates the super admin of rainmaker deployment
      description: "This API updates the super admin of rainmaker deployment. This API assumes that the new super admin user doesn't exist in this RainMaker deployment.
                <br>
                <p><font color='red'><b>Note: </b> </font>
                When the super admin is changed, please send an update about the same to <b>esp-rainmaker-support@espressif.com</b> to ease the management of RainMaker.
                </p>
                "
      operationId: updatesuperadmin
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: 'v1'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/UpdateSuperAdminRequest"
                - $ref: "#/components/schemas/UpdateConfirmSuperAdminRequest"
            examples:
              Initiate a change request:
                value:
                  new_super_admin: user@domain.com
              Confirm the change request:
                value:
                  current_super_admin_code: 453310
                  new_super_admin_code: 409007
        description: Request body for updating super admin username
        required: true
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APISuccessResponse"
        "400":
          description: failure
            <br>Error Codes and Error Description
            <br>100006- Invalid request body
            <br>101002- Email-id is not in correct format
            <br>101010- Super admin update request missing
            <br>101012- Verification code is incorrect
            <br>101062- Please provide new super admin user email or verification codes from current and new super admins.
            <br>101063- Provide a new Super Admin User that doesn't exist already. Tip- Use generalized email rather than a user specific email id
            <br>101065- Invalid request, please use a different email address. Input email address is the same as the current super admin email
            <br>100052- Error, this operation is not supported for oauth-only deployments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAPIFailureResponse"
        "429":
          description: failure
            <br>Error Codes and Error Description
            <br>100070- Too many requests, try again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAPIFailureResponse"
        "500":
          description: failure
            <br>Error Codes and Error Description
            <br>100001- Error in fetching user details
            <br>101005- Sending verification code failed
            <br>101059- Error creating super admin update request
            <br>101060- Error getting super admin update request
            <br>101061- Error updating super admin
            <br>101064- There were some errors when updating the environment variables. Please Deploy the ESP-RainMaker-Core and other addon stacks with updated super admin user name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAPIFailureResponse"
      security:
        - AccessToken: []


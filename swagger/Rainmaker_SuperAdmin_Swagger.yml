  /{version}/admin/common_custom_data:
    put:
      tags:
        - Common Custom Data
      summary: Adds or Updates the common custom data
      description: "This API Adds or Updates the common custom data."
      operationId: commoncustomdataupdate
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: 'v1'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommonCustomDataRequest'
            examples:
              Adding a new name and value (JSON object):
                $ref: '#/components/examples/AddCommonCustomDataJsonObjectExample'
              Modifying the single key in the existing data(JSON object):
                $ref: '#/components/examples/ModifyCommonCustomDataJsonChangeKey'
              Modifying the data by adding a new key (JSON object):
                $ref: '#/components/examples/ModifyCommonCustomDataJsonAddKey'
              Modifying the data by deleting a key(JSON object):
                $ref: '#/components/examples/ModifyCommonCustomDataJsonDeleteKey'
              Adding a new name and value (Array of JSON objects):
                $ref: '#/components/examples/AddCommonCustomDataArrayOfJsonObjectExample'
              Updating description and adding new object in the existing data (Array of JSON objects):
                $ref: '#/components/examples/ModifyCommonCustomDataArrayOfObjectExample'
              Deleting name and value:
                $ref: '#/components/examples/DeleteFaultsNameValue'

        description: 'Request body for adding or updating common custom data. This will be a JSON payload. The maximum storage allowed for each name is 300KB(after payload is trimmed of space and newline characters). It will have fields: name and value. The name should be a string and value can be any of: JSON, string, int, boolean, array of Json objects.When data is an array of objects, user should specify the entire object for modifying the data.When data is json object, user can perform operations similar to user custom data.The common custom data can be empty or it can have some data as shown below:
                      <br>{
                      <br>&nbsp;&nbsp;&nbsp;&nbsp;"name": "faults",
                      <br>&nbsp;&nbsp;&nbsp;&nbsp;"value": [
                      <br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;{
                      <br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"device_type": "ac",
                      <br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"country": "India",

    APNSPlatformApplicationCreateRequest:
      type: object
      description: Supports both certificate-based and token-based APNS authentication for updating existing platform applications. Use auth_type to specify which authentication method to use. <br><b>Specify either certificate based auth or token based auth, not both.</b>
      properties:
        platform:
          type: string
          description: Specify APNS or APNS_SANDBOX as platform for IOS that your app is registered with.
          enum: ["APNS", "APNS_SANDBOX"]
        name:
          type: string
          description: Unique name of the platform
          minLength: 2
          maxLength: 256
          pattern: ^[a-zA-Z0-9_.-]+$
        auth_type:
          type: string
          description: "Authentication type for APNS. Defaults to 'certificate' if omitted."
          enum: ["certificate", "token"]
        ssl_certificate:
          type: string
          description: Apple certificate (required when auth_type is 'certificate')
        private_key:
          type: string
          description: Apple private key (required when auth_type is 'certificate')
        signing_key:
          type: string
          description: Full .p8 file content (PKCS#8 PEM ECDSA private key) for token-based APNS authentication
        signing_key_id:
          type: string
          description: Apple Key ID (exactly 10 characters)
          minLength: 10
          maxLength: 10
        team_id:
          type: string
          description: Apple Team ID (exactly 10 characters)
          minLength: 10
          maxLength: 10
        bundle_id:
          type: string
          description: App bundle identifier (e.g. com.company.app)
      required:
        - platform
        - name

    APNSPlatformApplicationUpdateRequest:
      type: object
      description: Supports both certificate-based and token-based APNS authentication for updating existing platform applications. Use auth_type to specify which authentication method to use. <br><b>Specify either certificate based auth or token based auth, not both.</b>
      properties:
        platform:
          type: string
          description: Specify APNS or APNS_SANDBOX as platform for IOS that your app is registered with.
          enum: ["APNS", "APNS_SANDBOX"]
        name:
          type: string
          description: Name of the platform application to update
          minLength: 2
          maxLength: 256
          pattern: ^[a-zA-Z0-9_.-]+$
        auth_type:
          type: string
          description: "Authentication type for APNS. Defaults to 'certificate' if omitted."
          enum: ["certificate", "token"]
        ssl_certificate:
          type: string
          description: Apple certificate (required when auth_type is 'certificate')
        private_key:
          type: string
          description: Apple private key (required when auth_type is 'certificate')
        signing_key:
          type: string
          description: Full .p8 file content (PKCS#8 PEM ECDSA private key, required when auth_type is 'token')
        signing_key_id:
          type: string
          description: Apple Key ID (exactly 10 characters, required when auth_type is 'token')
          minLength: 10
          maxLength: 10
        team_id:
          type: string
          description: Apple Team ID (exactly 10 characters, required when auth_type is 'token')
          minLength: 10
          maxLength: 10
        bundle_id:
          type: string
          description: App bundle identifier (e.g. com.company.app, required when auth_type is 'token')
      required:
        - platform
        - name


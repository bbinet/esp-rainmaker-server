openapi: 3.0.0
info:
  description: The API Defintions for the Rainmaker APIs, which are used by super admin users.
  version: 1.0.0
  title: ESP RainMaker API Definitions for SuperAdmins
  termsOfService: https://rainmaker.espressif.com/docs/terms-of-use
  contact:
    email: esp-rainmaker-admin@espressif.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
tags:
  - name: Get Deployment details api
    description: API to fetch deployment details
  - name: Cognito App Client
    description: Cognito App Client Operation
  - name: Cognito Domain
    description: Cognito Domain Operation
  - name: Identity Providers
    description: Configure third party Identity Providers for User Authentication
  - name: Message Template
    description: Email Message Customization
  - name: Dashboard
    description: Update Dashboard
  - name: Customer License
    description: License APIs for customer super admin
  - name: Node Registration
    description: Node Registration service will be used by the ESP Rainmaker customers to generate the bulk credentials for the nodes.
  - name: Super Admin User Management
    description: Super Admin User Management
  - name: Sender Email Update
    description: Sender Email Update
  - name: Common Custom Data
  - name: Deployment Setting
    description: Deployment settings api
  - name: Super Admin Configuration
    description: Super Admin Configuration APIs
  - name: IoT Device Rate Limit Configuration
    description: API to configure allowed limits for IoT device metrics
  - name: API Requests Rate Limit Configuration
    description: APIs to fetch or update rate limit for API requests
  - name: Custom Mobile Platform Message Template
    description: Custom Mobile Platform Message Template
  - name: Mobile Platform Application
    description: Manage platform application
  - name: Publish Message
    description: Publish Message
  - name: External API Pass Through Service
    description: External API Pass Through Service will be used by the ESP Rainmaker customers to call external APIs.
  - name: Node Certificate CA
    description: Node Certificate CA management
  - name: Webhook Integration
    description: API to manage the configuration for Webhook integration.
  - name: Statistical Service
    description: Rainmaker Statistical Service APIs
  - name: Mail Delivery Failure Logs
    description: APIs to fetch the email failure logs
  - name: API Gateway Stage
    description: Update API Gateway stage
  - name: Terms Policy
    description: Operations on Terms of Use and Privacy Policys text files
  - name: Cloudwatch Log IAM user
    description: Add or remove IAM user with permission to read cloudwatch Logs
  - name: Logs
    description: Operations on Log Group Retention and Lambda Function Log Level
  - name: Rainmaker Deployment capabilities
    description: Operations for rainmaker capabilities
  - name: API Statistics
    description: Get the API Statistics
  - name: MQTT Statistics
    description: Get the MQTT Statistics
  - name: Matter Setup APIs for Getting DAC
    description: Get the DAC for RM+M node
  - name: Node Parameter Operations
    description: Operations on Node Parameter
    # Add new APIs above this
  - name: Admin User Management [Deprecated]
    description: These APIs are <font color='red'>Deprecated</font>. Check the APIs in the 'Admin User Management' group above.
paths:
  /{version}/admin/cognito_appclient:
    post:
      tags:
        - Cognito App Client
      summary: Creates a new Cognito app client
      description: "This API is used to create a new Cognito app client."
      operationId: createcognitoappclient
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: 'v1'
        - name: email_mobile_userpool
          in: query
          description: Points to userpool which supports mobile and email based authentication
          required: true
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCognitoAppClientRequest"
        description: Request body to create a new Cognito app client
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APISuccessResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure
            <br>Error Codes and Error Description
            <br> 100001 - Error in fetching user details
            <br> 100002 - API Version is not supported
            <br> 100004 - You are not authorized to perform this operation, Please contact administrator
            <br> 100006 - Invalid request body
            <br> 112062 - Client Name is missing
            <br> 112064 - Client name already exists
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure
            <br>Error Codes and Error Description
            <br> 112001 - Error occurred while creating app client
            <br> 112002 - Error occurred while fetching app client
            <br> 112063 - Error occurred while adding client
      security:
        - AccessToken: []

    put:
      tags:
        - Cognito App Client
      summary: Updates configuration of Cognito app client
      description: "This API is used to configure Cognito app client."
      operationId: updateappclient
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: 'v1'
        - name: email_mobile_userpool
          in: query
          description: Points to userpool which supports mobile and email based authentication
          required: false
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAppClientRequest"
        description: The required parameter client_id is the unique id given to user pool client. You can get the client_id from Rainmaker Dashboard.On Rainmaker Dashboard, go to Deployment settings, select Cognito Configuration tab. In Cognito App Client Configurations section, you can get the client_id of  all configured user pool
          clients. <br>Either providers or callback_urls must be provided in request body.<br> Providers field is the list of Identity Providers that you want to configure. callback URL indicates where the user is to be redirected after a successful sign-in.
          If providers or callback_urls is not specified, it will be
          updated as blank.
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APISuccessResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure
            <br>Error Codes and Error Description
            <br> 101001 - Error in fetching user details
            <br> 100002 - API Version is not supported
            <br> 100004 - You are not authorized to perform this operation, Please contact administrator
            <br> 100006 - Invalid request body
            <br> 112003 - Either callback url or identity providers to be enabled has to be specified
            <br> 112004 - Client Id is missing
            <br> 112005 - Please provide a valid identity provider type from given options[Google/Github/SignInWithApple]
            <br> 112007 - Error occurred while updating app client
            <br> 112032 - Callback Url is incorrect
            <br> 112044 - Please provide a valid identity provider type from given options[Google/SignInWithApple/OIDC/WeChat/WeChatPc]
            <br> 112068 - Callback url is missing
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure
            <br>Error Codes and Error Description
            <br> 100070 - Too many requests, try again later
      security:
        - AccessToken: []
    get:
      tags:
        - Cognito App Client
      summary: Gives details of all configured Cognito app clients
      description: "This API lists configured Cognito app clients and gives details of each app client"
      operationId: getappclient
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: 'v1'
        - name: email_mobile_userpool
          in: query
          description: Points to userpool which supports mobile and email based authentication
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCognitoAppClientsResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure
            <br>Error Codes and Error Description
            <br> 100002 - API Version is not supported
            <br> 100001 - Error in fetching user details
            <br> 100004 - You are not authorized to perform this operation, Please contact administrator
            <br> 112001 - Error occurred while listing all app clients
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure
            <br>Error Codes and Error Description
            <br> 100070 - Too many requests, try again later
      security:
        - AccessToken: []

  /{version}/admin/cognito_domain:
    post:
      tags:
        - Cognito Domain
      summary: Creates Cognito domain
      description: "This API is used to create Cognito domain name. The domain name is domain that hosts the sign-up and sign-in pages for your application. "
      operationId: createcognitodomain
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: 'v1'
        - name: email_mobile_userpool
          in: query
          description: Points to userpool which supports mobile and email based authentication
          required: false
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDomainRequest"
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APISuccessResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure
            <br>Error Codes and Error Description
            <br> 100001 - Error in fetching user details
            <br> 100002 - API Version is not supported
            <br> 100004 - You are not authorized to perform this operation, Please contact administrator
            <br> 100006 - Invalid request body
            <br> 112026 - Error occurred while configuring cognito domain name
            <br> 112027 - Domain name is already configured
            <br> 112028 - Domain name already associated with another user pool
            <br> 112031 - Domain name is missing
            <br> 112035 - The domain name is invalid. Domain names can only contain lower-case letters, numbers, and hyphens
            <br> 100052 - Error, this operation is not supported for oauth-only deployments
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure
            <br>Error Codes and Error Description
            <br> 100070 - Too many requests, try again later
      security:
        - AccessToken: []

    get:
      tags:
        - Cognito Domain
      summary: Fetches Cognito domain
      description: "This API is used to get Cognito domain name"
      operationId: getcognitodomain
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: 'v1'
        - name: email_mobile_userpool
          in: query
          description: Points to userpool which supports mobile and email based authentication
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDomainRequest"
        "400":
          description: failure
            <br>Error Codes and Error Description
            <br> 100001 - Error in fetching user details
            <br> 100002 - API Version is not supported
            <br> 100004 - You are not authorized to perform this operation, Please contact administrator
            <br> 112025 - Error occurred while fetching cognito domain name
            <br> 100052 - Error, this operation is not supported for oauth-only deployments
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure
            <br>Error Codes and Error Description
            <br> 100070 - Too many requests, try again later
      security:
        - AccessToken: []

    delete:
      tags:
        - Cognito Domain
      summary: Deletes Cognito domain
      description: "This API deletes the cognito domain configured in user account"
      operationId: deletecognitodomain
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: 'v1'
        - name: email_mobile_userpool
          in: query
          description: Points to userpool which supports mobile and email based authentication
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APISuccessResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure
            <br>Error Codes and Error Description
            <br> 100002 - API Version is not supported
            <br> 100006 - Invalid request body
            <br> 100001 - Error in fetching user details
            <br> 100004 - You are not authorized to perform this operation, Please contact administrator
            <br> 112025 - Error occurred while fetching cognito domain name
            <br> 112029 - Error occurred while deleting domain name
            <br> 112030 - Domain name is not configured
            <br> 100052 - Error, this operation is not supported for oauth-only deployments
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure
            <br>Error Codes and Error Description
            <br> 100070 - Too many requests, try again later
      security:
        - AccessToken: []

  /{version}/admin/identity_provider:
    post:
      tags:
        - Identity Providers
      summary: Configures Identity Providers
      description: "This API configures Identity Providers for user authentication."
      operationId: configureidentityprovider
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: 'v1'
        - name: email_mobile_userpool
          in: query
          description: Points to userpool which supports mobile and email based authentication
          required: false
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/CreateIdentityProviderRequestApple"
                - $ref: "#/components/schemas/CreateIdentityProviderRequestGeneric"
                - $ref: "#/components/schemas/CreateIdentityProviderRequestGithub"
                - $ref: "#/components/schemas/CreateIdentityProviderRequestOidc"
            examples:
              SignInWithApple:
                $ref: "#/components/examples/CreateIdentityProviderRequestApple"
              Google | WeChat, WeChatPc (OAuth only deployment):
                $ref: "#/components/examples/CreateIdentityProviderRequestGeneric"
              GitHub:
                $ref: "#/components/examples/CreateIdentityProviderRequestGithub"
              OIDC provider (OAuth only deployment):
                value:
                  provider_type: "oidc"
                  provider_name: "Cognito"
                  oidc_issuer: "https://cognito-idp.us-east-1.amazonaws.com/<userPoolId>"
                  client_id: "3on5n64tifa0le9via3g1aolfb"
                  client_secret: "<secret>"
                  scope: "openid+profile"
        description: Provider Type is required parameter. ClientId, KeyId, TeamId and PrivateKey are required for configuration of SignInWithApple. Client Id and Client Secret are required for configuring Goolge and GitHub identity providers.
        required: true
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APISuccessResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: 'failure
            <br>Error Codes and Error Description

            <br> 100001 - Error in fetching user details
            <br> 100002 - API Version is not supported
            <br> 100004 - You are not authorized to perform this operation, Please contact administrator
            <br> 100006 - Invalid request body
            <br> 112004 - Client Id is missing
            <br> 112005 - Please provide a valid identity provider type from given options[Google/Github/SignInWithApple]
            <br> 112010 - ClientId, KeyId, TeamId and PrivateKey are required while configuring SignInWithApple
            <br> 112011 - Client Secret is missing
            <br> 112012 - Identity provider with the same name already exists
            <br> 112014 - Error occurred while configuring identity provider
            <br> 112038 - Error occured while getting OpenID Provider config
            <br> 112039 - Error, Issuer url is missing
            <br> 112040 - Error, Provider name is missing
            <br> 112042 - Unsupported response type. Supported types: [code]
            <br> 112043 - Unsupported token endpoint auth method. Supported types: [client_secret_basic,client_secret_post]
            <br> 112046 - Invalid OIDC Connect URL or Client Id format. Must be less than 128 characters and can contain only alphanumeric characters, spaces and symbols [.-;/]
            <br> 112055 - Invalid scope. Please enter a valid scope containing [ email, phone, profile ]
            <br> 112047 - Unsupported grant types. Supported types: [authorization_code, password]
            <br> 112048 - Refresh token grant is missing
            '
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure
            <br>Error Codes and Error Description
            <br> 100070 - Too many requests, try again later
      security:
        - AccessToken: []

    put:
      tags:
        - Identity Providers
      summary: Updates Identity Providers
      description: "This API is used to update Identity Providers for user authentication"
      operationId: updateidentityprovider
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: 'v1'
        - name: email_mobile_userpool
          in: query
          description: Points to userpool which supports mobile and email based authentication
          required: false
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/CreateIdentityProviderRequestApple"
                - $ref: "#/components/schemas/CreateIdentityProviderRequestGeneric"
                - $ref: "#/components/schemas/CreateIdentityProviderRequestGithub"
                - $ref: "#/components/schemas/CreateIdentityProviderRequestOidc"
            examples:
              SignInWithApple:
                $ref: "#/components/examples/CreateIdentityProviderRequestApple"
              Google | WeChat, WeChatPc (OAuth only deployment):
                $ref: "#/components/examples/CreateIdentityProviderRequestGeneric"
              GitHub:
                $ref: "#/components/examples/CreateIdentityProviderRequestGithub"
              OIDC provider (OAuth only deployment):
                value:
                  provider_type: "oidc"
                  provider_name: "Cognito"
                  oidc_issuer: "https://cognito-idp.us-east-1.amazonaws.com/<userPoolId>"
                  client_id: "3on5n64tifa0le9via3g1aolfb"
                  client_secret: "<secret>"
                  scope: "openid+profile"
        description: Provider Type is required parameter. ClientId, KeyId, TeamId and PrivateKey are required for configuration of SignInWithApple.Client Id and Client Secret are required for configuring Goolge and GitHub identity providers.Provider name is optional parameter.
        required: true
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APISuccessResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: 'failure
            <br>Error Codes and Error Description
            <br> 100002 - API Version is not supported
            <br> 100006 - Invalid request body
            <br> 100001 - Error in fetching user details
            <br> 100004 - You are not authorized to perform this operation, Please contact administrator
            <br> 112004- Client Id is missing
            <br> 112005 - Please provide a valid identity provider type from given options[Google/Github/SignInWithApple]
            <br> 112010 - ClientId, KeyId, TeamId and PrivateKey are required while configuring SignInWithApple
            <br> 112011 - Client Secret is missing
            <br> 112045 - Error, the identity provider does not exist
            <br> 112046 - Invalid OIDC Connect URL or Client Id format. Must be less than 128 characters and can contain only alphanumeric characters, spaces and symbols [.-;/]
            <br> 112055 - Invalid scope. Please enter a valid scope containing [ email, phone, profile ]
            <br> 112047 - Unsupported grant types. Supported types: [authorization_code, password]
            <br> 112048 - Refresh token grant is missing
            '
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure
            <br>Error Codes and Error Description
            <br> 100070 - Too many requests, try again later
      security:
        - AccessToken: []

    get:
      tags:
        - Identity Providers
      summary: Fetches Configured Identity Providers
      description: "This API is used to get all configured Identity Providers"
      operationId: getidentityprovider
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: 'v1'
        - name: email_mobile_userpool
          in: query
          description: Points to userpool which supports mobile and email based authentication
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetIdentityProviderResponse"
              examples:
                Identity Providers:
                  value:
                    identity_providers:
                      GitHub:
                        client_id: client_id
                        client_secret: 'client_secret'
                      Google:
                        client_id: client_id
                        client_secret: client_secret
                      SignInWithApple:
                        client_id: client_id
                        team_id: team_id
                Identity Providers(OAuth only deployment):
                  value:
                    identity_providers:
                      Google:
                        client_id: client_id
                        client_secret: client_secret
                        oidc_issuer: https://accounts.google.com
                      SignInWithApple:
                        client_id: client_id
                        client_secret: client_secret
                        team_id: team_id
                        key_id: key_id
                        oidc_issuer: https://appleid.apple.com
                      ProviderName:
                        client_id: client_id
                        client_secret: client_secret
                        oidc_issuer: https://cognito-idp.us-east-1.amazonaws.com/<userPoolId>
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure
            <br>Error Codes and Error Description
            <br> 100001 - Error in fetching user details
            <br> 100002 - API Version is not supported
            <br> 100004 - You are not authorized to perform this operation, Please contact administrator
            <br> 112008 - Error occurred while fetching identity provider details
            <br> 112009 - Please configure Identity Providers to get the details
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure
            <br>Error Codes and Error Description
            <br> 100070 - Too many requests, try again later
      security:
        - AccessToken: []

    delete:
      tags:
        - Identity Providers
      summary: Delete Identity Provider
      description: "This API is used to delete Identity Providers"
      operationId: deleteidentityprovider
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: 'v1'
        - name: email_mobile_userpool
          in: query
          description: Points to userpool which supports mobile and email based authentication
          required: false
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/DeleteIdentityProviderRequestGeneric"
                - $ref: "#/components/schemas/DeleteIdentityProviderRequestOidc"
            examples:
              Generic:
                $ref: "#/components/examples/DeleteIdentityProviderRequestGeneric"
              OIDC provider (OAuth only deployment):
                $ref: "#/components/examples/DeleteIdentityProviderRequestOIDC"
        required: true
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APISuccessResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: 'failure
            <br>Error Codes and Error Description
            <br> 100002 - API Version is not supported
            <br> 100006 - Invalid request body
            <br> 100001 - Error in fetching user details
            <br> 100004 - You are not authorized to perform this operation, Please contact administrator
            <br> 112044 - Please provide a valid identity provider type from given options[Google/SignInWithApple/OIDC/WeChat/WeChatPc]
            <br> 112008 - Error occurred while fetching identity provider details
            <br> 112045 - Error, the identity provider does not exist
            <br> 112055 - Error occurred while deleting identity provider details
            <br> 112056 - Provider type is missing
            <br> 112057 - Invalid provider type
            <br> 112058 - Provider name is required for OIDC provider type
            <br> 112059 - Provider details are invalid
            <br> 112060 - Error occurred while deleting OpenID Connect provider
            <br> 112061 - Error occurred while updating identity pool
            '
      security:
          - AccessToken: []

  /{version}/admin/message_template:
    post:
      tags:
        - Message Template
      summary: Creates Message Template
      description: "This API is used to customize Email messages sent to users. For example, to customize Email message which has verification code for user verification, template type is EMAIL_INVITE_MESSAGE."
      operationId: addmessagetemplate
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: 'v1'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/AddMessageTemplateRequest"
                - $ref: "#/components/schemas/AddSMSTemplateRequest"
            examples:
              Add Email template:
                value:
                  "message_subject": "Email Message Subject"
                  "message_text": "Email Message Text"
                  "template_type": "EMAIL_INVITE_MESSAGE"
                  "locale": "english"
                  "default": false
              Add SMS template:
                value:
                  "message_text": "SMS Message text"
                  "template_type": "SMS_DELETE_USER_REQUEST_MESSAGE"
                  "locale": "english"
                  "default": false
        description: |
          <p>For <b>EMAIL</b> templates, the required parameters are:</p> <ul>
          <li><b>Message Subject</b></li>
          <li><b>Message Text</b></li>
          <li><b>Template Type</b></li> </ul> <p>For <b>SMS</b> templates, the required parameters are:</p> <ul>
          <li><b>Message Text</b></li>
          <li><b>Template Type</b></li> </ul> <p>All emails are sent from the default SES verified email address and the SMS from the default registered custom sender ID.</p> <h4>Valid Template Types:</h4><ul>
          <li>EMAIL_INVITE_MESSAGE - This email is sent to new users for sign-up verification code.</li>
          <li>EMAIL_WELCOME_MESSAGE_ADMIN - This email is sent to admin users created by super admin. It consists of new admin user's login details.</li>
          <li>EMAIL_WELCOME_MESSAGE_USER - This email is sent to users created by super admin. It consists of new user's login details</li>
          <li>EMAIL_DELETE_USER_REQUEST_MESSAGE - This email is used to send the verification code for account deletion to the requesting user.</li>
          <li>EMAIL_FORGOT_PASSWORD_MESSAGE - This email is used to send the forgot password request verification code.</li>
          <li>EMAIL_DELETE_USER_CONFIRM_MESSAGE - This email is used to send the account deletion confirmation message.</li>
          <li>EMAIL_TAGS_ASSIGNMENT_VERIFICATION_MESSAGE - This email is used to send verification code for tags assignment confirmation.</li>
          <li>SMS_DELETE_USER_REQUEST_MESSAGE - This SMS is used to send the verification code for account deletion to the requesting phone number user.</li> </ul> <h4>Message Text Placeholders:</h4> <ul>
          <li>Must include <i>{####}</i> as a placeholder for the verification code.</li>
          <li>Must include <i>{{enter_email}}</i> as a placeholder for the user's email.</li>
          <li>Must include <i>{{enter_password}}</i> as a placeholder for the user's password for login emails.</li>
          <li>Can optionally include <i>{{assigned_tags}}</i> for adding assigned tags in the email, applicable only for the TAGS_ASSIGNMENT_VERIFICATION_MESSAGE template type.</li>
          <li>For the template type: EMAIL_WELCOME_MESSAGE_ADMIN, it is <b>recommended</b> to add placeholder <i>{{enter_http_api_base_url}}</i> for adding the HTTP API Base URL in the email and placeholder <i>{{enter_api_base_url}}</i> for adding the REST API Base URL(non-OAuth deployments) in the email </li> </ul> <h4>Locale (optional):</h4> <p>Stores the language locale of a template entry in the database.</p> <ul> <li><b>Reserved value:</b> <code>"rm_non_branded"</code> — This locale value is designated for internal use and is utilized for sending emails when no default email of any other locale is configured for the given template type. If this value is provided, it will result in an "Invalid locale" error.</li> <li>If the input locale is an empty string, it defaults to <code>"no_locale"</code>.</li> <li>The <code>"no_locale"</code> value currently applies to all pre-configured templates. To modify the locale value, use the API - <code>PUT /admin/message_template</code>.</li> <li>For each template type, the locale must be unique—no duplicate (template type, locale) entries are allowed.</li><li>It is case-insensitive and all input locales will be considered in lowercase.</li> </ul> <h4>Default Template (optional):</h4> <p>Indicates whether a template is set as the default (<code>default = true</code>) for a given template type.</p> <ul>
          <li>If a user's preferred locale template for a particular type does not exist, the default template is used.</li><li>If empty or not given, its value is considered as <code>default = false</code>.</li>
          <li>At any given time, only one template with <code>default = true</code> exists per template type, regardless of locale.</li><li><b>When a new template is marked as <code>default = true</code>:</b> <li>The current default template for that template type is automatically reset to <code>default = false</code>.</li> <li>This ensures that only one default template exists at any given time per template type.</li> </ul> </li> </ul>
        required: true
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APISuccessResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure
            <br>Error Codes and Error Description
            <br> 100001 - Error in fetching user details
            <br> 100002 - API Version is not supported
            <br> 100004 - You are not authorized to perform this operation, Please contact administrator
            <br> 100006 - Invalid request body
            <br> 100017 - Invalid email address
            <br> 100052 - Error, this operation is not supported for oauth-only deployments
            <br> 112017 - Template type is empty
            <br> 112018 - Message Body is empty
            <br> 112019 - Email Message is invalid. Email message must include a {####} placeholder for verification code
            <br> 112020 - Message subject is empty
            <br> 112036 - Invalid message template type. Valid values are INVITE_MESSAGE, WELCOME_MESSAGE_ADMIN, WELCOME_MESSAGE_USER, DELETE_USER_REQUEST_MESSAGE, FORGOT_PASSWORD_MESSAGE, DELETE_USER_CONFIRM_MESSAGE, TAGS_ASSIGNMENT_VERIFICATION_MESSAGE and SMS_DELETE_USER_REQUEST_MESSAGE
            <br> 112047 - Message template of given template type and locale already exists
            <br> 112048 - Invalid locale. Please enter a valid locale
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure
            <br> Error codes and Error Description
            <br> 100070 - Too many requests, try again later
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure
            <br> Error codes and Error Description
            <br> 112021 - Error occurred while storing message template
            <br> 112015 - Error occurred while fetching message templates
            <br> 112022 - Error occurred while configuring message template
      security:
        - AccessToken: []
    get:
      security:
        - AccessToken: []
      tags:
        - Message Template
      summary: Fetches Message Templates
      description: |
        This API retrieves stored message templates. Message templates are used for Email and SMS messages sent to users.
        <h4>Query Parameters and Validations:</h4>
        <ul>
          <li><code>template_type</code>: (Optional) The type of message template. If provided without <code>locale</code>, all templates of the given type are fetched.</li>
          <li><code>locale</code>: (Optional) The language locale of the template. If provided with <code>template_type</code>, only the specific template matching both is fetched.</li>
          <li><code>default</code>: (Optional) If <code>true</code>, with a provided <code>template_type</code>, returns only the default template for the given template type.</li>
          <li> Otherwise a list of all stored message templates are returned. </li>
        </ul>
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: 'v1'
        - name: template_type
          in: query
          description: (Optional) The type of message template to retrieve.
          required: false
          schema:
            type: string
            enum: [EMAIL_INVITE_MESSAGE, EMAIL_WELCOME_MESSAGE_ADMIN, EMAIL_WELCOME_MESSAGE_USER, EMAIL_DELETE_USER_REQUEST_MESSAGE, EMAIL_DELETE_USER_CONFIRM_MESSAGE, EMAIL_FORGOT_PASSWORD_MESSAGE, EMAIL_TAGS_ASSIGNMENT_VERIFICATION_MESSAGE, SMS_DELETE_USER_REQUEST_MESSAGE]
        - name: locale
          in: query
          description: (Optional) The language locale of the template. It is case-insensitive and input locale will be considered in lowercase.
          required: false
          schema:
            type: string
        - name: default
          in: query
          description: (Optional) If set to true, returns only the default template for the given template type.
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMessageTemplateResponse"
              examples:
                Get all message templates:
                  value: [
                    {
                      "message_subject": "message_subject",
                      "message_text": "message_text",
                      "template_type": "EMAIL_WELCOME_MESSAGE_USER",
                      "locale": "en-us",
                      "default": true
                    },
                    {
                      "message_subject": "message_subject",
                      "message_text": "message_text",
                      "template_type": "EMAIL_FORGOT_PASSWORD_MESSAGE",
                      "locale": "es-es",
                      "default": false
                    }
                  ]
                Get template by type only:
                  value: [
                    {
                      "message_subject": "message_subject",
                      "message_text": "message_text",
                      "template_type": "EMAIL_FORGOT_PASSWORD_MESSAGE",
                      "locale": "en-us",
                      "default": false
                    },
                    {
                      "message_subject": "message_subject",
                      "message_text": "message_text",
                      "template_type": "EMAIL_FORGOT_PASSWORD_MESSAGE",
                      "locale": "es-es",
                      "default": false
                    },
                    {
                      "message_subject": "message_subject",
                      "message_text": "message_text",
                      "template_type": "EMAIL_FORGOT_PASSWORD_MESSAGE",
                      "locale": "en-gb",
                      "default": true
                    },
                    {
                      "message_subject": "message_subject",
                      "message_text": "message_text",
                      "template_type": "EMAIL_FORGOT_PASSWORD_MESSAGE",
                      "locale": "rm_non_branded",
                      "default": false
                    }
                  ]
                Get default template for a specific template type:
                  value:
                    {
                      "message_subject": "message_subject",
                      "message_text": "message_text",
                      "template_type": "EMAIL_FORGOT_PASSWORD_MESSAGE",
                      "locale": "es-es",
                      "default": false
                    }
                Get template by type and locale:
                  value:
                    {
                      "message_subject": "message_subject",
                      "message_text": "message_text",
                      "template_type": "EMAIL_FORGOT_PASSWORD_MESSAGE",
                      "locale": "fr-fr",
                      "default": true
                    }
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure
            <br>Error Codes and Error Description
            <br> 100001 - Error in fetching user details
            <br> 100002 - API Version is not supported
            <br> 100004 - You are not authorized to perform this operation, Please contact administrator
            <br> 112015 - Error occurred while fetching message templates
            <br> 112016 - Message template not found
            <br> 100052 - Error, this operation is not supported for oauth-only deployments
            <br> 112036 - Invalid message template type. Valid values are EMAIL_INVITE_MESSAGE, EMAIL_WELCOME_MESSAGE_ADMIN, EMAIL_WELCOME_MESSAGE_USER, EMAIL_DELETE_USER_REQUEST_MESSAGE, EMAIL_FORGOT_PASSWORD_MESSAGE, SMS_DELETE_USER_REQUEST_MESSAGE,EMAIL_DELETE_USER_CONFIRM_MESSAGE and EMAIL_TAGS_ASSIGNMENT_VERIFICATION_MESSAGE
            <br> 112048 - Invalid locale. Please enter a valid locale
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure
            <br> Error codes and Error Description
            <br> 100070 - Too many requests, try again later
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure
            <br> Error codes and Error Description
            <br> 112015 - Error occurred while fetching message templates
            <br> 112022 - Error occurred while configuring message template

    put:
      security:
        - AccessToken: []
      tags:
        - Message Template
      summary: Updates Message Templates
      description: |
        This API updates stored message templates. The request body shall contain only those fields which are to be updated. If locale needs to be updated, then 'locale' as well as the 'new_locale' fields should be mentioned. If the input locale is an empty string, it defaults to <code>"no_locale"</code>. Else the given locale and its template type will be considered for updating any other field given. locale is case-insensitive and all input locales will be considered in lowercase.
      parameters:
        - name: version

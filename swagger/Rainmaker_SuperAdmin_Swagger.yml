  /{version}/admin/push_notification/publish_message:
    post:
      tags:
        - Publish Message
      summary: Publish message to user's device
      description: "This API will be used to publish messages to user's device in a bulk of 100000 users. \n\n If the users wants to publish the message to specific users, at least one of <b>email</b> or <b>user_id</b> list needs to be provided. <b>user_id</b> has more preference over <b>email</b>. \n\n If the users wants to publish to all non-internal users then only the <b>publish_to_all_users</b> should be set to <b>true</b>, without any fields - email and user_id"
      operationId: publishMessage
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: 'v1'
        - name: send_data_only
          in: query
          description: When set to true, GCM messages will be sent in the data field instead of notification field. iOS (APNS) is not impacted by this parameter.
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/PublishMessageToSpecificUsers'
                - $ref: '#/components/schemas/PublishMessageToAllUsers'
            examples:
              Publish message to specific users:
                value:
                  message_title: '<message title>'
                  message_body: '<message body>'
                  email: 'email_id1@domain.com,email_id1@domain.com'
                  user_id: 'user_id1,user_id2'
                  type: 'ADVERTISEMENT'
                  additional_info: {
                    "key_1": "value_1",
                    "key_2": "value_2"
                  }
              Publish message to all users:
                value:
                  message_title: '<message title>'
                  message_body: '<message body>'
                  publish_to_all_users: true
                  type: 'ADVERTISEMENT'
                  additional_info: {
                    "key_1": "value_1",
                    "key_2": "value_2"
                  }
        description: Request body for publish message.The message title can have a maximum of 50 characters and message body can have maximum of 1500 characters. The message type and additonal_info are optional parameters. The message type can have a maximum of 25 characters and the additional info can have a total of 1400 characters with each key not excedding 50 characters and each value not excedding 150 characters.
        required: true
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APISuccessResponse"
        "400":
          description: failure <br>Error Codes and Error Description
            <br> 100006 - Invalid request body
            <br> 100024 - Either email or user id is missing
            <br> 114022 - Message title is missing
            <br> 114023 - Message body is missing
            <br> 114027 - Message can be sent to a maximum 100000 users only
            <br> 114041 - The message body can have a maximum of 1500 characters.
            <br> 114042 - The message type can have a maximum of 25 characters.
            <br> 114043 - The additional info key and attribute can have maximum 50 and 150 characters respectively.
            <br> 114044 - The message additonal info can have a maximum of 1400 characters in total.
            <br> 114051 - Error, message type and additional information must be provided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformApplicationAPIFailureResponse"
        "429":
          description: failure <br>Error Codes and Error Description
            <br> 100070 - Too many requests, try again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformApplicationAPIFailureResponse"
        "500":
          description: failure <br>Error Codes and Error Description
            <br> 114024 - Error occurred while publishing message
            <br> 114039 - Error occurred while publishing messages to users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformApplicationAPIFailureResponse"
      security:
        - AccessToken: []

  /{version}/user/assume_role:
    post:
      tags:
        - Assume Role
      summary: Assume a role and get temporary credentials
      description: |
        This API allows a user to assume a role and get temporary security credentials for MQTT and other AWS services.
        - `user_role` is optional. If not provided or empty, it defaults to `mqtt`. Only the values `mqtt` and `videostream` is supported. Any other value will result in an error.
        - `videostream` requires `node_ids` to generate credentials. `mqtt` works with `group_ids` and `node_ids`
        - `group_ids` and `node_ids` are both optional arrays (max 5 each). Only one of them can be non-empty in a request. If both are provided, the request will be rejected.
        - If both `group_ids` and `node_ids` are empty or omitted, credentials will be granted for all groups the user has access to.
      operationId: assumeRole
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_role:
                  type: string
                  description: The user role to assume. 'mqtt' and 'videostream' is supported for now. If not provided or empty, defaults to 'mqtt'.
                  enum: [mqtt, videostream]
                group_ids:
                  type: array
                  description: Optional list of group IDs (max 5) to scope the credentials. Cannot be used with node_ids.
                  items:
                    type: string
                  maxItems: 5
                node_ids:
                  type: array
                  description: List of node IDs (max 5) to scope the credentials. Cannot be used with group_ids.
                  items:
                    type: string
                  maxItems: 5
            examples:
              MQTTAccessMultipleGroups:
                summary: MQTT access to multiple node groups
                value:
                  user_role: mqtt
                  group_ids: ["group1", "group2"]
              MQTTAccessMultipleGroupsEmptyRole:
                summary: MQTT access to multiple node groups (empty user_role)
                value:
                  group_ids: ["group1", "group2"]
              MQTTAccessSpecificNodes:
                summary: MQTT access to specific nodes only
                value:
                  user_role: mqtt
                  node_ids: ["node1", "node2", "node3"]
              MQTTAccessSpecificNodesEmptyRole:
                summary: MQTT access to specific nodes only (empty user_role)
                value:
                  node_ids: ["node1", "node2", "node3"]
              MQTTAccessNoArgs:
                summary: MQTT access without args
                value:
                  user_role: mqtt
              MQTTAccessNoArgsEmptyRole:
                summary: MQTT access without args (empty user_role)
                value:
                  user_role: ""
              VideoStreamingAccessSpecificNodes:
                summary: VideoStreaming access to specific nodes only
                value:
                  user_role: videostream
                  node_ids: ["node1", "node2", "node3"]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_key:
                    type: string
                    description: The temporary access key
                  secret_key:
                    type: string
                    description: The temporary secret key
                  session_token:
                    type: string
                    description: The session token
              examples:
                Success Response:
                  value:
                    access_key: "access_key"
                    secret_key: "secret_key"
                    session_token: "session_token"
        "400":
          description: failure
            <br>Error Codes and Error Description
            <br>100002 - API Version is not supported
            <br>100021 - Invalid query param
            <br>119019 - The number of group_ids should be between 1 to 5 if provided.
            <br>119020 - user_role value passed in the request is invalid
            <br>119021 - The number of node that can be associated with the credential should be between 1 to 5.
            <br>119022 - The node id provided does not exist or it does not belong to the user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
        "500":
          description: failure
            <br>Error Codes and Error Description
            <br>119018 - Error getting credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
      security:
        - AccessToken: []


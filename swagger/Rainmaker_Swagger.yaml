          description: Node ID of the device
          required: true
          schema:
            type: string
        - name: action
          in: path
          description: Action to perform. Valid values are `params`, `initparams`, `config`
          required: true
          schema:
            type: string
            enum: [params, initparams, config]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeProxyRequest"
            examples:
              params:
                summary: Request node params or initparams
                value:
                  node_payload: '{"data":{"Light":{"Name":"My Light","Power":true,"Brightness":25,"Hue":180,"Saturation":100},"Time":{"TZ":"Asia/Kolkata","TZ-POSIX":"IST-5:30"},"Scenes":{"Scenes":[]},"System":{"Reboot":false,"Factory-Reset":false,"Wi-Fi-Reset":false}},"timestamp":1768587927}'

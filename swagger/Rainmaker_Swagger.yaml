  /{version}/admin/tags:
    get:
      security:
        - AccessToken: []
      tags:
        - Tags Service
      summary: Get the Tags related data for various Resources
      description: "This API is to get the tags related data for Resources.
        <br>Querying for data can be done using {Resource Type and Resource ID}, {Tag Name and Tag Value} and {Tags} combinations only.
        <ul><li>When Tag Name and Tag Value is passed, list of Resources is returned. Additionally Resource Type can be passed as optional query param to filter results.</li>
        <li>When Resource Type and Resource ID is passed, list of Tags attached to it are returned. Additionally Tag Name can be passed as optional query param to filter results.</li>
        <li>When only Tags are passed, list of resources based on multiple tags combination is returned. Additionally Resource Type can be passed as optional query param to filter results.</li>
        <li>When querying for Users on a particular Tag, additional_data like User's custom data, and number of mapped nodes can be returned with optional flags like `custom_data` and `node_counts`.</li>
        </ul>
        Special characters in Tag Value need to be url encoded while querying the data using Tag Name and Tag Value combination.
        "
      operationId: getTagService
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
        - name: tag_name
          in: query
          description: Name of the Tag
          schema:
            type: string
            example: esp.location
        - name: tag_value
          in: query
          description: Value of the Tag
          schema:
            type: string
            example: Delhi
        - name: resource_type
          in: query
          description: Type of the Resource. i.e Node, Group, OTAImage, OTAJob, User
          schema:
            type: string
            example: Node
        - name: resource_id
          in: query
          description: UUID of the Resource
          schema:
            type: string
            example: abcdefjkilmnopqrstuvwx
        - name: tags
          in: query
          description: Used to fetch list of resources based on multiple tags. Tags can be combined by either AND or OR. Resource Type is required to be passed when tags are passed.
          required: false
          example: "location:pune OR location:bangalore"
          schema:
            type: string
        - name: custom_data
          in: query
          description: Flag to return Custom_Data of the Resource. Only supported on Resource_type = User.
          schema:
            type: boolean
            example: true
        - name: num_records
          in: query
          description: Used for pagination, number of records to be fetched
          required: false
          schema:
            type: string
        - name: start_id
          in: query
          description: Used for pagination, Start Id of the record to be fetched
          required: false
          schema:
            type: string
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/GetResourceList"
                  - $ref: "#/components/schemas/GetTagList"
              examples:
                When Tag is passed:
                  $ref: "#/components/examples/QueryOnTagResponse"
                When Tag is passed, and Users are returned:
                  $ref: "#/components/examples/QueryOnTagForUsersResponse"
                When Tag, and custom_data=true is passed, and Users are returned:
                  $ref: "#/components/examples/QueryOnTagForUsersWithCustomDataResponse"
                When Tag, and node_counts=true is passed, and Users are returned:
                  $ref: "#/components/examples/QueryOnTagForUsersWithNodeCountsResponse"
                When Resource is passed:
                  $ref: "#/components/examples/QueryOnResourceForTagsResponse"
        "400":
          description: "failure <br>Error Codes and Error Description
            <br>135001- Please enter valid resource information
            <br>135002- Please enter valid Tags
            <br>135003- Tag is already attached
            <br>135007- Invalid Start Id provided
            <br>135008- Invalid Verification code provided
            <br>135011- Error, only one type of logical operator (either of 'AND', 'OR') is supported in a request
            <br>135012- Invalid combination of query params provided
            <br>135013- Missing Tag Name
            <br>135014- Missing Tag Value
            <br>135015- Missing Tag Resource Id
            <br>135016- Missing Tag Resource Type
            <br>135017- Invalid query: Extra query params mentioned
            "
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponseWithCode"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure <br>Error Codes and Error Description
            <br>100070- Too many requests, try again later
        "500":
          description: failure <br>Error Codes and Error Description
            <br>135004- Error occurred attaching Tags
            <br>135005- Error occurred fetching Tag data
            <br>135006- Error occurred detaching Tags
            <br>135009- Error occurred while getting Tag Names
            <br>135010- Error occured while fetching Tag values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponseWithCode"
    put:
      security:
        - AccessToken: []
      tags:
        - Tags Service

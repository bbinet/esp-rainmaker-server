  /{version}/user/nodes/history:
    get:
      tags:
        - User Node Association
      summary: Get user's node association history
      description:
        "This API fetches the past and present association data for nodes associated with the authenticated user.
        <br><br>
        <br><b>IMPORTANT NOTE:</b> The <b>'total'</b> field represents the number of associations of a user with unique nodes/node IDs ever (in the past and in present).
        <br><br>
        <br><b>Response Format Explanation:</b>
        <ul>
        <li><b>status:</b> Represents whether the association exists currently or not. Any mapping when deleted and this history feature is enabled, it is stored as 'inactive'</li>
        <li><b>first_mapping_ts:</b>  This timestamp is added only when establishing a completely new user-node association with no prior history</li>
        <li><b>last_updated_ts:</b> A new field added with current default value same as first_mapping_ts and it is updated for any update operation between a user and a node</li>
        <li><b>mapping_count:</b> Count of re-mappings after removal between the same user and the same node. Increments only on add->remove->add cycles, not on role/source changes or successive mappings</li>
        </ul>
        <br><b>Query Options:</b>
        <ul>
        <li><b>No parameters:</b> Returns all nodes associated with the user. Common: user_id, user_name</li>
        <li><b>node_type:</b> Returns nodes of the specified type associated with the user. Common: user_id, user_name, node_type</li>
        <li><b>node_id:</b> Returns details for a specific node if associated with the user. Common: user_id, user_name</li>
        </ul>
        <br><b>Invalid Combinations (Not Supported):</b>
        <ul>
        <li><b>node_id + node_type:</b> Not allowed - Use either node_id OR node_type separately</li>
        </ul>"
      operationId: getUserNodeHistory
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
        - name: node_id
          in: query
          description: node_id of a specific node to get association details for
          required: false
          schema:
            type: string
        - name: node_type
          in: query
          description: type of nodes to filter by. Supported types - rainmaker, rainmaker_matter, pure_matter, ocpp
          required: false
          schema:
            type: string
            enum: [rainmaker, rainmaker_matter, pure_matter, ocpp]
        - name: start_id
          in: query
          description: use next_id from the previous response as start_id to fetch the next set of records for pagination
          required: false
          schema:
            type: string
        - name: num_records
          in: query
          description: number of records to fetch (default 25)
          required: false
          schema:
            type: integer
            default: 25
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserNodeHistoryResponse"
              examples:
                No parameters - all user nodes:
                  value:
                    user_id: "user123"
                    user_name: "username1@example.com"
                    total: 7
                    nodes:
                      - node_id: "node456"
                        first_mapping_ts: 1688454438
                        last_updated_ts: 1698454438
                        mapping_count: 1
                        node_type: "pure_matter"
                        status: "active"
                        type: "type"
                        model: "model"
                        subtype: "subtype"
                      - node_id: "node789"
                        first_mapping_ts: 1688454500
                        last_updated_ts: 1698454500
                        mapping_count: 1
                        node_type: "rainmaker"
                        status: "active"
                        type: "type"
                        model: "model"
                        subtype: "subtype"
                      - node_id: "node999"
                        first_mapping_ts: 1688454600
                        last_updated_ts: 1698454600
                        mapping_count: 5
                        node_type: "rainmaker"
                        status: "active"
                    next_id: "next_id"
                Query by node_type - filtered user nodes:
                  value:
                    user_id: "user123"
                    user_name: "username1@example.com"
                    node_type: "pure_matter"
                    total: 4
                    nodes:
                      - node_id: "node456"
                        first_mapping_ts: 1688454438
                        last_updated_ts: 1698454438
                        mapping_count: 1
                        status: "active"
                        type: "type"
                        model: "model"
                        subtype: "subtype"
                      - node_id: "node777"
                        first_mapping_ts: 1688454700
                        last_updated_ts: 1698454700
                        mapping_count: 1
                        status: "active"
                        type: "type"
                        model: "model"
                        subtype: "subtype"
                      - node_id: "node888"
                        first_mapping_ts: 1688454800
                        last_updated_ts: 1698454800
                        mapping_count: 1
                        status: "active"
                    next_id: "next_id"
                Query by node_id - specific node details:
                  value:
                    user_id: "user123"
                    user_name: "username1@example.com"
                    total: 1
                    nodes:
                      - node_id: "node456"
                        first_mapping_ts: 1688454438
                        last_updated_ts: 1698454438
                        mapping_count: 1
                        node_type: "pure_matter"
                        status: "active"
                        type: "type"
                        model: "model"
                        subtype: "subtype"
                Query by node_id - node not associated with user:
                  value:
                    user_id: "user123"
                    user_name: "username1@example.com"
                    total: 0
                    nodes: []
        "400":
          description: failure<br>Error Codes and Error Description
            <br>100002- API Version is not supported
            <br>100003- Method not allowed
            <br>100004- You are not authorized to perform this operation, Please contact administrator
            <br>100006- Invalid request body
            <br>103043- Invalid query parameter combination
            <br>103044- Invalid node_type value
            <br>103042- User node history is not enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
        "500":
          description: failure <br>Error Codes and Error Description
            <br>103041- Error occurred while fetching user node history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
      security:
        - AccessToken: []


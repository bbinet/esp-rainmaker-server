  /{version}/user/guest/conversion/initiate:
    post:
      tags:
        - User Management
      summary: Initiate guest user conversion to regular account
      description: |
        This API is the first step in converting a guest user to a regular account.
        It sends a verification code to the provided email address.
        Only authenticated guest users can call this API.
        Phone number is not supported for guest conversion.
        <br><br><b>Flow:</b>
        <ul>
        <li>Guest user provides the email address they want to convert to.</li>
        <li>A verification code is sent to that email.</li>
        <li>Use the verify endpoint with the code and new password to complete conversion.</li>
        </ul>
      operationId: guestConversionInitiate
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestConversionInitiateRequest"
            examples:
              Initiate with email:
                value:
                  user_name: "user@example.com"
        description: Email address to convert the guest account to (phone number not supported)
        required: true
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APISuccessResponse"
              examples:
                Verification code sent:
                  value:
                    status: "success"
                    description: "Verification code sent successfully"
        "400":
          description: failure <br>Error Codes and Error Description
            <br>100006- Invalid request body
            <br>101001- User name is missing
            <br>101002- Email-id is not in correct format
            <br>101097- Guest conversion only supports email address. Phone number is not supported.
            <br>101006- User account already exist
            <br>100052- Error, this operation is not supported for oauth-only deployments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAPIFailureResponse"
        "401":
          description: failure <br>Error Codes and Error Description
            <br>100004- You are not authorized to perform this operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAPIFailureResponse"
        "500":
          description: failure <br>Error Codes and Error Description
            <br>100008- Error in fetching tenant context details
            <br>101028- Error occurred while updating user
            <br>101019- Attempt limit exceeded, please try after some time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAPIFailureResponse"
      security:
        - AccessToken: []

  /{version}/user/guest/conversion/verify:
    post:
      tags:
        - User Management
      summary: Verify guest user conversion and complete account setup
      description: |
        This API is the second step in converting a guest user to a regular account.
        It verifies the code sent during initiate and sets the new password.
        Only authenticated guest users can call this API.
        <br><br><b>Flow:</b>
        <ul>
        <li>Provide the verification code received on email, user_name (email), and the new password.</li>
        <li>On success, the guest account is converted to a regular account with the new email as login.</li>
        </ul>
      operationId: guestConversionVerify
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestConversionVerifyRequest"
            examples:
              Verify conversion:
                value:
                  user_name: "user@example.com"
                  verification_code: "123456"
                  password: "NewSecureP@ss1"
        description: Email (user_name), verification code, and new password
        required: true
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APISuccessResponse"
              examples:
                Conversion successful:
                  value:
                    status: "success"
                    description: "Guest account converted to regular account successfully"
        "400":
          description: failure <br>Error Codes and Error Description
            <br>100006- Invalid request body
            <br>101001- User name is missing
            <br>101002- Email-id is not in correct format
            <br>101003- Password or verification code is missing
            <br>101004- Password length must be between 8 to 256 characters. It should be alpha-numeric without any whitespace. It should contain atleast one uppercase, one lowercase character and a number
            <br>101012- Verification code is incorrect
            <br>101013- User confirmation failed
            <br>101030- Verification code is missing
            <br>101097- Guest conversion only supports email address. Phone number is not supported.
            <br>100052- Error, this operation is not supported for oauth-only deployments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAPIFailureResponse"
        "401":
          description: failure <br>Error Codes and Error Description
            <br>100004- You are not authorized to perform this operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAPIFailureResponse"
        "500":
          description: failure <br>Error Codes and Error Description
            <br>100008- Error in fetching tenant context details
            <br>101028- Error occurred while updating user
            <br>101019- Attempt limit exceeded, please try after some time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAPIFailureResponse"
      security:
        - AccessToken: []


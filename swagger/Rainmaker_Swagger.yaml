      security:
        - AccessToken: []
    get:
      tags:
        - Event Filter for Users
      summary: Get Integration event filter information.
      description:
        "This API will get the integration event filter information for given event_type and entity(type/id).
        <br>If event_type and entity id(user or node id) are specified, then the event filter information will be returned for that event_type and entity.
        <br>If the entity type(user or node) is specified, then all the event filter information will be returned for the event_type.
        <br>If just entity id(user or node id) is provided, then all the event filter mapped to that entity id will be returned.
        <br>Either of event_type(optionally with entity_type) or entity_id is required"
      operationId: getUserEventFilter
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
        - name: event_type
          description: RainMaker event type
          example: "rmaker.event.node_connected"
          in: query
          required: false
          schema:
            type: string
        - name: entity_type
          in: query
          required: false
          description: Entity type
          schema:
            type: string
            enum: [User, Node, System]
        - name: entity_id
          example: "thing"
          in: query
          required: false
          description: Entity Id
          schema:
            type: string
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEventFilterResponse"
              examples:
                Passing event_type:
                  value:
                    event_entity_mapping_list:
                      [
                        {
                          event_type: "example_event_type",
                          entity_id: "thing",
                          entity_type: "NODE",
                          enabled: false,
                          enabled_for_integrations:
                            ["google_home_graph", "salesforce"],
                        },
                        {
                          event_type: "example_event_type",
                          entity_id: "system.example_event_type",
                          entity_type: "SYSTEM",
                          enabled: false,
                          enabled_for_integrations:
                            ["mobile_push_notification"],
                        },
                      ]
                    total: 2
                Passing event_type and entity_type(for example NODE):
                  value:
                    event_entity_mapping_list:
                      [
                        {
                          event_type: "example_event_type",
                          entity_id: "thing",
                          entity_type: "NODE",
                          enabled: false,
                          enabled_for_integrations:
                            ["google_home_graph", "salesforce"],
                        },
                      ]
                    total: 1
                Passing entity_id:
                  value:
                    event_entity_mapping_list:
                      [
                        {
                          event_type: "rmaker.event.node_automation_trigger",
                          entity_id: "example_entity_id",
                          entity_type: "NODE",
                          enabled: false,
                          enabled_for_integrations:
                            ["google_home_graph", "salesforce"],
                        },
                        {
                          event_type: "rmaker.event.user_node_added",
                          entity_id: "example_entity_id",
                          entity_type: "NODE",
                          enabled: false,
                          enabled_for_integrations:
                            ["google_home_graph", "salesforce"],
                        },
                      ]
                    total: 2
                Passing event_type and entity_id:
                  value:
                    event_entity_mapping_list:
                      [
                        {
                          event_type: "example_event_type",
                          entity_id: "example_entity_id",
                          entity_type: "NODE",
                          enabled: false,
                          enabled_for_integrations:
                            ["google_home_graph", "salesforce"],
                        },
                      ]
        "400":
          description: failure
            <br>Error Codes and Error Description
            <br>100006 - Invalid request body
            <br>100021 - Invalid query param
            <br>113101 - Event Type is missing
            <br>113102 - Entity Id is missing
            <br>113107 - Invalid Entity Type
            <br>113109 - Event Entity Mapping doesn't exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventFilterAPIFailureResponse"
              examples:
                Generic Response:
                  value:
                    status: "failure"
                    error_code: 1131XX
                    description: "Failure description"
                Passing only entity_type:
                  value:
                    status: "failure"
                    error_code: 100021
                    description: "Invalid query param"
        "500":
          description: failure
            <br>Error Codes and Error Description
            <br>113108 - Error while fetching Event Entity Mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventFilterAPIFailureResponse"
      security:
        - AccessToken: []
    delete:
      tags:
        - Event Filter for Users
      summary: This API removes the Integration event filter.
      description:
        'This API allows user to remove Event Filter. This api requires request body:<br>
        {<br>
        "<b>event_type</b>": "rmaker.event.user_node_sharing_add",<br>
        "<b>entity_id</b>": "system.rmaker.event.user_node_sharing_add"<br>
        }'
      operationId: removeUserEventFilter
      parameters:

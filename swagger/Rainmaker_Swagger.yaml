          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUserGroupSharingResponse"
              examples:
                sub_groups=false:
                  value:
                    group_sharing:
                      - group_id: string
                        mutually_exclusive: boolean
                        users:
                          primary:
                            - primary_user@domain.com
                          secondary:
                            - secondary_user@domain.com
                sub_groups=true:
                  value:
                    group_sharing:
                      - group_id: string
                        mutually_exclusive: boolean
                        users:
                          primary:
                            - primary_user@domain.com
                          secondary:
                            - secondary_user@domain.com
                        sub_groups:
                          - group_id: string
                            users:
                              primary:
                                - primary_user@domain.com
                              secondary:
                                - secondary_user@domain.com
                parent_groups=false:
                  value:
                    group_sharing:
                      - group_id: string
                        mutually_exclusive: boolean
                        users:
                          primary:
                            - primary_user@domain.com
                          secondary:
                            - secondary_user@domain.com
                parent_groups=true:
                  value:
                    group_sharing:
                      - group_id: string
                        mutually_exclusive: boolean
                        users:
                          primary:
                            - primary_user@domain.com
                          secondary:
                            - secondary_user@domain.com
                        parent_groups:
                          group_id: string
                          group_name: string
                          group_type: string
                          mutually_exclusive: boolean
                          parent_group:
                            group_id: string
                            group_name: string
                            group_type: string
                            mutually_exclusive: boolean
                metadata=true:
                  value:
                    group_sharing:
                      - group_id: string
                        users:
                          primary_metadata:
                            - user_name: primary_user@domain.com
                              sub_role: 2
                          secondary_metadata:
                            - user_name: secondary_user@domain.com
                              sub_role: 1
                              metadata: {close_friend: true}
                            - user_name: secondary_user2@domain.com
                              metadata: {neighbor: true}
        "400":
          description: failure<br>Error Codes and Error Description
            <br>100007- Either User Id or User Email needs to be provided
            <br>108023- Group does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserGroupSharingAPIFailureResponse"
        "500":
          description: failure<br>Error Codes and Error Description
            <br>108008- Error occurred while fetching node group info details
            <br>108020- Error occurred while fetching sub groups
            <br>108058- Error occurred while fetching shared users of group
            <br>108068- Error occurred while fetching existing secondary users mapped to a group
            <br>108069- Error occurred while fetching existing primary users mapped to a group"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserGroupSharingAPIFailureResponse"
      security:
        - AccessToken: []


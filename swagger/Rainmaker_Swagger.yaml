          required: false
          schema:
            type: string
        - name: start_request_id
          in: query
          description: used in pagination
          required: false
          schema:
            type: string
        - name: start_user_name
          in: query
          description: used in pagination along with start_request_id
          required: false
          schema:
            type: string
        - name: num_records
          in: query

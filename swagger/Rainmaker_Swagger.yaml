  /token:
    post:
      operationId: tokenExchange
      tags:
        - OAuth in RainMaker (For OAuth only deployments)
      summary: Get authorisation tokens for user (Beta)
      description: |
        The endpoint where the client exchanges the authorization code or username, password for an access token, refresh token, id token with OAuth2 flow. Or exchange refresh token for new tokens. Calls the provider token URL and then uses that information to create RainMaker tokens. The Client Id and Secret can be passed as 'Basic Auth' or as 'client_id' and 'client_secret' in the request body. These JWT authorisation tokens then can be used for other calls.

        <ul><b>Example for authorization code:</b>
          <li>grant_type: authorization_code</li>
          <li>code: xxxx</li>
          <li>redirect_uri: https://redirect_uri</li>
          <li>client_id: id</li>
          <li>client_secret: secret</li>
        </ul>

        <ul><b>Example for refresh token:</b>
          <li>grant_type: refresh_token</li>
          <li>refresh_token: xxxx</li>
          <li>client_id: id</li>
          <li>client_secret: secret</li>
        </ul>

        <ul><b>Example for password grant:</b>
          <li>grant_type: password</li>
          <li>identity_provider: provider_name</li>
          <li>username: username</li>
          <li>password: password123</li>
          <li>client_id: id</li>
          <li>client_secret: secret</li>
        </ul>
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code, password, refresh_token]
                  description: The grant type.
                client_id:
                  type: string
                  description: The client ID. Required if client_secret_post.
                client_secret:
                  type: string
                  description: The corresponding client secret. Not required for public clients. Required if client_secret_post.
                code:
                  type: string
                  description: The authorization code obtained from the authorization endpoint. Required if authorization_code grant type
                redirect_uri:
                  type: string
                  description: The redirect URI used in the authorization request. Required if authorization_code grant type.
                refresh_token:
                  type: string
                  description: The refresh token obtained previously. Required if refresh_token grant.
                identity_provider:
                  type: string
                  description: The identity provider. Required if password grant. #Required as Login UI not developed
                username:
                  type: string
                  description: The username. Required if password grant.
                password:
                  type: string
                  description: The password. Required if password grant.
                wechat_token_only:
                  type: string
                  description: All WeChat logins coming from the phone app should set this value to true.
                locale:
                  type: string
                  description: It allows the user to specify their preferred language locale for receiving emails and SMS. It is case-insensitive and input locale will be considered in lowercase.
              required:
                - grant_type
            examples:
              Exchange auth code with tokens:
                value:
                  grant_type: "authorization_code"
                  code: "xxxx"
                  redirect_uri: "https://redirect_uri"
                  client_id: "id"
                  client_secret: "secret"
              Refresh the token:
                value:
                  grant_type: "refresh_token"
                  refresh_token: "xxxx"
                  client_id: "id"
                  client_secret: "secret"
              Password grant:
                value:
                  grant_type: "password"
                  identity_provider: <provider name>
                  username: <username of provider>
                  password: <password of provider>
                  client_id: "id"
                  client_secret: "secret"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    description: The token type.
                    example: Bearer
                  expires_in:
                    type: integer
                    description: The lifetime of the access token in seconds.
                  refresh_token:
                    type: string
                  id_token:
                    type: string
        "400":
          description: "failure
            <br> Bad Request (Unexpected error from the server)
            <br> invalid_request (Check the input parameters)
            <br> invalid_grant (Incorrect code | redirect URI or refresh_token )
            <br> unsupported_grant_type (Unsupported grant type for the provider)
            <br> server_error (Unexpected error from the server)
            <br> invalid_client (Client ID is not registered)
            <br> unauthorized_client (Client secret is incorrect)
            "
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: A short error code string


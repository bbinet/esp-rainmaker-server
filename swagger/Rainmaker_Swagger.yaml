    put:
      tags:
        - File upload
      summary: Approve or reject discoverable file request
      description: |
        <p>Allows admins to approve or reject discoverable file requests from users.</p>
        <p><b>Note:</b> The <b>file_id</b> can contain '/' characters. Clients must URL-encode it when sending as a query parameter.</p>
      operationId: adminfileupdate
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
        - name: user_id
          in: query
          description: User ID of the file owner
          required: true
          schema:
            type: string
        - name: file_id
          in: query
          description: File ID. URL-encode if it contains '/'.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [approve, reject]
                  description: Action to take on the discoverable request
                message:
                  type: string
                  description: Optional message saved for approve and reject actions
            examples:
              Approve discoverable request:
                value: {"action": "approve"}
              Reject discoverable request:
                value:
                  {"action": "reject", "message": "Does not meet guidelines"}
        required: true
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APISuccessResponse"
        "400":
          description: failure
            <br>Error Codes and Error Description
            <br>100006- Invalid request body
            <br>134024- User ID is missing
            <br>134005- File ID is missing
            <br>134025- Invalid action
            <br>134003- File does not exist
            <br>134006- Invalid file ID
            <br>134019- The provided file_id does not exist
            <br>134021- File already discoverable
          content:
            application/json:
              schema:

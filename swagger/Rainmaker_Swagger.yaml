    CreateDeviceGroupRequest:
      type: object
      properties:
        group_name:
          type: string
          minimum: 2
          maximum: 256
          description: Group name should be unique for the groups who doesn't have any parent.It also has multilanguage support.White Spaces are allowed only in between the characters of group_name.Leading and trailing white spaces are not allowed.[!@~#$%^&*()=+{}\\\\|'\";<>?\\[\\]] are not allowed.
        parent_group_id:
          type: string
          description:
            The group should exist and user should be the primary owner of this group.
            The requested nodes will get added in this parent group as well in case of admin groups.
            In case of user groups, requested nodes should already be present in this parent group.
            A group can have maximum of 100 sub-groups only
        type:
          type: string
          description: This is a custom group type eg.Home, Room, etc
        mutually_exclusive:
          type: boolean
          description: When mutually_exclusive flag is true, group will be considered as Mutually exclusive group i.e Nodes which are part of this group can't be part of the other mutually exclusive groups having same group type and same parent(Groups having no parent IDs can also be considered having same parent)
        nodes:
          type: array
          minimum: 1
          maximum: 100
          description: Admin should add claimed nodes here.
            User should add the mapped/associated nodes here.
            If not specified, group will be created without any nodes.
          items:
            type: string
        description:
          type: string
          minimum: 1
          maximum: 500
          description: Group description
        custom_data:
          type: object
          description: "Custom group metadata following these JSON rules. (1) custom_data {} - no change, no validation error. (2) custom_data as object of key-value where key is string and value can be array, object, string, number, or boolean - metadata is stored in this format; new keys are appended and existing key values are updated. (3) custom_data {'key' null} - removes the key from metadata."
      required:
        - group_name


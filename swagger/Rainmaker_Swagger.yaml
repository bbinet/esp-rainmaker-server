  /{version}/admin/users/{user_id}/nodes/{node_id}/mapping:
    put:
      tags:
        - User Node Association
      summary: Admin API to directly add user-node mapping
      description:
        "<font color='red'>⚠️ **Warning:** This API allows admin users to directly add user-node mapping between a specified user and node.
        It adds the user-node mapping and removes all existing mappings for the node only if the node is being mapped or
        associated with a new user and not an already associated user.</font>
        <br><br>
        **When mapping a node to a new user, the following data associated with the node will be permanently removed:**
        <ul>
        <li>All user-node mappings</li>
        <li>All node-group mappings</li>
        <li>All node automations</li>
        <li>All user tags on the node</li>
        <li>Simple time-series data (tsdata)</li>
        </ul>"
      operationId: adminUpdateUserNodeMapping
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
        - name: user_id
          in: path
          description: The user ID to map to the node
          required: true
          schema:
            type: string
          example: "user123"
        - name: node_id
          in: path
          description: The node ID to map to the user
          required: true
          schema:
            type: string
          example: "node456"
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APISuccessResponse"
              examples:
                Mapping confirmed successfully:
                  value:
                    status: "success"
                    description: "User node mapping confirmed successfully"
        "400":
          description: failure<br>Error Codes and Error Description
            <br>100002- API Version is not supported
            <br>100003- Method not allowed
            <br>100004- You are not authorized to perform this operation, Please contact administrator
            <br>100006- Invalid request body
            <br>100012- Invalid Request
            <br>100021- Invalid query param
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserNodeMappingAPIFailureResponse"
        "404":
          description: failure<br>Error Codes and Error Description
            <br>101025- User does not exist
            <br>100015- Nodes do not exist
            <br>103020- Node does not belong to user
            <br>103045- Target user for mapping is not the same as the requesting user
            <br>107032- This operation is not allowed for matter nodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserNodeMappingAPIFailureResponse"
        "500":
          description: failure <br>Error Codes and Error Description
            <br>100001- Error in fetching user details
            <br>100008- Error in fetching tenant context details
            <br>100014- Getting node details failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserNodeMappingAPIFailureResponse"
      security:
        - AccessToken: []


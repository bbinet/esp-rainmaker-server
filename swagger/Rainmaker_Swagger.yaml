      xml:
        name: APIResponseWithNodeId

    APISuccessResponseForMatterfabricSharing:
      type: object
      properties:
        status:
          type: string
          example: "success"
        description:
          type: string
          example: "Success description"
        groups:
          type: object
          properties:
            group_id:
              type: string
              example: "group_id"
            fabric_id:
              type: string
              example: "fabric_id"
            matter_user_id:
              type: string
              example: "matter_user_id"
            group_cat_id_admin:
              type: string
              example: "group_cat_id_admin"
            group_cat_id_operate:
              type: string
              example: "group_cat_id_operate"
            root_ca:
              type: string
              example: "root_ca"
            ipk:
              type: string
              example: "ipk"
      xml:
        name: APISuccessResponseForMatterfabricSharing

    APIFailureWithNodeId:
      allOf:
        - type: object
          properties:
            node_id:
              type: string
              example: "node_id"
        - $ref: "#/components/schemas/APIFailureResponse"
      xml:
        name: APIFailureWithNodeId

    MultiNodeSetParamsAPIResponseWithNodeId:
      type: array
      items:
        $ref: "#/components/schemas/APIResponseWithNodeId"
      xml:
        name: MultiNodeSetParamsAPIResponseWithNodeId

    UserLoginRequest:
      type: object
      properties:
        user_name:
          type: string
          description: Username of the user account to login which can either be an email or phone number
        password:
          type: string
          minimum: 8
          maximum: 256
          description: Password of the associated username to login
      xml:
        name: logindata
    ExtendSessionRequest:
      type: object
      properties:
        refreshtoken:
          type: string
          description: Access token is valid for the 1 hour, If we want to extend the session, we need to provide the refresh_token which we can get in the login response
      xml:
        name: logindata
    CreateUserRequest:
      type: object
      properties:
        user_name:
          type: string
          description: It can be either a valid email or phone number.It's case sensitive field and it should be Unique.
        password:
          type: string
          minimum: 8
          maximum: 256
          description: It should be alpha-numeric without any whitespace, contain atleast one uppercase, one lowercase character and a number
      xml:
        name: logindata
      required:
        - user_name
    ConfirmUserRequest:
      type: object
      properties:
        user_name:
          type: string
          description: User email/phone Number added in the create user request
        verification_code:
          type: string
          minimum: 6
          maximum: 6
          description: Verification code received by the user on the given email address or phone number
        tags:
          $ref: "#/components/schemas/TagsList"
      xml:
        name: logindata
    LoginSuccessResponse:
      type: object
      properties:
        status:
          type: string
          enum: [success, failure]
        description:
          type: string
        idtoken:
          type: string
        accesstoken:
          type: string
        refreshtoken:
          type: string
      xml:
        name: loginSuccessResponsedata
    GuestLoginSuccessResponse:
      type: object
      properties:
        status:
          type: string
          enum: [success, failure]
        description:
          type: string
        idtoken:
          type: string
        accesstoken:
          type: string
        refreshtoken:
          type: string
        user_name:
          type: string
          description: Guest user name in the format guest@uuid.temp.user
      xml:
        name: guestLoginSuccessResponsedata

    GuestConversionInitiateRequest:
      type: object
      required:
        - user_name
      properties:
        user_name:
          type: string
          description: Email address to convert the guest account to (phone number not supported)
          example: "user@example.com"
      xml:
        name: guestConversionInitiateRequest

    GuestConversionVerifyRequest:
      type: object
      required:
        - user_name
        - verification_code
        - password
      properties:
        user_name:
          type: string
          description: Email address used in initiate (must match)
          example: "user@example.com"
        verification_code:
          type: string
          description: Verification code received on email
        password:
          type: string
          description: New password for the converted account (min 8 chars, must contain uppercase, lowercase, and number)
          minLength: 8
          maxLength: 256
      xml:
        name: guestConversionVerifyRequest

    LoginExtendSessionResponse:
      type: object
      properties:
        status:
          type: string
        description:
          type: string
        idtoken:
          type: string
        accesstoken:
          type: string
      xml:
        name: loginNewPasswdResponsedata
    LoginWithoutPassword:
      type: object
      properties:
        status:
          type: string
        description:
          type: string
        session:
          type: string
      xml:
        name: loginWithoutPasswdResponsedata
    LogoutRequest:
      type: object
      properties:
        refreshtoken:
          type: string
    GetUserResponse:
      type: object
      properties:
        user_id:
          type: string
          description: user Id
        user_name:
          type: string
          description: User Name
        super_admin:
          type: boolean
          description: Indicates if user is Super Admin or not
        admin:
          type: boolean
          description: Indicates if user is Admin or not
        picture_url:
          type: string
          description: Picture URL
        name:
          type: string
          description: Name
        phone_number:
          type: string
          description: Phone number
        email:
          type: string
          description: Email-Id of the user
        quota:
          type: string
          description: User's quota
        mfa:
          type: boolean
          description: Indicates if MFA is enabled or not
        user_roles:
          type: array
          description: User's roles
          items:
            type: string
        tags:
          $ref: "#/components/schemas/TagsList"
        custom_data:
          type: object
          description: Custom User Data
        is_guest_user:
          type: boolean
          description: Indicates if the user is a guest user. Present only for guest users.
        expires_on:
          type: integer
          format: int64
          description: Unix timestamp indicating when the guest user account expires. Present only for guest users.
      xml:
        name: getUserResponsedata

    PasswordChangeRequest:
      type: object
      properties:
        password:
          type: string
          minimum: 8
          maximum: 256
          description: Old login password which user wants to change
        newpassword:
          type: string
          minimum: 8
          maximum: 256
          description: New password should be alpha-numeric without any whitespace. It should contain atleast one uppercase, one lowercase character and a number
    ForgotPasswordRequest:
      type: object
      properties:
        user_name:
          type: string
          description: This is the username(either email or phone number) for which password needs to be recovered
    ForgotPasswordConfirm:
      type: object
      properties:
        user_name:
          type: string
          description: This is the username(either email or phone number) for which password needs to be recovered
        password:
          type: string
          minimum: 8
          maximum: 256
          description: This is the new password which needs to be entered
        verification_code:
          type: string
          minimum: 6
          maximum: 6
          description: This is the verification code which user will get on either on email or phone number
    UpdateNameRequest:
      type: object
      properties:
        name:
          type: string
          description: This modifies the user account's name and not the username.
    UpdatePhoneNumberRequest:
      type: object
      properties:
        phone_number:
          type: string
          description: This updates the phone number for users with email usernames, requiring verification for addition. Each user can have only one phone number.
    ConfirmPhoneNumberRequest:
      type: object
      properties:
        verification_code:
          type: string
          minimum: 6
          maximum: 6
          description: This is the verification code for adding the phone number for the user

    ConfirmTagAssignmentRequest:
      type: object
      properties:
        tags_verification_code:
          type: string
    UpdateUserAttributeTagsRequest:
      type: object
      properties:
        operation:
          type: string
        tags:
          $ref: "#/components/schemas/TagsList"

    EnableOrDisableMFA:
      type: object
      properties:
        mfa:
          type: boolean
          description: This is to enable/disable MFA for superadmins.
    GetNodesList:
      type: object
      properties:
        nodes:
          type: array
          example: [nodeid1, ...]
          description: Array of Node IDs associated with the users according to the requested flags.
          items:
            type: string
        node_details:
          $ref: "#/components/schemas/NodeDetails"
        next_id:
          type: string
          example: "nodeid1"
          description: This is used as start ID for the next set of paginated result
        total:
          type: number
          example: 5
          description: Total node count for the specified request
      xml:
        name: GetNodesListData

    CreateUserAdminRequest:
      type: object
      properties:
        user_name:
          type: string
          description: Valid email address or valid phone number
        super_admin:
          type: boolean
          description: If set to true, User gets Super Admin priviledges
            <br> Is applicable only when RBAC is disabled for the environment
        admin:
          type: boolean
          description: If set to true, User gets Admin priviledges
            <br> Is applicable only when RBAC is disabled for the environment
        quota:
          deprecated: true
          type: number
          minimum: 1
        roles:
          type: array
          description: Set of roles
            <br> Is applicable only when RBAC is enabled for the environment
          items:
            type: string
        verify_auth_code:
          type: boolean
          description: If set to true, User gets email verification code
        tags:
          type: array
          description: Set of tags to be attached to User
          items:
            type: string
      required:
        - user_name

    GetInternalUsers:
      type: object
      properties:
        users_list:
          type: array
          description: Set of users
          items:
            $ref: "#/components/schemas/GetUserResponse"
        next_id:
          type: string
        total:
          type: number

    GetResourceList:
      type: object
      properties:
        resources:
          type: array
          description: List of resources when tag Name and tag Value is passed
          items:
            type: object
            properties:
              tenant_id:
                type: string
                example: "*"
                description: This is in case of multi tenant environment. Currently this is not in use
              resource_type:
                type: string
                example: NODE
                description: Type of the Resource. i.e Node, Group, OTAImage, OTAJob
              resource_id:
                type: string
                example: abcdefjkilmnopqrstuvwx
                description: UUID of Resource for eg. Node ID, Group ID etc
              resource_admin_id:
                type: string
                example: fgsdfgsdfg-5dfsghefty-5634567-dhfgh
                description: Admin ID associated with the resource
              additional_data:
                type: object
              tag_source:
                type: string
                example: admin_api
                description: Source of the tag assignment
                enum:
                  - admin_api
                  - user_api
                  - node_mapping
                  - system
                  - node_registration
        total:
          type: number
          example: 1
          description: Total number of resources for the specified filters

    TagsList:
      description: List of Tags
      type: array
      items:
        type: string
        example: "esp.location:delhi"

    GetTagList:
      type: object
      properties:
        tags:
          type: array
          description: When Resource Type and Resource ID is passed, list of Tags attached to it are returned
          items:
            type: object
            properties:
              tag_name:
                type: string
                example: esp.location
              tag_value:
                type: string
                example: Pune
              tag_source:
                type: string
                example: admin_api
                description: Source of the tag assignment
                enum:
                  - admin_api
                  - user_api
                  - node_mapping
                  - system
                  - node_registration
        total:
          type: number
          example: 1

    GetAdminNodesList:
      type: object
      properties:
        nodes:
          type: array
          items:
            type: string
            example: node_id1
        node_info:
          type: array
          items:
            $ref: "#/components/schemas/NodeInfo"
          description: Node details
        total:
          type: number
          example: 1
          description: Total no of nodes as per the input query params
        next_id:
          type: string
          example: node_id1
          description: This is required for pagination for fetching next set of records by giving this as a start_id
      xml:
        name: GetNodesListData

    GetAdminNodeTags:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
          description: List of Tag keys
        total:
          type: number
          description: Total no of nodes as per the input query params
        next_id:
          type: string
          description: This is required for pagination for fetching next set of records by giving this as a start_id
        tag_values:
          type: array
          items:
            type: string
          description: List of Tag values

    NodeInfo:
      type: object
      properties:
        node_id:
          type: string
          example: node_id1
        name:
          type: string
          minimum: 12
          maximum: 36
          example: Light
          description: Custom device name
        fw_version:
          type: string
          example: "1.0"
          description: Device firmware version
        type:
          type: string
          example: Lightbulb
          description: Custom device type
        model:
          type: string
          example: led_light
          description: Custom device model
        node_status:
          type: string
          example: online
          enum: [online, offline, deactivated, not_activated]
        registration_timestamp:
          type: number
          example: 1688454438
          description: Timestamp at which node got registered via bulk node registration or claiming
        status:
          $ref: "#/components/schemas/NodeConnectivity"
        activation_timestamp:
          type: number
          example: 1234567890
          description: Time when first node config was reported
        laststatusupdate_timestamp:
          type: number
          example: 1234567890
          description: Time when node reported connect/disconnect
        last_config_update_timestamp:
          type: number
          example: 1234567890
          description: Time when last node config was reported
        last_activity_timestamp:
          type: number
          example: 1234567890
          description: Time when node has updated the parameters
        granted_admin_access:
          type: string
          example: READ
        network_id:
          type: string
          example: network_id1
        config:
          $ref: "#/components/schemas/NodeConfiguration"
        params:
          $ref: "#/components/schemas/SetParamsRequestBody"
    SetParamsRequestBody:
      type: object
      properties:
        Light:
          type: object
          properties:
            brightness:
              type: number
              minimum: 0
              maximum: 100
            output:
              type: boolean
              enum: [true, false]
        Switch:
          type: object
          properties:
            output:
              type: boolean
              enum: [true, false]

      xml:
        name: GetNodesListData

    SetMultiNodeParamsRequestBody:
      type: object
      properties:
        node_id:
          type: string
          example: "<node_id>"
          description: Specify nodeId
        payload:
          $ref: "#/components/schemas/SetParamsRequestBody"

    SetMultiNodeParamsRequestsBody:
      type: array
      items:
        $ref: "#/components/schemas/SetMultiNodeParamsRequestBody"
      maxItems: 25
      minItems: 1

    NodeProxyRequest:
      type: object
      required:
        - node_payload
        - signature
      properties:
        node_payload:
          type: string
          description: |
            JSON string containing the 'data' (node parameters) and 'timestamp' (Unix timestamp in seconds). Both fields are required.
            The 'data' should be a JSON-encoded string of the exact structure, node sends on the corresponding MQTT topic.
          example: '{"data":{"Light":{"Name":"Light","Power":true,"Brightness":25,"Hue":175,"Saturation":100},"Time":{"TZ":"Asia/Kolkata","TZ-POSIX":"IST-5:30"},"Schedule":{"Schedules":[]},"Scenes":{"Scenes":[]},"System":{"Reboot":false,"Factory-Reset":false,"Wi-Fi-Reset":false}},"timestamp":1704067200}'
        signature:
          type: string
          description: |
            RSA-PSS or ECDSA signature (hex encoded) of the node_payload JSON string.
            The signature is computed using the node's private key (RSA or EC).
            For RSA keys: Uses RSA-PSS padding with SHA256.
            For EC keys: Uses ECDSA with SHA256.
          example: ""

    NodeConfiguration:
      type: object
      properties:
        node_id:
          type: string
          minimum: 12
          maximum: 36
          example: "nodeid1"
        config_version:
          type: string
          example: "config_version"
          description: Config version of the device config
        devices:
          type: array
          description: Device parameters
          items:
            $ref: "#/components/schemas/DeviceParameters"
        info:
          type: object
          properties:
            fw_version:
              type: string
              example: "fw_version"
              description: Device firmware version
            name:
              type: string
              minimum: 12
              maximum: 36
              example: "node_name"
              description: device name
            type:
              type: string
              example: "node_type"
              description: Device type eg.LightBulb
            model:
              type: string
              example: "node_model"
      xml:
        name: GetNodeConfiguration
    DeviceParameters:
      type: object
      description: Device parameters
      xml:
        name: DeviceParametersConfiguration
    NodeConnectivity:
      type: object
      properties:
        connectivity:
          type: object
          properties:
            connected:
              type: boolean
              enum: [true, false]
              example: true
              description: This will help determining whether node is online or offline at the moment
            timestamp:
              type: integer
              example: 1584698464101
              description: The latest timestamp at which the connection status was changed.
    AddRemoveUserNodeMappingRequest:
      type: object
      properties:
        node_id:
          type: string
          minimum: 12
          maximum: 64
          description: Node ID with which user wants to add/remove mapping
        secret_key:
          type: string
          minimum: 1
          maximum: 64
          description: This secret key should be matched with the device request while adding user-node mapping.
        operation:
          type: string
          enum: [add, remove]
          description: operation can be add or remove
        tags:
          type: array
          items:
            type: string
          example: ["location:pune", "name:espressif"]
          description: This is used to add the custom tags to the node
        metadata:
          type: object
          example: {"key": "value"}
          description: This is used to add the custom metadata to the node
        group_id:
          type: string
          description: group_id is used to add the node which is getting mapped to this group
    InitiateUserNodeMappingRequest:
      type: object
      properties:
        timeout:
          type: number

    InitiateUserNodeMappingResponse:
      type: object
      properties:
        request_id:
          type: string
        challenge:
          type: string
    VerifyUserNodeMappingRequest:
      type: object
      properties:
        request_id:
          type: string
        challenge_response:
          type: string
        node_id:
          type: string
          minimum: 12
          maximum: 36
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
        group_id:
          type: string
          description: group_id is used to add the node which is getting mapped to this
      required:
        - request_id
        - challenge_response
        - node_id
    AddRemoveUserNodeSharingRequest:
      type: object
      properties:
        node_ids:
          type: array
          items:
            type: string
          minimum: 1
          maximum: 100
          description: Node IDs for which the user-node sharing is requested
        user_name:
          type: string
          description: user_name of the user for which the node sharing is requested
        primary:
          type: boolean
          description: This will determine whether the node is getting shared to the user as a primary or secondary
        metadata:
          type: object
          description: Custom metadata object
        transfer:
          type: boolean
        new_role:
          type: string
        sub_role:
          type: integer
          minimum: 1
          maximum: 4
          description: "Optional. Custom role (1-4). When omitted, defaults to 0 (not set)."
      required:
        - node_ids
        - user_name
    AcceptOrDeclineNodeSharingRequest:
      type: object
      properties:
        confirm_sharing:
          type: boolean
          description: This is present for backward compatibility.Using "accept" instead of this is recommended.
        request_id:
          type: string
          description: Request ID of the user node sharing request which is being accepted/declined
        accept:
          type: boolean
          description: This should be true in case of accepting the request
      required:
        - accept
        - request_id
    GetUserNodeSharingResponse:
      type: object
      properties:
        node_sharing:
          type: array
          items:
            $ref: "#/components/schemas/UserNodeSharing"
    UserNodeSharing:
      type: object
      properties:
        node_id:
          type: string
        users:
          type: object
          properties:
            primary:
              type: array
              items:
                type: string
                example: "primary_user@domain.com"
            secondary:
              type: array
              items:
                type: string
                example: "secondary_user@domain.com"
            primary_metadata:
              type: array
              items:
                $ref: "#/components/schemas/UserNodeSharingMetadata"
            secondary_metadata:
              type: array
              items:
                $ref: "#/components/schemas/UserNodeSharingMetadata"
        sources:
          type: array
          items:
            type: string

    UserNodeSharingMetadata:
      type: object
      properties:
        user_name:
          type: string
        metadata:
          type: object
        sub_role:
          type: integer
          minimum: 0
          maximum: 4
          description: "Custom role level. 0 = not set; 1-4 represents a custom role. Returned in GET /user/nodes/sharing."

    GetNodeACLResponse:
      type: object
      properties:
        fabric_node_acl:
          type: array
          description: Matter node access control list.
          items:
            $ref: "#/components/schemas/NodeACL"
    NodeACL:
      type: object
      properties:
        group_id:
          type: string
          description: Device group ID of the fabric
        fabric_id:
          type: string
          description: Fabric ID
        type_entity:
          type: string
          example: NODE_ACL_ADMIN_<MatterNodeId>
          enum:
            ["NODE_ACL_ADMIN_<MatterNodeId>", NODE_ACL_OPERATE_<MatterNodeId>]
          description: There will be 2 entries for each matter node associated with the fabric for admin and operate access.
        sequence:
          type: integer
          example: 1
          description: This is the version of the Data for each entry to help determine the phoneapps whether it's changed in the cloud
        value:
          type: array
          description: Value is the group cat ID
          items:
            type: string
            example: <group_cat_id_admin>
        last_modified_time:
          type: number

    OtaImageCreateRequest:
      type: object
      properties:
        fw_version:
          type: string
          description: OTA firmware version
          example: "1.0"
        image_name:
          type: string
          description: OTA image name to be created
          example: "Alexa echo 2"
        model:
          type: string
          description: OTA image model
          example: "echo 2"
        type:
          type: string
          description: OTA image type
          example: "alexa"
        base64_fwimage:
          type: string
          description: Base 64 encoded image string. Maximum allowed size is 5 MB
      required:
        - base64_fwimage
        - image_name
    NodeAttachTagsRequest:
      type: object
      properties:
        tags:
          type: array
          items:

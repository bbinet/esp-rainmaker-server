    APIFailureResponseWithCode:
      type: object
      properties:
        status:
          type: string
          example: "failure"
        error_code:
          type: string
          example: "1XXXXX"
        description:
          type: string
          example: "Failure description"

    APISuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        description:
          type: string
          example: "Success description"

    APISuccessResponseWithRequestId:
      allOf:
        - type: object
          properties:
            request_id:
              type: string
              example: "request_id"
              description: Request ID of the device group sharing request which needs to be added in the sharing confirmation request
        - $ref: "#/components/schemas/APISuccessResponse"
      xml:
        name: APISuccessResponseWithRequestId

    APIResponseWithNodeId:

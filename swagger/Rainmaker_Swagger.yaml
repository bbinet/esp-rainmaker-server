  /{version}/admin/nodes:
    get:
      tags:
        - User Node Association
      summary: Get the nodes claimed by the Admin user
      description:
        "This API is to get the node details of nodes claimed by the admin:
        <li>When no parameter is passed list of all the nodes and nodeInfo are returned.</li>
        <li>When type is passed, list of all the nodes and nodeInfo which are of that type are returned.</li>
        <li>When model & type is passed, list of all the nodes and nodeInfo which are of that model & type are returned.</li>
        <ul><li><b>Note: type is a required parameter if model is provided.</b></li></ul>
        <li>When model, type & fw_version is passed, list of all the nodes and nodeInfo which are of that model, type & fw_version are returned.</li>
        <ul><li><b>Note: model & type is a required parameter if fw_version is provided.</b></li></ul>
        <li>When subtype is passed, list of all the nodes and nodeInfo which are of that subtype are returned.</li>
        <li>When project_name is passed, list of all the nodes and nodeInfo which are of that project_name are returned.</li>
        <li>When subtype and project_name is passed, list of all the nodes and nodeInfo which are of that subtype & project_name are returned.</li>
        <li>We can use type along with subtype, project_name, model and fw_version</li>
        <li>When node status is passed, list of all the nodes and nodeInfo that have the given status are returned.</li>
        <ul><li>Node status can also be provided in conjunction with tags, type, model & fw_version, subtype & project_name</li></ul>
        <li>When node_id is passed the details of that node (NodeInfo) is returned</li>
        <p>To support pagination num_records and start_id are present</p>
        "
      operationId: getAdminUserNodes
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
        - name: num_records
          in: query
          description: Used for pagination, number of records to be fetched
          required: false
          schema:
            type: string
        - name: start_id
          in: query
          description: Used for pagination, Start Id of the record to be fetched
          required: false
          schema:
            type: string
        - name: node_id
          in: query
          description: Used to fetch details of particular node
          required: false
          schema:
            type: string
        - name: type
          in: query
          description: Used to fetch list of nodes based on type.
          required: false
          example: led
          schema:
            type: string
        - name: model
          in: query
          description: Used to fetch list of nodes based on model and type.
          required: false
          example: "2021"
          schema:
            type: string
        - name: fw_version
          in: query
          description: Used to fetch list of nodes based on model, type & fw_version.
          required: false
          example: "1.0"
          schema:
            type: string
        - name: tags
          in: query
          description: Used to fetch list of nodes based on tags.
          required: false
          example: "location:pune OR location:bangalore"
          schema:
            type: string
        - name: node_status
          in: query
          description:
            "Used to fetch list of nodes based on node status. They can be not_activated, online, offline, deactivated, active and inactive.
            <br><br>**not_activated**: node hasn't connected even once to the cloud
            <br>**online**: node is connected
            <br>**offline**: node is not connected
            <br>**deactivated**: the node certificate is deactivated"
          required: false
          example: "online"
          schema:
            type: string
        - name: subtype
          in: query
          description: Used to fetch list of nodes based on subtype.
          required: false
          example: "LED bulb"
          schema:
            type: string
        - name: project_name
          in: query
          description: Used to fetch list of nodes based on project_name.
          required: false
          example: "rainmaker"
          schema:
            type: string
        - name: summary
          in: query
          description: Used to fetch node count summary of active, inactive and non activated nodes. start_time should also be provided.
          required: false
          example: true
          schema:
            type: boolean
        - name: start_time
          in: query
          description: Used only if summary is true. This is the time window till the current time for which the node came online atleast once and was hence active.
          required: false
          example: 1683110219659
          schema:
            type: number
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/GetAdminNodesList"
                  - $ref: "#/components/schemas/NodeInfo"
                  - $ref: "#/components/schemas/NodeStatusSummaryResponse"
              examples:
                Node_List:
                  value:
                    nodes: ["thing", "thing2"]
                    node_info:
                      - node_id: thing
                        name: "Light"
                        fw_version: "1.0"
                        type: "Lightbulb"
                        model: "led_light"
                        subtype: "LED bulb"
                        project_name: "rainmaker"
                        node_status: "online"
                        registration_timestamp: 1688454438
                        tags: ["esp.city:pune"]
                        metadata: {"serial_no": "abc123"}
                        granted_admin_access: READ
                        network_id: network_id1
                        status:
                          connectivity:
                            connected: true
                            timestamp: 123322222
                        activation_timestamp: 1234567890
                        laststatusupdate_timestamp: 1234567890
                        last_config_update_timestamp: 1234567890
                        last_activity_timestamp: 1234567890
                      - node_id: thing2
                        name: "Light"
                        fw_version: "1.0"
                        type: "Lightbulb"
                        model: "led_light"
                        subtype: "LED bulb"
                        project_name: "rainmaker"
                        node_status: "online"
                        registration_timestamp: 1688454438
                        tags: ["esp.city:mumbai"]
                        metadata: {"serial_no": "xyz123"}
                        status:
                          connectivity: {}
                        activation_timestamp: 1234567890
                        laststatusupdate_timestamp: 1234567890
                        last_config_update_timestamp: 1234567890
                        last_activity_timestamp: 1234567890
                    next_id: "thing2"
                    total: 123
                    quota: 5
                When Node_id is passed:
                  value:
                    node_id: thing
                    name: "Light"
                    fw_version: "1.0"
                    type: "Lightbulb"

  /{version}/admin/file/upload_request:
    get:
      tags:
        - File upload
      summary: Get Upload URL to upload the file
      description:
        "This API is used to fetch upload_url (<b>Validity:</b> 1 hour) to upload the files to RainMaker. This API can also be used to upload QA report, bootloader or other files related to an OTA image.
        <br><br>The user needs to specify the <b>file_name</b>. This <b>file_name</b> is independent of the file name on the host machine. The <b>file_name</b> must be between <b>1</b> and <b>100</b> characters.
        <br><br> To verify the integrity of the file uploaded to s3, the user can provide an optional md5 checksum only as per the instructions in the params <b>md5_checksum</b> below.
        <br><br><b>Note:</b><ul>
        <li> The client will have to send a PUT HTTP request to the <b>upload_url</b> with headers -<br> ```'Content-type': 'application/octet-stream'```</li>
        <li> If md5 checksum was added during GET call then the same has to added as an header in the PUT api for upload with headers -<br> ```'Content-MD5': 'correct/valid_md5checksum_of_uploaded_file/image'```
        </li>
        <li> The value of the Content-MD5 header has to be in the <b>base64</b> format only. No replacement of symbols like '+' with %2b in the PUT call. Add the md5 checksum in base64 <b>as it is.</b>
        </li>
        <li> If <b>upload_url</b> is expired you will get a <b>403 Forbidden</b> response. You may fetch a new <b>upload_url</b>.</li>
        <li> Max file size allowed is <b>100MB</b></li></ul>"
      operationId: fileuploadrequest
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
        - name: file_name
          in: query
          description: Name of file to be uploaded.
          required: true
          schema:
            type: string
        - name: entity_id
          in: query
          description: Entity Id of file to be uploaded.(e.g. ota_image_id)
          required: true
          schema:
            type: string
        - name: entity_type
          in: query
          description: Entity type of file to be uploaded.(e.g. ota_image, cert)
          required: true
          schema:
            type: string
        - name: md5_checksum
          in: query
          description: It should be a <b>valid/correct</b> MD5 checksum of the file. It should be in <b>base64</b> format only. If there are any <b>'+'</b> symbols in the checksum, then they should be replaced by <b>'%2b'</b> while adding as the param value in the GET request.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetFileUploadURLRequest"
        "400":
          description: failure
            <br>Error Codes and Error Description
            <br>100004- You are not authorized to perform this operation, Please contact administrator
            <br>134001- File already exists
            <br>134002- File name is missing
            <br>134009- Entity Type is missing
            <br>134010- Entity ID is missing
            <br>134017- Invalid file name. File name must be between 1 and 100 characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUploadApiFailureResponse"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure <br>Error Codes and Error Description
            <br>100070- Too many requests, try again later
        "500":
          description: failure
            <br>Error Codes and Error Description
            <br>101001- Error in fetching user details
            <br>112009- Failed generate upload URL
            <br>108062- Error occurred while getting node list
            <br>134004- Error occurred while saving file
            <br>134007- Error occurred while getting file URL
            <br>134008- Error occurred while getting files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUploadApiFailureResponse"
      security:
        - AccessToken: []
  /{version}/admin/file/upload_confirm:
    post:
      tags:
        - File upload
      summary: Confirm file upload
      description:
        "After the admin uploads the files to S3 bucket, this API needs to be called.
        It is expected that the admin will upload the file separately using a suitable tool with the help of the upload URL returned by the <b>GET: /admin/file/upload_request</b>.
        <br>It returns the file id and the S3 URL of the file. The URL can be used to download the file.
        <br><br>Ex. To upload bootloader for a particular firmware image, specify file_type as <b>bootloader</b>."

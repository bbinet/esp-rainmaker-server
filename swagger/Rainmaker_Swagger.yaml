              config:
                summary: Request node configuration
                value:
                  node_payload: '{"data":{"node_id":"CU9rjkCjMwwGje5BdhWnr5","config_version":"2020-03-20","info":{"name":"ESP RainMaker Device","fw_version":"1.0","type":"Lightbulb","readme":"https://raw.githubusercontent.com/espressif/esp-rainmaker/master/examples/led_light/README.md","model":"led_light","project_name":"led_light","platform":"esp32c3"},"devices":[{"name":"Light","type":"esp.device.lightbulb","primary":"Power","params":[{"name":"Name","type":"esp.param.name","data_type":"string","properties":["read","write"]},{"name":"Power","type":"esp.param.power","data_type":"bool","properties":["read","write"],"ui_type":"esp.ui.toggle"},{"name":"Brightness","type":"esp.param.brightness","data_type":"int","properties":["read","write"],"bounds":{"min":0,"max":100,"step":1},"ui_type":"esp.ui.slider"},{"name":"Hue","type":"esp.param.hue","data_type":"int","properties":["read","write"],"bounds":{"min":0,"max":360,"step":1},"ui_type":"esp.ui.hue-slider"},{"name":"Saturation","type":"esp.param.saturation","data_type":"int","properties":["read","write"],"bounds":{"min":0,"max":100,"step":1},"ui_type":"esp.ui.slider"}]}],"services":[{"name":"Time","type":"esp.service.time","params":[{"name":"TZ","type":"esp.param.tz","data_type":"string","properties":["read","write"]},{"name":"TZ-POSIX","type":"esp.param.tz_posix","data_type":"string","properties":["read","write"]}]},{"name":"Scenes","type":"esp.service.scenes","attributes":[{"name":"deactivation_support","value":"no"}],"params":[{"name":"Scenes","type":"esp.param.scenes","data_type":"array","properties":["read","write"],"bounds":{"max":10}}]},{"name":"System","type":"esp.service.system","params":[{"name":"Reboot","type":"esp.param.reboot","data_type":"bool","properties":["read","write"]},{"name":"Factory-Reset","type":"esp.param.factory-reset","data_type":"bool","properties":["read","write"]},{"name":"Wi-Fi-Reset","type":"esp.param.wifi-reset","data_type":"bool","properties":["read","write"]}]}]},"timestamp":1768588609}'
                  signature: "3045022037a8afd2789cad5579b0c71358a6efc2fbb70068fec6e1b5e81f3ed5a4767e8f022100bc096c9e41f73ceefb354b08ed13bdb8f38666c9b1c1b7e7fa9b04bde82a0b80"

                $ref: "#/components/examples/UploadBootloader"
              Upload QA report:
                $ref: "#/components/examples/UploadQAReport"
        description:
          Request body for confirming file upload. File ID is the ID of the file uploaded.
          You can provide file_type=qa_report to indicate that file is OTA image QA report. To upload a bootloader for OTA image, provide file_type=bootloader.
          You can provide additional metadata and description for file.

        required: true
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUploadConfirmAPIResponse"
        "400":
          description: failure
            <br>Error Codes and Error Description
            <br>100004- You are not authorized to perform this operation, Please contact administrator
            <br>134003- File does not exist. Please ensure that file was successfully uploaded using upload URL
            <br>134005- File ID is missing
            <br>134006- Invalid File ID
            <br>134009- Entity Type is missing
            <br>134010- Entity ID is missing
            <br>104015- OTA image not found
            <br>134022- Discoverable cannot be set when public is false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUploadApiFailureResponse"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure <br>Error Codes and Error Description
            <br>100070- Too many requests, try again later
        "500":
          description: failure
            <br>Error Codes and Error Description
            <br>101001- Error in fetching user details
            <br>134004- Error occurred while saving file
            <br>134007- Error occurred while getting file URL
            <br>134008- Error occurred while getting files
            <br>134011- Error occurred while processing associated files
            <br>134012- Error occurred while creating download url
            <br>134013- Error file upload already confirmed
            <br>134016- File size exceeds the limit. Maximum allowed file size is 100 MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUploadApiFailureResponse"
      security:
        - AccessToken: []


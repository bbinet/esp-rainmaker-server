    get:
      tags:
        - Device grouping
      summary: This API fetches the sharing details for the groups and matter fabrics the current user is associated with.
      description:
        "This API is used to fetch the Group/fabric sharing details. Here are the details -
        <ul><li>When no parameters are passed it returns the sharing details of all the groups that this user is associated with (Primary or Secondary)</li>
        <li>When group_id is passed, it returns the sharing details of that group. The requesting user can be Primary or Secondary.</li>
        <li>When sub_groups is set as true(with or without groupId), it returns the sharing details of the sub groups as well. The requesting user can be Primary or Secondary.</li>
        <li>When parent_groups is set as true(with or without groupId), it returns the sharing details of the parent groups as well. The requesting user can be Primary or Secondary.</li>
        <li>If the Get group sharing API is called by the secondary user, the list of other secondary users this group is associated with, will not be returned.</li></ul>"
      operationId: getUserGroupSharing
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
        - name: group_id
          in: query
          description: group_id of group to get the sharing details
          required: false
          schema:
            type: string
        - name: sub_groups
          in: query
          description: When set to true returns details of sub-group as well.
          required: false
          schema:
            type: boolean
            default: false
        - name: metadata
          in: query
          description: When set to true returns metadata that was set during sharing.
          required: false
          schema:
            type: boolean
            default: false
        - name: parent_groups
          in: query
          description: group_id of group to get the sharing details
          required: false
          schema:
            type: boolean
            default: false
      responses:

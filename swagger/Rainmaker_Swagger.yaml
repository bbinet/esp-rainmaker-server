                      <br> For E.g ["api:Get"]
                    items:
                      type: string
                  resource:
                    type: array
                    description: List of resources i.e API paths
                      <br> For E.g [ "/v1/admin/otaimage" ]
                    items:
                      type: string
                required:
                  - effect
                  - action
                  - resource
          required:
            - statement


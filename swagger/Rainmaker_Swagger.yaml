        <br><br>
        <br><b>Response Format Explanation:</b>
        <ul>
        <li><b>status:</b> Represents whether the association exists currently or not. Any mapping when deleted and this history feature is enabled, it is stored as 'inactive'</li>
        <li><b>first_mapping_ts:</b> Timestamp of the very first creation of a user-node association. This field is NOT updated when: (1) reactivating previously inactive entries, or (2) modifying existing mappings (role/source changes). It is only updated when establishing a completely new user-node association with no prior history</li>
        <li><b>last_updated_ts:</b> A new field added with current default value same as first_mapping_ts and it is updated for any update operation between a user and a node</li>
        <li><b>mapping_count:</b> Count of re-mappings after removal between the same user and the same nod. Increments only on add->remove->add cycles, not on role/source changes or successive mappings</li>
        </ul>
        <br><b>Single Query Options:</b>
        <ul>
        <li><b>user_id/user_name:</b> Returns all nodes associated with the user. Common: user_id, user_name per user</li>
        <li><b>node_type:</b> Returns all users with their associated nodes for the specified node type. Common: user_id, user_name, node_type per user</li>
        <li><b>user_tags:</b> Returns all users with the specified tag and their associated nodes. Common: user_id, user_name per user</li>
        <li><b>node_id:</b> Returns all users associated with the node. Common: user_id, user_name per user, with total count</li>
        <li><b>No parameters:</b> Returns all users with their associated nodes. Common: user_id, user_name per user</li>
        </ul>
        <br><b>Valid Combination Query Options:</b>
        <ul>
        <li><b>user_id/user_name + node_type:</b> Returns nodes of the specified type associated with the user. Common: user_id, user_name, node_type per user</li>
        <li><b>user_tags + node_type:</b> Returns users with the specified tag and their associated nodes of the specified type. Common: user_id, user_name, node_type per user</li>
        <li><b>node_id + user_id/user_name:</b> Returns specific user's association with the node (if exists). Common: user_id, user_name per user</li>
        <li><b>node_id + user_tags:</b> Returns users with the specified tag that are associated with the node. Common: user_id, user_name per user, with total count</li>
        </ul>
        <br><b>Invalid Combinations (Not Supported):</b>
        <ul>
        <li><b>user_id/user_name + user_tags:</b> Not allowed - Use either user_id/user_name OR user_tags separately</li>
        <li><b>node_id + node_type:</b> Not allowed - Use either node_id OR node_type separately</li>
        <li><b>user_id + user_name:</b> Not allowed - Use either user_id OR user_name, not both</li>
        </ul>"
      operationId: getAssociationHistory
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
        - name: user_id
          in: query
          description: user_id of the user whose node association history is to be fetched
          required: false

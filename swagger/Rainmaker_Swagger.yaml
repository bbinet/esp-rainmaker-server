        - AccessToken: []

  /{version}/user/file:
    get:
      tags:
        - File upload
      summary: Get uploaded files
      description: |
        <p>Fetches files uploaded by users with comprehensive filtering and pagination support.</p>

        <h4>Primary Operations:</h4>
        <ul>
          <li><strong>Get specific file:</strong> Specify <b>file_id</b> to get download URL for a specific file</li>
          <li><strong>Get public files from other users:</strong> Specify both <b>user_name</b> and <b>file_id</b> to access public files uploaded by another user</li>
          <li><strong>List all files:</strong> Call without parameters to get all files for the authenticated user</li>
        </ul>

        <h4>Filtering Options:</h4>
        <ul>
          <li><b>file_name</b> - Filter by exact filename match</li>
          <li><b>file_type</b> - Filter by file type (supports prefix matching, e.g., \"image\" matches \"image/jpeg\")</li>
          <li><b>entity_type</b> - Filter by entity type (e.g., \"node\", \"ota_image\")</li>
          <li><b>entity_id</b> - Filter by entity ID. When used with entity_type, finds files for that specific entity. When used alone, matches any entity with this ID</li>
        </ul>
      operationId: userfileget
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
        - name: file_id
          in: query
          description: file_id
          schema:
            type: string
        - name: file_name
          in: query
          description: file_name
          schema:
            type: string
            enum: [node]
        - name: entity_id
          in: query
          description: Entity Id
          schema:
            type: string
        - name: entity_type
          in: query
          description: Entity type, For E.g image
          schema:
            type: string
        - name: file_type
          in: query
          description: Custom file type, For E.g Specify file_type=image to get image files
          schema:
            type: string
        - name: num_records
          in: query
          description: This is used for pagination.
          schema:
            type: string
            default: "25"
        - name: start_id
          in: query
          description: This is used for pagination.
          schema:
            type: string
        - name: user_name
          in: query
          description: User name of the user whose files are to be fetched. When used with discoverable=true, filters discoverable files by user.
          schema:
            type: string
        - name: discoverable
          in: query
          description: Set to "true" to list approved discoverable files across all users. Can be combined with user_name to filter by user.
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/FileUploadConfirmAPIResponse"
                  - $ref: "#/components/schemas/GetDiscoverableFilesApiResponse"
              examples:
                Get All files or Get Files by Entity Id and Entity type:
                  $ref: "#/components/examples/UserGetFile"
                Get Discoverable Files (discoverable=true):
                  $ref: "#/components/examples/GetUserDiscoverableFiles"
        "400":
          description: failure
            <br>Error Codes and Error Description
            <br>100004- You are not authorized to perform this operation, Please contact administrator
            <br>100021- Invalid query param
            <br>134010- Entity ID is missing
            <br>134016- Error occurred while creating download url
            <br>134017- Please specify a valid entity_type. Valid value is node
            <br>134018- Please provide file_id with user_name
            <br>134019- The provided file_id does not exist or public file not found
            <br>134027- Invalid discoverable param
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUploadApiFailureResponse"
        "404":
          description: failure
            <br>Error Codes and Error Description
            <br>134004- File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUploadApiFailureResponse"
        "500":
          description: failure
            <br>Error Codes and Error Description
            <br>101001- Error in fetching user details
            <br>103014- Error in checking if node belongs to user
            <br>134007- Error occurred while getting file URL
            <br>134008- Error occurred while getting files
            <br>134012- Error occurred while creating download url
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUploadApiFailureResponse"
      security:
        - AccessToken: []

    put:
      tags:
        - File upload
      summary: Update file discoverable/public status
      description: |
        <p>Updates discoverable or public status for an uploaded file.</p>
        <p><b>Note:</b> The <b>file_id</b> can contain '/' characters. Clients must URL-encode it when sending as a query parameter.</p>
      operationId: userfileupdate
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
        - name: file_id
          in: query
          description: File ID. URL-encode if it contains '/'.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                discoverable:
                  type: boolean
                  description: Request or cancel discoverable status
                public:
                  type: boolean
                  description: Update public flag
            examples:
              Request file to be discoverable:
                value: {"discoverable": true}
              Cancel file's discoverable request:
                value: {"discoverable": false}
              Make file public:
                value: {"public": true}
        required: true
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APISuccessResponse"
        "400":
          description: failure
            <br>Error Codes and Error Description
            <br>100006- Invalid request body
            <br>134005- File ID is missing
            <br>134023- No update fields provided
            <br>134022- Discoverable cannot be set when public is false
            <br>134028- Cannot set public=false while file is discoverable. Set discoverable=false first.
            <br>134003- File does not exist
            <br>134020- Discoverable request already pending
            <br>134021- File already discoverable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUploadApiFailureResponse"
        "500":
          description: failure
            <br>Error Codes and Error Description
            <br>134008- Error occurred while getting file
            <br>134004- Error occurred while saving file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUploadApiFailureResponse"
      security:
        - AccessToken: []

    delete:
      tags:
        - File upload
      summary: Delete uploaded file

  /{version}/user/nodes/tsdata:
    get:
      tags:
        - Time Series Data
      summary: This API is used to get the Time Series Data
      description:
        "<p>This API is used to get the time series data for various measures like temperature, humidity, electric current, etc. reported by nodes. This information can be queried based on parameter name and aggregation interval.
        <br>The data can be retrieved for different aggregation intervals like minute, hour, day, week, month or year
        clubbed with query parameters <b>num_intervals</b> to specify the number of interval starting from today or <b>start_time and end_time</b> to specify the date and time range.
        <ol>
        <li><b>Minute</b> - Max Interval: 1 day or 1440 minutes</li>
        <li><b>Hour</b> - Max Interval: 1 day or 24 hours</li>
        <li><b>Day</b> - Max Interval: 31 days and end_time must be strictly greater than the start_time.</li>
        <li><b>Week</b> - Max Interval: 12 weeks. week_start parameter is used to specify the start Day of the week. Ex: Monday</li>
        <li><b>Month</b> - Max Interval: 12 months</li>
        <li><b>Year</b> - Max Interval: 5 years</li>
        <li><b>Raw</b> - Max Interval: 31 days</li>
        </ol></p>

        <p>Aggregates supported by different data types:
        <ol>
        <li><b>float</b> - All</li>
        <li><b>int</b> - All</li>
        <li><b>bool</b> - raw, latest, count</li>
        <li><b>string</b> - raw, latest, count</li>
        </ol></p>

        <p>Differential is supported for data of type float and int.</p>

        <p><font color='red'>Note: </font>
        <li>If aggregate is provided then either <b>start_time and end_time</b> or <b>num_interval</b> needs to be provided for each query.</li>
        <li>If aggregate is not provided then raw data is returned for last 7 days or given start or end time is returned.</li>
        <li>The Range of data that is retrieved are [StartTime,EndTime) or [ CurrentTime - NumInterval, CurrentTime)</li>
        <li>When using start_id the inputs passed (apart from start_id and num_records) need to be kept the same for every call.</li>
        <li>Aggregate: latest is not supported for AggregationInterval: Month and Year</li>
        <li>When TimeZone is provided the start time and end time are also need to be in provided time zone</li>
        </p>"
      operationId: GetTSData
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
        - name: node_id
          in: query
          description: "This parameter is used to specify the node ID for which measures needs to be fetched."
          required: true
          example: node_id1
          schema:
            type: string
        - name: param_name
          in: query
          description: "Some examples of the parameter names are -
            <li>temperature</li>
            <li>humidity</li>
            <li>electric_current</li>
            A single valid measure need to be passed."
          example: "temperature"
          required: true
          schema:
            type: string
        - name: aggregate
          in: query
          description:
            "Following aggregate functions are supported - (To be changed)
            <li><b>raw</b> - Returns all the actual values reported by device in given time range. This is the default value for the parameter.</li>
            <li><b>latest</b> - Returns the last entry reported by the device for the given aggregation interval and time range</li>
            <li><b>min</b> - Returns the min value reported by the device for the given aggregation interval and time range</li>
            <li><b>max</b> - Returns the max value reported by the device for the given aggregation interval and time range</li>
            <li><b>count</b> - Returns the number of values reported by the device for the given aggregation interval and time range</li>
            <li><b>avg</b> - Returns the avg values reported by the device for the given aggregation interval and time range</li>
            <li><b>sum</b> - Returns the sum of values reported by the device for the given aggregation interval and time range</li> <br>
            Only one aggregate function can be specified at a time."
          example: "raw"
          required: false
          schema:
            type: string
            default: raw
        - name: aggregation_interval
          in: query
          description:
            "This parameter is used to specify the aggregation interval for the params.
            They can be -
            <li>minute</li>
            <li>hour</li>
            <li>day</li>
            <li>week</li>
            <li>month</li>
            <li>year</li>
            <p>It is not applicable when aggregate is passed as raw.</p>"
          required: false
          schema:
            type: string
        - name: differential
          in: query
          description:
            "If differential then to apply aggregates the data is on the incremental values and then apply the aggregates i.e.
            for T1 the value will be V1 - V0 on which the aggregates will be applied.
            <br><b>Note: </b>Differential is supported for data of type float and int"
          required: false
          schema:
            type: boolean
            default: false
        - name: reset_on_negative
          in: query
          description: "Only applicable when `differential` is true, else ignored. If `reset_on_negative` is true, then the value will be reset to present value if the difference is negative."
          required: false
          schema:
            type: boolean
            default: false
        - name: desc_order
          in: query
          description: "This is set to true if the timeseries data to retrieve should be in descending order"
          required: false
          schema:
            type: boolean
            default: false
        - name: type
          in: query
          description:
            "This parameter is used to specify the data type of the param.
            They can be -
            <li>float</li>
            <li>int</li>
            <li>bool</li>
            <li>string</li>"
          example: "float"
          required: false
          schema:
            type: string
            default: float
        - name: week_start
          in: query
          description: "This parameter is used to specify the start day of the week. This field is case insensitive. Only applicable in cases were the time_interval value is <b>week</b>."
          example: ""
          required: false
          schema:
            type: string
            default: Monday
        - name: start_time
          in: query
          description: "This parameter is used to set the start time. The expected Format for start time is epoch time in seconds. Ex: 1628557200"
          required: false
          schema:
            type: number
        - name: end_time
          in: query
          description: "This parameter is used to set the end time. The expected Format for end_date is epoch time in seconds. Ex: 1628557200"
          required: false
          schema:
            type: number
        - name: num_intervals
          in: query
          description:
            "The user can specify either the start_time and end_time or num_intervals parameter.
            If the num_intervals is specified, then the API will fetch the data from the current time for the previous 'n' intervals.
            <p>i.e
            <br> If <i>time_interval=day, aggregate=avg, parameter_name=temperature , device_id=1234</i>
            <br> <i>num_intervals=5</i>
            <br> The output would have data for previous 5 days starting from today. Not Applicable for Aggregate=Raw.</p>"
          required: false
          schema:
            type: number
        - name: start_id
          in: query
          description: "This parameter is used for pagination.
            <br><b>The pagination token can be used for up to 5 Query Invocations, OR for a duration of up to 1 hour whichever comes first.</b>"
          required: false
          schema:
            type: string
        - name: num_records
          in: query
          description: "This parameter is used for pagination. Max Value = 200"
          example: ""
          required: false
          schema:
            type: number
            default: 200
            maximum: 200
        - name: timezone
          in: query
          description: "This parameter is used to set the timezone(location) from where the query is made, based on <a href='https://en.wikipedia.org/wiki/List_of_tz_database_time_zones'>IANA Tz Database name</a>. TimeZone can also be provided like EST but location name is preferred. This field is case-insensitive."
          required: false
          example: Asia/Shanghai
          schema:
            type: string
            default: UTC
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TSAPISuccessResponse"
              examples:
                Raw Data:
                  $ref: "#/components/examples/TSDataRawdata"
                Hourly Data:
                  $ref: "#/components/examples/TSDataHourlyData"
                Daily Data:
                  $ref: "#/components/examples/TSDataDailyData"
                Weekly Data:
                  $ref: "#/components/examples/TSDataWeeklyData"
                Monthly Data:
                  $ref: "#/components/examples/TSDataMonthlyData"
                Yearly Data:
                  $ref: "#/components/examples/TSDataYearlyData"
        "400":
          description: failures
            <br>Error Codes And Error Description
            <br>100002- API Version is not supported
            <br>100021- Invalid query param
            <br>126001- Fetching node to User mapping failed
            <br>126002- User to node mapping does not exist
            <br>126003- Please Provide a valid Node ID
            <br>126004- Please Provide a valid parameter name
            <br>126005- Please Provide a valid aggregate
            <br>126006- Please Provide a valid aggregation interval
            <br>126007- Please Provide a valid week start
            <br>126008- Error, Input query params StartTime and EndTime are missing
            <br>126009- Please Provide a valid Interval count
            <br>126010- Please Provide a valid start time
            <br>126011- Please Provide a valid end time
            <br>126012- Please Provide a valid time duration
            <br>126013- Start time must be less than end time
            <br>126015- If aggregate is provided then either start_time and end_time or num_interval needs to be provided for each query
            <br>126016- AggregationInterval 'Month' and 'Year' are not supported for 'latest' aggregate
            <br>126017- Please provide a valid data type for the measure. Valid types are float,int,bool,string
            <br>126018- Looks like there is a type mismatch. Please provide a valid data type for the measure
            <br>126019- The given aggregate is not supported for this data type. Please refer documentation for supported aggregates
            <br>126020- Error, Please specify the timezone parameter correctly
            <br>126021- Differential is not supported for types bool and string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TSAPIFailureResponse"
        "500":
          description: Server failures
            <br>Error Codes And Error Description
            <br>100001- Error in fetching user details
            <br>126014- Error getting data from DB. Please try after some time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TSAPIFailureResponse"
      security:
        - AccessToken: []


  /{version}/user/node_automation:
    post:
      tags:
        - Automation Trigger and Actions
      summary: This API adds new automation trigger
      description: "This API adds new automation trigger.\n\n
        **For Daylight-based Automations** provide 'location' and specify the 'event_type' as 'daylight'. The supported
        events are 'sunrise' and 'sunset'.\n\n
        **For Weather-based Automations** provide 'location' and specify the 'event_type' as 'weather'.
        The supported events are 'temperature', 'pressure', 'humidity', 'wind_speed' and 'weather_condition'.\n\n

        For Location-based Automation Triggers provide **positive coordinates** for North latitude and East longitude.
        Conversely, provide **negative coordinates** for South latitude and West longitude.
        For eg. 18.5204° N, 73.8567° E transforms to 18.5204,73.8567 and
        18.5204° S, 73.8567° W transforms to -18.5204,-73.8567 \n\n

        List of all parameters and supported units:
        <table>
        <thead>
        <tr>
        <th>Parameter<br></th>
        <th>Description<br></th>
        <th>Standard<br></th>
        <th>Metric<br></th>
        <th>Imperial<br></th>
        </tr>
        </thead>
        <tbody>
        <tr><td><font color='#fb3e3d'>o</font> temperature </td><td> Temperature </td><td> Kelvin </td><td>Celsius</td><td> Fahrenheit </td></tr>
        <tr><td><font color='#fb3e3d'>o</font> pressure </td><td> Atmospheric Pressure </td><td> hPa </td><td>hPa</td><td> hPa </td></tr>
        <tr><td><font color='#fb3e3d'>o</font> humidity </td><td> Humidity </td><td> % </td><td>%</td><td> % </td></tr>
        <tr><td><font color='#fb3e3d'>o</font> wind_speed </td><td> Wind Speed </td><td> meter/sec   </td><td>meter/sec  </td><td> miles/hour</td></tr>
        <tr><td><font color='#fb3e3d'>o</font> weather_condition </td><td> Weather Condition </td><td> check note  </td><td> check note    </td><td>  check note  </td></tr>
        </tbody>
        </table>
        <br>
        **Note:** The supported weather conditions are 'Thunderstorm', 'Drizzle', 'Rain', 'Snow', 'Clear', 'Clouds', 'Mist', 'Smoke', 'Haze', 'Dust', 'Fog', 'Sand', 'Ash', 'Squall', 'Tornado'"
      operationId: addAutomationTriggerAction
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAutomationTriggerRequest"
            examples:
              Add Automation Trigger:
                $ref: "#/components/examples/AutomationTriggerRequestBodyExample"
              Add Weather-based Automation Trigger:

          schema:
            type: string
            default: "v1"
        - name: node_id
          in: query
          description: Used to specify nodeId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNodeDetailsRequest"
            examples:
              Attach tags:
                value:
                  tags:
                    - location:pune
              Update Metadata:
                value:
                  metadata:
                    key: xyz
                    regions: ["xyz", "pqr"]
              Delete Metadata:
                value:
                  metadata: null
              Grant Admins access to Node Data:
                value:
                  grant_admin_access: "READ"
              Update All:
                value:
                  tags:
                    - location:pune
                  metadata:
                    key: xyz
                    regions: ["xyz", "pqr"]
                  grant_admin_access: "READ"
        description:
          Request body for attaching tags or updating metadata of the node.<br>
          Can also grant access of node data like config and params to admins.<br>
          metadata -> This is a custom metadata with the following JSON rules <ol>
          <li> 1.metadata -> null
          The metadata will get deleted entirely</li>
          <li> 2. metadata -> {}
          There will be no change in the metadata also no validation error in the input</li>
          <li> 3. metadata -> object of key and value where key will be string and value can be any data type(array, object, string, number , boolean)
          Metadata will get stored in the above format , new keys will get appended and the existing keys value will get updated accordingly</li>
          <li> 4. metadata -> {'key':null}
          Metadata JSON keys can be deleted by above syntax </li>
          <li> 5. If value is array, it will get overwrite and not update</p></ol>
          <br><b> Matter fabric </b><ol>
        required: false

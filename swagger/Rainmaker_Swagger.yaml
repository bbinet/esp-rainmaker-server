      summary: Proxy Node MQTT Action
      description: |
        This API allows proxying node MQTT actions (params, initparams, config) with signed payloads.
        <br>The request must include a signed payload using the node's private key. This payload contains `data` as per the action and `timestamp`. This will be done on device and then sent locally to the user's phone app. Make sure to calculate the `signature` over the unescaped JSON.
        <br>The `timestamp` in the payload must be within 5 minutes of the current server time. Timestamps up to 5 seconds in the future are also accepted to account for minor clock skew.
      operationId: proxyNodeAction
      parameters:
        - name: version

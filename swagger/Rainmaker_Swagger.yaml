            <br>100002- API Version is not supported
            <br>100006- Invalid request body
            <br>103020- Node does not belong to user
            <br>103046- Error, signature is missing
            <br>103047- Error, signature is incorrect
            <br>103048- Error, invalid signature format provided
            <br>103049- Error, the timestamp in the payload is outside the allowed time window (within 5 minutes in the past or 5 seconds in the future). Please resend the request with a valid timestamp
            <br>103050- Error, node_id is required in the request path
            <br>103051- Error, action is required in the request path
            <br>103052- Error, unsupported action

  /{version}/admin/otaimage/upload_request:
    get:
      tags:
        - OTA Service
      summary: Get pre-signed url to upload the firmware image or firmware package zip to S3
      description:
        "This API is used to fetch presigned upload_url (<b>Validity:</b> 1 hour) to upload the firmware image or firmware package file.
        <br><br> Supported image types are <b>package</b> for uploading zip file containing OTA image, bootloader and other related files) and <b>firmware</b> for uploading OTA image binary file.
        <br><br> Default image_type is firmware, if image_type is not specified.
        <br><br>The user needs to specify the OTA <b>image_name</b>. Image name is the name of OTA image binary. This <b>image_name</b> is independent of the firmware image binary/ firmware package file name.
        <br><br>For image_type=package, please provide image_name as name of the zip file that you are uploading, without the .zip extension. The file name must be of format  your-project-name_version.zip.
        <br><br> To verify the integrity of the file uploaded to s3, the user can provide an optional md5 checksum only as per the instructions in the params <b>md5_checksum</b> below.

        <br><br><b>Note:</b><ul><li>If already existing OTA <b>image_name</b> is given and the OTA image is not referenced by any OTA job, it will be replaced. This action cannot be undone.</li>
        <li> The client will have to send a PUT HTTP request to the <b>upload_url</b> with headers -<br> ```'Content-type': 'application/octet-stream'```</li>
        <li> If md5 checksum was added during GET call then the same has to added as an header in the PUT api for upload with headers -<br> ```'Content-MD5': 'correct/valid_md5checksum_of_uploaded_file/image'```
        </li>
        <li> The value of the Content-MD5 header has to be in the <b>base64</b> format only. No replacement of symbols like '+' with %2b. Add the md5 checksum in base64 <b>as it is.</b>
        </li>
        <li> If <b>upload_url</b> is expired you will get a <b>403 Forbidden</b> response. You may fetch a new <b>upload_url</b>.</li>
        <li> Maximum supported OTA Image size is <font color='red'>200 MB</font>. For OTA package file(image_type=package), there is no limit on package file size, but binary file inside uploaded zip must be upto 200 MB in size.</li>
        <li>Nodes won't be able to download the OTA images with size more than 24 MB via MQTT streams i.e. MQTT based file delivery won't be available.</li></ul>"
      operationId: OTAImageUploadRequestURL
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
        - name: image_name
          in: query
          description: Name of the OTA firmware image to be uploaded
          required: true
          schema:
            type: string
        - name: image_type
          in: query
          description: Image type(firmware/package/raw).
          required: false
          schema:
            type: string
            default: firmware
        - name: md5_checksum
          in: query
          description: It should be a <b>valid/correct</b> MD5 checksum of the file. It should be in <b>base64</b> format only. If there are any <b>'+'</b> symbols in the checksum, then they should be replaced by <b>'%2b'</b> while adding as the param value in the GET request.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUploadOTAImagePreSignedUrlResponse"
        "400":
          description: failure<br>Error Codes and Error Description
            <br>100002- API Version is not supported
            <br>100004- You are not authorized to perform this operation, Please contact administrator
            <br>104002- Image Name is missing
            <br>104008- OTA Image is associated with another OTA job, can't update
            <br>104009- Error occurred while generating OTA image id
            <br>136006- Invalid OTA image type specified. Valid values are firmware, package and raw
            <br>104039- Please provide valid image name with extension.
            <br>104039- OTA Image is associated with file, can't update
            <br>104039- Error occurred while getting file details

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure <br>Error Codes and Error Description
            <br>100070- Too many requests, try again later
        "500":
          description: failure<br>Error Codes and Error Description
            <br>100001- Error in fetching user details
            <br>112009- Failed to generate upload URL
            <br>104006- Error occurred while fetching OTA image
            <br>104007- Error occurred while fetching OTA image associated with another otajob
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
      security:
        - AccessToken: []

  /{version}/admin/otaimage/upload_confirm:
    post:
      tags:
        - OTA Service
      summary: This API is used to confirm the upload Firmware image or package.
      description:
        "After the admin uploads the image(firmware/package zip) to S3 bucket, this API needs to be called.
        <br><br>It is expected that the admin will upload the files separately using a suitable tool with the help of the pre-signed upload URL returned by the <b>GET: /admin/otaimage/upload_request</b>.
        <br><br> Supported values for image_type are firmware and package. If value is not speicfied, it is assumed to be firmware.
        <br><br>If you are uploading a package then:
        <ul><li>it should contain exactly one firmware image with file name format - project_name.bin </li>
        <li>optional - bootloader image with bootloader.bin name</li>
        <li>optional - other associated files with any extension </li>
        </ul>
        <br>Paramerer conventions<ul>
        <li><b>fw_version</b> and <b>model</b> should be provided if not present in the uploaded OTA image binary. It can also be used to override the binary <b>fw_version</b> and <b>model</b>.
        <li>It returns the S3 URL of the OTA image.</li>
        <li>If you have uploaded an invalid file, it will be deleted completely. You will have to reupload a valid one on the <b>upload_url</b> again.</li>
        <li>Specify appropriate value for image_type - firmware/package according to what was uploaded</li></ul><br><br>"
      operationId: OTAImageUploadConfirmURL
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OTAImageUploadConfirmRequest"
        description: Request body for confirming OTA image upload
        required: true
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtaImageCreateResponse"
        "400":
          description: failure <br>Error Codes and Error Description
            <br>100006- Invalid request body
            <br>104018- OTA Image Id is missing
            <br>104004- Firmware version is missing
            <br>104005- Model is missing
            <br>104030- Error, the uploaded OTA image size was greater than the maximum supported size - 200 MB. Reupload a smaller OTA file on the upload_url.
            <br>104032- OTA image with the given Id not uploaded. Please upload it on the respective pre-signed upload URL.
            <br>112000- Package file name is not valid
            <br>136006- Invalid OTA image type specified
            <br>112004- Couldn't find the bin file in uploaded package
            <br>104039- Please provide valid image name with extension.
            <br>112014 - Error, the uploaded OTA package size was greater than the maximum supported size - 300 MB. Reupload a smaller OTA file on the upload_url.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure <br>Error Codes and Error Description
            <br>100070- Too many requests, try again later
        "500":
          description: failure <br>Error Codes and Error Description
            <br>100001- Error in fetching user details
            <br>100037- Error occurred while getting file size
            <br>109007- Failed to read bin file
            <br>104014- Error occurred while saving OTA image
            <br>104028- Error occurred while reading the uploaded OTA image file
            <br>104029- Error occurred while computing the OTA Image MD5 hash
            <br>104031- Error occurred while reading the OTA image binary file headers. Reupload a valid binary on the upload_url
            <br>104017- Error in deleting OTA image
            <br>112003- Couldn't extract uploaded package file
            <br>112005- Couldnt find the bin file in uploaded package
            <br>112010- Failed generate upload URL
            <br>112007- Failed to read bin file
            <br>112002- Couldnt read the uploaded package file
            <br>104013- Error occurred while uploading OTA image
            <br>104038- Error occurred while processing associated files
            <br>104035- Error occurred while creating an IoT stream for the OTA Image
            <br>112001- Package file name should be less than 128 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
      security:
        - AccessToken: []

  /{version}/admin/otajob:
    post:
      tags:
        - OTA Service
      summary: This API creates a new OTA job
      description:
        'This API creates a new OTA job. The user needs to specify the OTA Image ID, Job name, nodes and/or groups.
        <br>
        <br>Currently, the OTA update can be pushed for upto 100 nodes and/or 10 groups of nodes or all claimed nodes (Group:FFFF-FFFF) in a single request.
        <br>For pushing the OTA Update to a group of nodes, the **groups** parameter must be filled with a list of group IDs.
        <br>For pushing the OTA update to all the claimed nodes, user needs to specify the group_id as **FFFF-FFFF**

        <br>
        <br>The **description** added to OTA Jobs will be shown to end Users in case of User Approval OTA jobs.

        <br><br>
        Some OTA Jobs may need to stay **active** even when all their target nodes are done with the OTA.
        <br>
        i.e All the nodes have reported ''success'' or ''rejected'' OTA Statuses.
        <br>
        This may be done by passing <code>continuous: true</code> in the request params.
        <br>
        This may be requried for cases where the admins created an OTA on some groups,
        but want the Job to stay active because they expect new nodes to be added to the group at a later time.

        <br>
        <br>Dynamic OTA Jobs can be created with config based rules, like an OTA job which will be available to all nodes of a particular type,
        model, fw_version and combinations among these.
        <br>**Note:** Dynamic OTA Jobs are **Continuous Jobs by default (i.e never marked as completed).**
        This is because new nodes can always become eligible for the Job at a later time.

        <br><br>**Note:** You can also create a Dynamic OTA Job that targets **multiple rule filters** as follows:
        <br>1. Create multiple Dynamic Groups with different rule filters.
        <br>2. Create a Continuous OTA Job with all the above (Dynamic) Group IDs as the target groups.

        <br>
        <br>OTA Jobs can also be assigned a priority between 1 and 10, 1 being the highest and 10 being the lowest.
        Nodes will get an OTA job only after it is done with higher priority jobs.

        <br>OTA Jobs can be assigned a timeout, i.e number of seconds after which the job expires.
        <br><b>NOTE: The OTA image must have unarchived status.</b>
        <br>OTA Job can not be force-pushed with user_approval=true</br>

        <br><b>IMPORTANT:</b> If OTA image is more than 24 MB in size then nodes cannot download that using streams i.e. MQTT based file delivery won''t be available.

        <br><br><b> User Approval job with Access to firmware</b>
        <br> For a user approval OTA, <b>user_ota_image_acccess</b> can be specified to grant the firmware binary access to users.
        The Firmware URL will be returned when user queries for available OTA using <b>/user/nodes/ota_update</b> API.

        <br><br>
        **Network Serialised OTA Job:**
        <br>Network Serialised Jobs are for cases where we want to serialise or constrain the delivery of OTA Jobs to Target nodes, at a Local-Network level.
        <br>This can be useful for cases like delivering OTA jobs to nodes that in networks that cannot handle too much traffic.
        <br>
        <br>Network Serialised Jobs requires the following parameters **inside** the <code>network_serialisation</code> object inside the request body:
        <br>1. <code>ota_task_duration</code>: Estimate of the number of seconds, the node may take to process this OTA Job.
        <br>&nbsp;&nbsp;  This includes: downloading all the way to rebooting and reporting success.
        <br>2. <code>min_wait</code>, and <code>max_wait</code>: If node fetches but is unable to acquire a slot of this OTA Job.
        <br>&nbsp;&nbsp;  Node can wait between min_wait and max_wait seconds before trying again.
        <br>
        <br>**Note:**
        <br>1. Network Serialised Jobs can be used with other types of Jobs like Force Push and User Approval.
        <br>&nbsp;&nbsp;  But they required <code>network-id</code> to be reported via **"Node config Attributes"**.
        <br>&nbsp;&nbsp;  If some nodes have not passed this value, they will not be able to get the OTA Job.
        <br>2. By default, the delivery of OTAs is serialised to "no more than **3**" in a particular Network.
        <br>&nbsp;&nbsp;  This number can be configured in the Deployment settings.

        <br><br><b> Giving securely signed images - </b> <br>
        While creating ota job you can specify to securely sign the ota image before delivering it to node/device.
        <br>There are two ways with which this can be achieved.
        <ul>
        <li>
        Specify the key_names -
        Specify the key name(s) in the request body with which the input ota image will be signed and the signed image will be given to node/device.
        Note that -  Digest of the node should match the digest of the key that you are specifying otherwise node will reject the OTA.
        </li>
        <li>
        Allow RainMaker to select the right key -
        RainMaker will choose the appropriate key depending on the digest of the nodes in the ota job and sign the image with key before delivering it to node.
        </li>
        </ul>
        <br>Either auto select signing key or explicit key name in the request can be specified.'
      operationId: createotajob
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
        - name: force_push
          in: query
          description: Force push OTA image
          required: false
          schema:
            type: string
            default: "false"
        - name: user_approval
          in: query
          description: If true, OTA can be pushed to node by end users
          required: false
          schema:
            type: string
            default: "false"
        - name: notify
          in: query
          description: Indicates if end user should be notified about OTA job
          required: false
          schema:
            type: string
            default: "false"
        - name: continuous
          in: query
          description: Indicates if OTA Job should stay active after all target nodes are finished with it.
          required: false
          schema:
            type: string
            default: "false"
        - name: network_serialised
          in: query
          description: Indicates if OTA should be delivered to each Network in serialised Manner.
          required: false
          schema:
            type: string
            default: "false"
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/OtaJobCreateRequest"
                - $ref: "#/components/schemas/OtaJobCreateImageUrlRequest"
            examples:
              Create a new OTA job Upload:
                value:
                  ota_job_name: "OTA Job for Alexa devices, FW version 1.0 "
                  description: "Sample Description from Admin."
                  groups: ["FFFF-FFFF"]
                  nodes: ["node_id1", "node_id2"]
                  priority: 5
                  timeout: 1296000
                  node_type: "Light"
                  node_model: "ESPLight"
                  node_fw_version: "1.0"
                  ota_image_id: "Image Id which needs to be pushed"
                  metadata:
                    {
                      "download_window": {"start": 0, "end": 120},
                      "validity": {"start": 1639732410, "end": 1639991610},
                    }
              Create a new OTA job Upload using Image Url:
                value:
                  ota_job_name: "OTA Job for Alexa devices, FW version 1.0 "
                  description: "Sample Description from Admin."
                  groups: ["FFFF-FFFF"]
                  nodes: ["node_id1", "node_id2"]
                  priority: 5
                  timeout: 1296000
                  node_type: "Light"
                  node_model: "ESPLight"
                  node_fw_version: "1.0"
                  ota_image_url: "Image url which needs to be pushed"
                  metadata:
                    {
                      "download_window": {"start": 0, "end": 120},
                      "validity": {"start": 1639732410, "end": 1639991610},
                    }
              Create a new OTA job Upload based with Priority:
                value:
                  ota_job_name: "OTA Job for Alexa devices, FW version 1.0 "
                  description: "Sample Description from Admin."
                  groups: ["FFFF-FFFF"]
                  nodes: ["node_id1", "node_id2"]
                  priority: 5
                  ota_image_id: "Image Id which needs to be pushed"
                  metadata:
                    {
                      "download_window": {"start": 0, "end": 120},
                      "validity": {"start": 1639732410, "end": 1639991610},
                    }
              Create a new OTA job Upload that expires in 1 day:
                value:
                  ota_job_name: "OTA Job for Alexa devices, FW version 1.0 "
                  description: "Sample Description from Admin."
                  groups: ["FFFF-FFFF"]
                  nodes: ["node_id1", "node_id2"]
                  timeout: 864000
                  ota_image_id: "Image Id which needs to be pushed"
                  metadata:
                    {
                      "download_window": {"start": 0, "end": 120},
                      "validity": {"start": 1639732410, "end": 1639991610},
                    }
              Create a new OTA job Upload to dynamically affect nodes based on config rules:
                value:
                  ota_job_name: "OTA Job for Alexa devices, FW version 1.0 "
                  description: "Sample Description from Admin."
                  node_type: "Light"
                  node_model: "ESPLight"
                  node_fw_version: "1.0"
                  ota_image_id: "Image Id which needs to be pushed"
                  metadata:
                    {
                      "download_window": {"start": 0, "end": 120},
                      "validity": {"start": 1639732410, "end": 1639991610},
                    }
              Create OTA job with keys to sign image:
                value:
                  ota_job_name: "OTA Job for Alexa devices, FW version 1.0 "
                  secure_boot: {"key_names": ["key_name"]}
                  groups: ["FFFF-FFFF"]
                  nodes: ["node_id1", "node_id2"]
                  ota_image_id: "Image Id which needs to be pushed"
              Create OTA job with auto selecting the signing key based on digest:
                value:
                  ota_job_name: "OTA Job for Alexa devices, FW version 1.0 "
                  groups: ["FFFF-FFFF"]
                  nodes: ["node_id1", "node_id2"]
                  ota_image_id: "Image Id which needs to be pushed"
                  secure_boot: {"auto_select_key": true}
              Create OTA job with access of firmware binary to users:
                value:
                  ota_job_name: "OTA Job for Alexa devices, FW version 1.0 "
                  groups: ["FFFF-FFFF"]
                  nodes: ["node_id1", "node_id2"]
                  ota_image_id: "Image Id which needs to be pushed"
                  user_ota_image_acccess: true
              Create OTA Job that is network serialised:
                value:
                  ota_image_id: Image Id which needs to be pushed
                  ota_job_name: Thread_Light_v1.1
                  groups:
                    - Group1
                    - Group2
                  network_serialisation:
                    ota_task_duration: 3600
                    min_wait: 1200
                    max_wait: 2400
        description: Request body for creating a new OTA Job
        required: true
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtaJobCreateResponse"
        "400":
          description: failure <br>Error Codes and Error Description
            <br>100004- You are not authorized to perform this operation, Please contact administrator
            <br>100006- Invalid request body
            <br>100013- Failed to generate JSON response
            <br>104006- Error occurred while fetching OTA image
            <br>104018- OTA Image Id is missing
            <br>104015- OTA image not found
            <br>104033- Either OTA Image Id or OTA Image Url must be provided.
            <br>104034- Error, OTA image is archived
            <br>105001- OTA job name is missing
            <br>105002- OTA nodeId or groupId is missing
            <br>105004- Error occurred while fetching OTA job info
            <br>105005- OTA job name already exists
            <br>105006- Failed to save OTA job details
            <br>105007- Failed to save OTA node status
            <br>105008- Failed to save latest OTA node status
            <br>105009- The OTA Service is being set-up for your account. Please try again after some time
            <br>105010- Error occurred while creating pre-signed url
            <br>105011- Error occurred while publishing to topic
            <br>105052- Nodes and Groups can't be provided when creating a Dynamic OTA job
            <br>105054- Please use a valid priority for OTA, i.e between 1 to 10.
            <br>105055- Invalid timeout specified, Maximum timeout is 30 days
            <br>105056- OTA Job can have timeout only if OTA is not a user_approval job
            <br>105057- OTA Job can be notified to users only if user_approval flag is true
            <br>105067- Invalid request, Image signing is not supported with ota image url
            <br>105068- Invalid request, Explict signing key cannot be specified with auto select signing key option
            <br>105069- Invalid request, Force push cannot be specified with Auto select signing key
            <br>105070- Invalid request, For force push the image should be already signed by signing APIs.
            <br>136025- Invalid request, Key name is invalid or missing. The key name must be string of 1-256 characters. It can contain only alphanumeric characters, forward slashes (/), underscores (_), and dashes (-)
            <br>136022- Invalid request, Duplicate key names in the request
            <br>136020- Invalid request, Upto 3 key names can be specified
            <br>136021- Invalid request, key name not exist or you do not have access
            <br>105073- Invalid request, user ota image access cannot be specified for non user approval jobs
            <br>105028- The request cannot include more than 10 groups
            <br>105029- The request cannot include more than 100 nodes
            <br>105074- Invalid request, Job task duration is missing for Network Serialised job.
            <br>105075- Invalid request, Min and Max wait durations must be specified together, or not at all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OTAJobAPIFailureResponse"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure <br>Error Codes and Error Description
            <br>100070- Too many requests, try again later
        "500":
          description: failure
            <br>Error Codes and Error Description
            <br>100001- Error in fetching user details
            <br>105030- Error occurred while submitting job
            <br>105050- Error occurred while creating an IoT stream for the OTA job
            <br>105053- Error ocurred while creating Dynamic OTA Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OTAJobAPIFailureResponse"
      security:
        - AccessToken: []
    get:
      tags:
        - OTA Service
      summary: Get the details about OTA jobs for the user
      description:
        "This API provides the details about the OTA job created by the user.
        <ol>
        <li>
        If the user specifies <b>ota_job_id</b> or <b>ota_job_name</b>, then the details about the specific job are returned.
        In case of ota_job_name all jobs which contain the pattern are returned.
        </li>
        <li>
        If <b>ota_image_id</b> is provided then the latest ota job that is not archived by the user with that image id will be returned and
        if <b>archived</b> is set as true then latest ota job that is archived by the user with that image id will be returned
        </li>
        <li>
        If <b>archived</b> is provided as true, then the all ota job that are archived by the user will be returned
        </li>
        <li>
        If <b>all</b> is provided as true, then all the OTA jobs created by the user are returned
        </li>
        <li>
        else the details about all the OTA jobs that have been created by the user and are not archived will be returned.
        </li>
        </ol>"
      operationId: getOTAJob
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
        - name: ota_job_id
          in: query
          description: OTA Job Id
          required: false
          schema:
            type: string
        - name: ota_job_name
          in: query
          description: OTA Job name - Pattern
          required: false
          schema:
            type: string
        - name: ota_image_id
          in: query
          description: OTA Image Id
          required: false
          schema:
            type: string
        - name: num_records
          in: query
          description: Used for pagination, number of records to be fetched
          required: false
          schema:
            type: string
        - name: start_id
          in: query
          description: Used for pagination, Start Id of the record to be fetched
          required: false
          schema:
            type: string
        - name: archived
          in: query
          description: Flag to get archived ota jobs. [Valid values are true/false]
          required: false
          schema:
            type: boolean
            default: false
        - name: all
          in: query
          description: Flag to get all the ota jobs irrespective whether a job is archived or not. [Valid values are true/false]
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: success.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/GetOTAJobResponse"
                  - $ref: "#/components/schemas/OTAJob"
              examples:
                Default Output:
                  $ref: "#/components/examples/GetOTAJobs"
                When queried with ota_job_id:
                  $ref: "#/components/examples/GetOTAJob"
                When queried with ota_image_id:
                  $ref: "#/components/examples/GetOTAJobByImageId"
                OTA job having ota image with size more than 24 MB(stream_id not available):
                  $ref: "#/components/examples/OTAJobWithLargerOTAImage"
                When queried with ota_job_name pattern:
                  $ref: "#/components/examples/GetOTAJobs"
                When queried with archived or all as true:
                  $ref: "#/components/examples/GetArchivedOTAJobs"
                Job with secure signing:
                  $ref: "#/components/examples/GetSecureSigningOTAJobs"
                Job with auto select signing key:
                  $ref: "#/components/examples/GetAutoSelectSigningKeyOTAJobs"
                Job with network serialised OTA Delivery:
                  $ref: "#/components/examples/GetNetworkSerialisedOTAJobs"
        "400":
          description: failure <br>Error Codes and Error Description
            <br>100004- You are not authorized to perform this operation, Please contact administrator
            <br>105004- Error occurred while fetching OTA job info
            <br>105012- OTA job not found
            <br>105013- Error occurred while fetching node OTA status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OTAJobAPIFailureResponse"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure <br>Error Codes and Error Description
            <br>100070- Too many requests, try again later
        "500":
          description: failure
            <br>Error Codes and Error Description
            <br>100001- Error in fetching user details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OTAJobAPIFailureResponse"
      security:
        - AccessToken: []
    put:
      tags:
        - OTA Service
      summary: Cancel/Archive an OTA job
      description:
        "This API cancels/archives OTA job. The user needs to specify the OTA Job Id and archive flag in request body.
        <br><b>NOTE: An OTA Job can be archived only when it is in finished or cancelled state.</b>"
      operationId: cancelOrArchiveOtaJob
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtaJobCancelRequest"
            examples:
              Cancel OTA job:
                value:
                  ota_job_id: "ota_job_id"
              Archive OTA job:
                value:
                  ota_job_id: "ota_job_id"
                  archive: true
        description: Request body for cancelling/archiving OTA Job
        required: true
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OTACancelJob"
              examples:
                Cancel OTA Job:
                  value:
                    ota_job_id: string
                    ota_job_name: string
                    ota_image_id: string
                    completed_count: 0
                    total_count: 1
                    total_node_count: 1,
                    triggered_count: 0,
                    started_count: 0,
                    in_progress_count: 0,
                    success_count: 1,
                    failed_count: 0,
                    other_count: 0,
                    triggered_timestamp: string
                    cancelled_timestamp: string
                    groups:
                      - FFFF-FFFF
                    status: cancelled
                    stream_id: string
                Archive OTA Job:
                  value:
                    ota_job_id: string
                    ota_job_name: string
                    ota_image_id: string
                    completed_count: 0
                    total_count: 1
                    total_node_count: 1,
                    triggered_count: 0,
                    started_count: 1,
                    in_progress_count: 0,
                    success_count: 0,
                    failed_count: 0,
                    other_count: 0,
                    triggered_timestamp: string
                    cancelled_timestamp: string
                    groups:
                      - FFFF-FFFF
                    status: cancelled
                    archived: true
                    stream_id: string
        "400":
          description: failure <br>Error Codes and Error Description
            <br>100004- You are not authorized to perform this operation, Please contact administrator
            <br>100006- Invalid request body
            <br>105014- OTA Job Id is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OTAJobAPIFailureResponse"
        "404":
          description: failure <br>Error Codes and Error Description
            <br>105015- Either Job is cancelled/expired or Job does not exists
            <br>105032- Either Job is still active, or non-existent or already archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OTAJobAPIFailureResponse"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure <br>Error Codes and Error Description
            <br>100070- Too many requests, try again later
        "500":
          description: failure <br>Error Codes and Error Description
            <br>100001- Error in fetching user details
            <br>105004- Error occurred while fetching OTA job info
            <br>105016- Error occurred while cancelling job
            <br>105033- Error occurred while archiving the job
            <br>105051- Error occurred while deleting the IoT stream associated with the OTA job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OTAJobAPIFailureResponse"
      security:
        - AccessToken: []


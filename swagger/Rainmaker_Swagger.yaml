  /{version}/user/nodes/{node_id}:
    delete:
      tags:
        - User Node Association
      summary: Delete Node - Delete all user associations
      description: |
        Deletes a node by deleting all user associations, sharing requests, group memberships,
        automation triggers, and time series data. This operation can only be performed by
        the primary owner of the node.

        **Important Notes:**
        - Only the primary owner can delete a node
        - All the user associations will be deleted
        - All node sharing requests will be deleted
        - Node will be removed from all user groups
        - Automation triggers associated with the node will be deleted
        - Time series data, user_tags, and metadata for the node will be deleted
        - User command requests are properly cancelled during deletion
        - For OCPP nodes, user schedules are cleaned up
        - Only user-assigned admin access is removed
        - The node itself remains in the system but with no user associations

      operationId: deleteNode
      security:
        - AccessToken: []
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
        - name: node_id
          in: path
          description: Node ID to delete
          required: true
          schema:
            type: string
            example: "ABCDEF1234567890"
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APISuccessResponse"
              examples:
                success:
                  value:
                    status: "success"
                    description: "Node deleted successfully. All user associations, sharing requests, and group memberships have been removed."
        "400":
          description: failure<br>Error Codes and Error Description
            <br>100002- API Version is not supported
            <br>100006- Invalid request body
            <br>100001- node_id is missing in path parameters
            <br>107085- Error, User should be primary owner of all nodes in the request
            <br>103055- Node not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
        "403":
          description: Forbidden - RBAC permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
              examples:
                rbac_denied:
                  value:
                    error_code: 403
                    description: "User does not have permission to delete this node"
        "500":
          description: failure <br>Error Codes and Error Description
            <br>103054- Failed to delete node associations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
  /{version}/user/nodes/sharing:

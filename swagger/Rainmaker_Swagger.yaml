        "500":
          description: failure <br>Error Codes and Error Description
            <br>100008- Error in fetching tenant context details
            <br>101019- Attempt limit exceeded, please try after some time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAPIFailureResponse"

  /{version}/admin/user2:
    post:
      tags:
        - Admin User Management
      summary: Creates the new user in user email mobile user pool
      description: |
        <p>This API creates a new user in user email mobile user pool. Only Email is supported as user name. Here the role is disjoint of the flags the user need to explicitly assign the required role.
        <br>Accessible to both admin and superadmin users, but admin users cannot create superadmin users.</p>
        <h4>Locale:</h4>
        <p>You can configure the user's preferred language locale for receiving emails and SMS by including the query param: <code>locale</code> in the request. <h5>Note: Emails and SMS will be sent based on the specified locale only for their respective message template types that support custom configuration.</h5> For example: </p>
        <pre> locale: "user_locale_value" </pre>
         <ul>
          <li><b>Reserved value:</b> <code>"rm_non_branded"</code> — This value is designated for internal use and is utilized for sending emails in a specific locale when no default email is configured for the given template type. If this value is provided, it will result in an "Invalid locale" error.</li>
         <li>If the query param: <code>locale</code> is omitted or left empty, the default locale configured by the admin will be used for emails and SMS.</li> <li> It is case-insensitive and input locale will be considered in lowercase.</li>
        </ul>
      operationId: createUserWithPrivileges2
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
        - name: locale
          in: query
          description: It allows the user to specify their preferred language locale for receiving emails and SMS. It is case-insensitive and input locale will be considered in lowercase.
          required: false
          schema:
            type: string
            default: no_locale
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserAdminRequest"
            examples:
              Create Super Admin User:
                value:
                  user_name: "username@domain.com"
                  super_admin: true
              Create User:
                value:
                  user_name: "username@domain.com"
              Create Admin User:
                value:
                  user_name: "username@domain.com"
                  admin: true
                  quota: 5
              Create User with role:
                value:
                  user_name: "username@domain.com"
                  admin: true
                  roles: ["role1", "role2"]
        description: Request body for creating new user
        required: true
      responses:
        "201":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APISuccessResponse"
        "400":
          description: failure <br>Error Codes and Error Description
            <br>100006- Invalid request body
            <br>101001- User name is missing
            <br>101002- Email-id is not in correct format
            <br>101006- User account already exist
            <br>101042- Invalid admin quota. Quota should be greater than 0
            <br>101053- Error, self-operations are prohibited
            <br>129020- Invalid role name
            <br>129033 - Current user does not have role sufficient to attach the given roles to user
            <br>129037 - Some of the roles to be attached have no role level, please assign role levels to the roles, then try
            <br>129038 - Current user roles do not have role level, please assign role levels to the roles, then try
            <br>129039 - Role based Access Control is disabled, can't attach RBAC roles to user
            <br>129040 - Role based Access Control is enabled. Use RBAC roles to grant access to user
            <br>100052 - Error, this operation is not supported for oauth-only deployments
            <br>100023 - User does not exist
            <br>100004 - You are not authorized to perform this operation, Please contact administrator
            <br>112048- Invalid locale. Please enter a valid locale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAPIFailureResponse"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure <br>Error Codes and Error Description
            <br>100070- Too many requests, try again later
        "500":
          description: failure <br>Error Codes and Error Description
            <br>100008- Error in fetching tenant context details
            <br>100026- Error occurred while sending email to user
            <br>101008- Creating user failed
            <br>101034- Error occurred while checking if trial user registration limit is exceeded
            <br>129013- Error occurred while fetching role
            <br>129019- Error occurred while updating user role mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAPIFailureResponse"
      security:
        - AccessToken: []
    put:
      tags:
        - Admin User Management
      summary: Updates the user in user email mobile user pool
      description:
        "<p>This API updates the permissions and quota of the user in user email mobile user pool.
        <br>It's accessible to both admin and superadmin users. However, admin users are not permitted to update users to superadmin roles."
      operationId: updateUserPrivileges2
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
        - name: locale
          in: query
          description: To give custom locale language preference and override current user's configured language locale for <b>tags verification email</b>. It is case-insensitive and input locale will be considered in lowercase
          schema:
            type: string
            default: empty
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserAdminRequest"
            examples:
              Update user with no privileges to admin:
                value:
                  user_name: user@domain.com
                  admin: true
              Upgrade user with admin privileges to superadmin:
                value:
                  user_name: user@domain.com
                  super_admin: true
              Downgrade user with superadmin privileges to admin:
                value:
                  user_name: user@domain.com
                  admin: true
              Remove superadmin privileges from superadmin user:
                value:
                  user_name: user@domain.com
                  super_admin: false
              Remove admin privileges from admin user:
                value:
                  user_name: user@domain.com
                  admin: false
              Update User Quota:
                value:
                  user_name: user@domain.com
                  quota: 2
              Attach User with Tags:
                value:
                  user_name: user@domain.com
                  verify_auth_code: false
                  tags: ["inverter:pv", "beta:true"]
              Attach User with Tags (User has to verify code):
                value:
                  user_name: user@domain.com
                  verify_auth_code: true
                  tags: ["inverter:pv", "beta:true"]
        description: Request body for updating User.
        required: true
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APISuccessResponse"
        "400":
          description: failure
            <br>Error Codes and Error Description
            <br>100006- Invalid request body
            <br>101001- User name is missing
            <br>101002- Email-id is not in correct format
            <br>101037- Please provide valid phone number
            <br>101042- Invalid admin quota. Quota should be greater than 0
            <br>101053- Error, self-operations are prohibited
            <br>129037 - Some of the roles to be attached have no role level, please assign role levels to the roles, then try
            <br>129038 - Current user roles do not have role level, please assign role levels to the roles, then try
            <br>129039 - Role based Access Control is disabled, can't attach RBAC roles to user
            <br>129040 - Role based Access Control is enabled. Use RBAC roles to grant access to user
            <br>100052 - Error, this operation is not supported for oauth-only deployments
            <br>101080 - Please specify either admin or super_admin query parameter
            <br>101081 - Not allowed to set the superadmin as false as the user to be updated is not a superadmin
            <br>101082 - Not allowed to set the admin as false as the user to be updated is not an admin
            <br>101083 - The user to be updated is already a superadmin
            <br>101084 - The user to be updated is already an admin
            <br>100004 - You are not authorized to perform this operation, Please contact administrator
            <br>112048- Invalid locale. Please enter a valid locale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAPIFailureResponse"
        "404":
          description: failure<br>Error Codes and Error Description
            <br>101025- User does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAPIFailureResponse"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure <br>Error Codes and Error Description
            <br>100070- Too many requests, try again later
        "500":
          description: failure
            <br>Error Codes and Error Description
            <br>100001- Error in fetching user details
            <br>101028- Error occurred while updating user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAPIFailureResponse"
      security:
        - AccessToken: []

    get:
      tags:
        - Admin User Management
      summary: Fetches the details of a user
      description:
        "<p> This API is accessible to admin as well as superadmin users.<ul>
        <li>It fetches all the internal users by default.</li>
        <li>Admins/Superadmins can fetch all the users by providing the query parameter 'all' as true.</li>
        <li>Admins can fetch all the users except the superadmins.</li>
        <li>Admins/Superadmins can fetch all admin users by providing the query parameter 'admin' as true.</li>
        <li>Superadmins can fetch all the superadmins by providing the query parameter 'superadmin' as true.</li>
        <li>If user name is provided then user_id, user_name, super_admin flag, quota, user roles, locale, URL of profile picture and name of that user is returned.</li>
        <li>The <b>super_admin</b> flag is returned only when the user is a super admin, in other cases, it will not be returned in the output.</li>
        <li>The <b>admin</b> flag is returned only when the user is a admin, in other cases, it will not be returned in the output.</li>
        <li>Also the <b>picture_url</b> and <b>name</b> are not returned in the output, if it is not set by the user.</li>
        <li>If locale returned is <b>no_locale</b>, it means user has not configured any locale and it shall receive messages that are set default by admin for all template types</li></ul></p>"
      operationId: getUsers2
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
        - name: user_name
          in: query
          description: user_name of the user whose details are to be fetched.<br>If full email is unknown, prefix of the email can be used to list Users. Note, for OAuth deployments, search by prefix of username is only supported if encryption is disabled.
          required: false
          schema:
            type: string
        - name: user_id
          in: query
          description: user_id of the user whose details are to be fetched.
          required: false
          schema:
            type: string
        - name: all
          in: query
          description: To fetch all the users(Admins can fetch all the users except super admins)
          required: false
          schema:
            type: boolean
            default: false
        - name: admin
          in: query
          description: To fetch all the admin users
          required: false
          schema:
            type: boolean
            default: false
        - name: superadmin
          in: query
          description: To fetch all the superadmin users.(Admins are not allowed to fetch superadmin users)
          required: false
          schema:
            type: boolean
            default: false
        - name: start_id
          in: query
          description: use next_id from the response as start_id to fetch the next set of records. A combination of userID and user name.
          required: false
          schema:
            type: string
        - name: num_records
          in: query
          description: number of users to fetch
          required: false
          schema:
            type: number
            default: 25
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetInternalUsers"
              examples:
                Super Admin User with MFA enabled:
                  value:
                    users_list:
                      - user_id: string
                        user_name: string
                        super_admin: true
                        picture_url: string
                        quota: number
                        name: string
                        mfa: true
                        phone_number: <+Mobile Number with country code>
                        locale: string
                    next_id: string
                    total: 25
                Admin Users:
                  value:
                    users_list:
                      - user_id: string
                        user_name: string
                        admin: true
                        picture_url: string
                        quota: number
                        name: string
                        mfa: false
                        phone_number: <+Mobile Number with country code>
                        locale: string
                    next_id: string
                    total: 25
                Users with roles:
                  value:
                    users_list:
                      - user_id: string
                        user_name: string
                        picture_url: string
                        quota: number
                        name: string
                        mfa: false
                        phone_number: <+Mobile Number with country code>
                        user_roles: ["role1", "role2"]
                        locale: string
                    next_id: string
                    total: 25
                Users with custom user data:
                  value:
                    users_list:
                      - user_id: string
                        user_name: string
                        name: string
                        mfa: false
                        phone_number: <+Mobile Number with country code>
                        locale: string
                        custom_data:
                          demographics:
                            value:
                              Languages:
                                - English
                              origin: Asian
                          esp.location:
                            value:
                              esp.city: Pune
                              esp.latitude: xx.xxxx
                              esp.longitude: xx.xxxx
                              esp.state: Maharashtra
                          membership_info:
                            value:
                              premium: true
                          profile:
                            value:
                              age: 60
                              name: FirstName Lastname
                Prefix search on user_name (if user_name passed is "abc"):
                  value:
                    users_list:
                      - user_id: string
                        user_name: abc@email.com
                        picture_url: string
                        quota: number
                        name: string
                        mfa: false
                        phone_number: <+Mobile Number with country code>
                        locale: string
                      - user_id: string
                        user_name: abcd@email.com
                        picture_url: string
                        quota: number
                        name: string
                        mfa: false
                        phone_number: <+Mobile Number with country code>
                        locale: string
                      - user_id: string
                        user_name: abcde@email.com
                        picture_url: string
                        quota: number
                        name: string
                        mfa: false
                        phone_number: <+Mobile Number with country code>
                        locale: string
                    next_id: string
                    total: 25
                Other Users:
                  value:
                    users_list:
                      - user_id: string
                        user_name: string
                        picture_url: string
                        quota: number
                        name: string
                        mfa: false
                        phone_number: <+Mobile Number with country code>
                        locale: string
                    next_id: string
                    total: 25
        "400":
          description: failure<br>Error Codes and Error Description
            <br>101002- Email-id is not in correct format
            <br>101037- Please provide valid phone number
            <br>100004 - You are not authorized to perform this operation, Please contact administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAPIFailureResponse"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure <br>Error Codes and Error Description
            <br>100070- Too many requests, try again later
        "500":
          description: failure<br>Error Codes and Error Description
            <br>100001- Error in fetching user details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAPIFailureResponse"
      security:
        - AccessToken: []
    delete:
      tags:
        - Admin User Management
      summary: Deletes user account
      description:
        "This API can be used by superadmins as well as admin-users to delete other users account. Here are the details-
        <ul>
        <li>If the 'request' query param is true, user delete request is initiated and verification code is sent to the invoking user email.
        <li>If 'verification_code' query param is specified, user account is deleted.
        <li>Admin users are not allowed to delete other admin users.
        <li>The 'super_admin' flag has higher priority over 'admin' flag.
        <li>If user is the guest user, user will be deleted immediately and no verification code will be sent.</ul>"
      operationId: deleteUser2
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
        - name: request
          in: query
          description: if delete user request is to be initiated, value of request param should be true.
          schema:
            type: boolean
            default: false
        - name: verification_code
          in: query
          description: if delete user request is to be verified and user account is to be deleted, the verification code received by user should be entered as value of verification_code query param.
          schema:
            type: number
        - name: user_name
          in: query
          description: user_name of the user who needs to be deleted
          required: true
          schema:
            type: string
        - name: locale
          in: query
          description: To give custom locale language preference and override current user's configured language locale for emails and sms of user deletion verification and confirmation. It is case-insensitive and input locale will be considered in lowercase
          schema:
            type: string
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APISuccessResponse"
        "400":
          description: failure <br>Error Codes and Error Description
            <br>101001- User name is missing
            <br>101002- Email-id is not in correct format
            <br>101037- Please provide valid phone number
            <br>119005- Verification code is incorrect
            <br>119006- User does not exist
            <br>119007- Verification code is missing
            <br>119015- No delete request exists for the user
            <br>119016- Attempt limit exceeded, please request for delete user again
            <br>119017- Super-admin user deletion is restricted!
            <br>112048- Invalid locale. Please enter a valid locale
            <br>100004 - You are not authorized to perform this operation, Please contact administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserNodeSharingAPIFailureResponse"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure <br>Error Codes and Error Description
            <br>100070- Too many requests, try again later
        "500":
          description: failure <br>Error Codes and Error Description
            <br>100001- Error in fetching user details
            <br>119001- Error occurred while storing user delete request
            <br>119003- Error occurred while getting user delete request
            <br>119004- Failed to delete user
            <br>119008- Sending verification code failed
            <br>119009- Failed to initiate user delete request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserNodeSharingAPIFailureResponse"
      security:
        - AccessToken: []


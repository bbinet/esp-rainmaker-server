            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponseWithCode"
        "500":
          description: failure<br>Error codes and Error Description
            <br>100001- Error in fetching user details
            <br>103014- Error in checking if node belongs to user
            <br>103053- Error, failed to forward request to processing queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponseWithCode"
      security:
        - AccessToken: []

externalDocs:
  description: Find out more about ESP RainMaker
  url: https://rainmaker.espressif.com/
servers:
  - url: https://api.rainmaker.espressif.com
    description: RainMaker API Url
  - url: https://api2.rainmaker.espressif.com.cn
    description: RainMaker China API Url
  - url: https://{API Url}
    variables:
      API Url:
        default: api.rainmaker.espressif.com
        description: API Url to your RainMaker backend
components:
  securitySchemes:

  /{version}/user/node_group/sharing:
    put:
      tags:
        - Device grouping
      summary: This API creates the sharing of Groups or matter fabrics between users.
      description:
        'This API allows Primary users to share the groups/matter fabrics with other users either with primary or secondary user role.
        <ol>
        <li>Groups is a mandatory parameter. It is an array of group IDs.</li>
        <li>User Name is an optional parameter.</li>
        <li>Primary flag to make the users as primary is an optional parameter.</li>
        <li>Metadata is an optional parameter, used to store additional info about node sharing request.</li>
        <li>Transfer can be used to transfer their own role to a new user for a node. As a result, the older user access role will be removed. Optionally, the older user can also assign themselves a new role.</li>
        <li>If the requested user already has access to the group(s) (same or different role), approval is skipped and the sharing or role update is applied immediately.<br>The response always includes <code>request_id</code> for backward compatibility; in this path the value is randomly generated and does not correspond to a pending sharing request.<br>The success description is typically "Group sharing added for the user successfully".<br>If the user does not yet have access, a sharing request is created: <code>request_id</code> identifies that request, the description is typically "Group sharing request added for the user successfully", and the requested user must accept or decline.</li>
        </ol>'
      operationId: addUserGroupSharing
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddUserGroupSharingRequest"
            examples:
              Add User Group Sharing:
                value:
                  groups: ["group_id1"]
                  user_name: "username@domain.com"
                  primary: true
                  sub_role: 2
                  metadata:
                    {
                      "devices":
                        [{"name": "AC Switch", "type": "esp.device.switch"}],
                    }
              Add User Group Sharing without user_name:
                value:
                  groups: ["group_id1"]
                  primary: true
                  metadata:
                    {
                      "devices":
                        [{"name": "AC Switch", "type": "esp.device.switch"}],
                    }
              Transfer Group:
                value:
                  groups: ["group_id1"]
                  user_name: "username@domain.com"
                  transfer: true
                  metadata:
                    {
                      "devices":
                        [{"name": "AC Switch", "type": "esp.device.switch"}],
                    }
              Transfer Group and Assign new role to self:
                value:
                  groups: ["group_id1"]
                  user_name: "username@domain.com"
                  transfer: true
                  new_role: secondary
                  metadata:
                    {
                      "devices":
                        [{"name": "AC Switch", "type": "esp.device.switch"}],
                    }
        description: Add User Group Sharing
        required: true
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/APISuccessResponseWithRequestId"
              examples:
                First-time share (request created):
                  value:
                    status: "success"
                    description: "Group sharing request added for the user successfully"
                    request_id: "request_id"
                Auto-accept or idempotent (user already has access; random request_id returned for backward compatibility):
                  value:
                    status: "success"
                    description: "Group sharing added for the user successfully"
                    request_id: "random_request_id"

        "400":
          description: failure<br>Error Codes and Error Description
            <br>101001- Error in fetching user details
            <br>100006- Invalid request body
            <br>100007- Either User Id or User Email needs to be provided
            <br>108013- Some of the nodes are not mapped by user
            <br>108036- Group list too long. It can have maximum of 10 groups.
            <br>108038- Error some groupIds are missing.
            <br>108041- Error, User should be primary owner of the groups in the request
            <br>108044- Please specify at least one group in the request
            <br>108046- Adding self group sharing is not allowed
            <br>108048- Error, Some of the groups in the group sharing request does not belong to the user
            <br>108050- User name does not exist
            <br>108052- Error, User should be primary owner for all nodes in the groups that are in the request
            <br>107029- Error, the node is already shared via group sharing with a different role
            <br>108112- Duplicate group id in request
            <br>108129- One of the groups in the request is matter subgroup for which sharing is not allowed
            <br>108138- Invalid new role specified, [Valid Value is secondary]
            <br>108139- Please specify transfer:true when new_role is specified
            <br>108140- Invalid sub_role; must be between 1 and 4
            <br>108141- Error, cannot transfer groups that were shared via parent groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserGroupSharingAPIFailureResponse"
        "500":
          description: "failure<br>Error Codes and Error Description
            <br>108010- Error occurred while fetching node group mapping details
            <br>108034- Error getting Request
            <br>108047- Error occurred while checking if group belongs to requesting user
            <br>108049- Error occurred while checking if the sharing user exists
            <br>108053- Error occurred while checking if node belongs to requesting user
            <br>108068- Error occurred while fetching existing secondary users mapped to a group
            <br>108069- Error occurred while fetching existing primary users mapped to a group"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserGroupSharingAPIFailureResponse"
      security:

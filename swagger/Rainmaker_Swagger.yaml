            type: boolean
            default: false
        - name: reset_on_negative
          in: query
          description: "Only applicable when `differential` is true, else ignored. If `reset_on_negative` is true, then the value will be reset to present value if the difference is negative."
          required: false
          schema:
            type: boolean
            default: false
        - name: desc_order
          in: query
          description: "This is set to true if the timeseries data to retrieve should be in descending order"
          required: false
          schema:
            type: boolean
            default: false
        - name: type
          in: query
          description:
            "This parameter is used to specify the data type of the param.
            They can be -
            <li>float</li>
            <li>int</li>
            <li>bool</li>
            <li>string</li>"
          example: "float"
          required: false
          schema:
            type: string
            default: float
        - name: week_start
          in: query
          description: "This parameter is used to specify the start day of the week. This field is case insensitive. Only applicable in cases were the time_interval value is <b>week</b>."
          example: ""
          required: false
          schema:
            type: string
            default: Monday
        - name: start_time
          in: query
          description: "This parameter is used to set the start time. The expected Format for start time is epoch time in seconds. Ex: 1628557200"
          required: false
          schema:
            type: number
        - name: end_time
          in: query
          description: "This parameter is used to set the end time. The expected Format for end_date is epoch time in seconds. Ex: 1628557200"
          required: false
          schema:
            type: number
        - name: num_intervals
          in: query
          description:
            "The user can specify either the start_time and end_time or num_intervals parameter.
            If the num_intervals is specified, then the API will fetch the data from the current time for the previous 'n' intervals.
            <p>i.e
            <br> If <i>time_interval=day, aggregate=avg, parameter_name=temperature , device_id=1234</i>
            <br> <i>num_intervals=5</i>
            <br> The output would have data for previous 5 days starting from today. Not Applicable for Aggregate=Raw.</p>"
          required: false
          schema:
            type: number
        - name: start_id
          in: query
          description: "This parameter is used for pagination.
            <br><b>The pagination token can be used for up to 5 Query Invocations, OR for a duration of up to 1 hour whichever comes first.</b>"
          required: false
          schema:
            type: string
        - name: num_records
          in: query
          description: "This parameter is used for pagination. Max Value = 200"
          example: ""
          required: false
          schema:
            type: number
            default: 200
            maximum: 200
        - name: timezone
          in: query
          description: "This parameter is used to set the timezone(location) from where the query is made, based on <a href='https://en.wikipedia.org/wiki/List_of_tz_database_time_zones'>IANA Tz Database name</a>. TimeZone can also be provided like EST but location name is preferred. This field is case-insensitive."
          required: false
          example: Asia/Shanghai
          schema:
            type: string
            default: UTC
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TSAPISuccessResponse"
              examples:
                Raw Data:
                  $ref: "#/components/examples/TSDataRawdata"
                Hourly Data:
                  $ref: "#/components/examples/TSDataHourlyData"
                Daily Data:
                  $ref: "#/components/examples/TSDataDailyData"
                Weekly Data:
                  $ref: "#/components/examples/TSDataWeeklyData"
                Monthly Data:
                  $ref: "#/components/examples/TSDataMonthlyData"
                Yearly Data:
                  $ref: "#/components/examples/TSDataYearlyData"
        "400":
          description: failures
            <br>Error Codes And Error Description
            <br>100002- API Version is not supported
            <br>100021- Invalid query param
            <br>126001- Fetching node to User mapping failed
            <br>126002- User to node mapping does not exist
            <br>126003- Please Provide a valid Node ID
            <br>126004- Please Provide a valid parameter name
            <br>126005- Please Provide a valid aggregate
            <br>126006- Please Provide a valid aggregation interval
            <br>126007- Please Provide a valid week start
            <br>126008- Error, Input query params StartTime and EndTime are missing
            <br>126009- Please Provide a valid Interval count
            <br>126010- Please Provide a valid start time
            <br>126011- Please Provide a valid end time
            <br>126012- Please Provide a valid time duration
            <br>126013- Start time must be less than end time
            <br>126015- If aggregate is provided then either start_time and end_time or num_interval needs to be provided for each query
            <br>126016- AggregationInterval 'Month' and 'Year' are not supported for 'latest' aggregate
            <br>126017- Please provide a valid data type for the measure. Valid types are float,int,bool,string
            <br>126018- Looks like there is a type mismatch. Please provide a valid data type for the measure
            <br>126019- The given aggregate is not supported for this data type. Please refer documentation for supported aggregates
            <br>126020- Error, Please specify the timezone parameter correctly
            <br>126021- Differential is not supported for types bool and string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TSAPIFailureResponse"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
          description: failure <br>Error Codes and Error Description
            <br>100070- Too many requests, try again later
        "500":
          description: Server failures
            <br>Error Codes And Error Description
            <br>100001- Error in fetching user details
            <br>126014- Error getting data from DB. Please try after some time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TSAPIFailureResponse"
      security:
        - AccessToken: []

  /{version}/user/nodes/simple_tsdata:
    get:
      tags:
        - Simple Time Series Data
      summary: This API is used to get the Simple Time Series Data
      description: |
        This API retrieves raw simple time series data and aggregates for various measures such as temperature, humidity, electric current, etc. reported by nodes.

        ## Query Types

        The `query_type` parameter determines what type of data is returned:

        ### Raw Data (Default)
        - Query raw time series data using `param_name`, `type`, and optional time interval (`start_time` and `end_time`)
        - If no time interval is specified, returns data from timestamp 0 to current UTC timestamp
        - Results are returned in **descending order** (latest records first)
        - Use `num_records` to limit results (max 200)
        - Use `start_id` for pagination

        ### Aggregates Data
        Set `query_type=aggregates` to retrieve aggregated/processed data:

        | Use Case | Parameters | Description |
        |----------|------------|-------------|
        | **Current Aggregates** | `query_type=aggregates` | Returns current aggregated data for all windows |
        | **Current Window** | `query_type=aggregates` + `window` | Returns current aggregated data for a specific window |
        | **Historical (Single Date)** | `query_type=aggregates` + `window` + `date` | Returns aggregated data for a specific date |
        | **Historical (Date Range)** | `query_type=aggregates` + `window` + `start_date` + `end_date` | Returns aggregated data for a date range |

        ## Aggregation Windows

        Available windows: `hourly`, `daily`, `weekly`, `monthly`

        ## Date Formats

        - **Daily/Weekly/Monthly**: `YYYY-MM-DD` (e.g., `2024-01-15`)
        - **Hourly**: `YYYY-MM-DD` or `YYYY-MM-DDTHH` (e.g., `2024-01-15T14` for 2PM hour)

        ## Aggregate Response Fields

        For numeric types (`int`, `float`), aggregates include:
        - `count`: Number of data points
        - `sum`: Sum of all values
        - `min`: Minimum value
        - `max`: Maximum value
        - `average`: Average value
        - `first_value`: First recorded value in the window
        - `last_value`: Last recorded value in the window
        - `cumulative_value`: For cumulative measures, the net change in the window

        ## Notes

        - The `status` field indicates whether an aggregate is `current` (in-progress) or `completed` (finalized)
        - Current aggregates may change as new data arrives
        - For cumulative parameters (e.g., energy consumption), `cumulative_value` shows the net change
      operationId: GetSimpleTSData
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
        - name: node_id
          in: query
          description: "This parameter is used to specify the node ID for which measures needs to be fetched."
          required: true
          example: node_id1
          schema:
            type: string
        - name: param_name
          in: query
          description: "Some examples of the parameter names are -
            <li>temperature</li>
            <li>humidity</li>
            <li>electric_current</li>
            A single valid measure need to be passed."
          example: "temperature"
          required: true
          schema:
            type: string
        - name: type
          in: query
          description:
            "This parameter is used to specify the data type of the param.
            They can be -
            <li>float</li>
            <li>int</li>
            <li>bool</li>
            <li>string</li>
            <li>array</li>
            <li>object</li>"
          example: "int"
          required: true
          schema:
            type: string
        - name: start_time
          in: query
          description: "This parameter is used to set the start time. The expected Format for start time is epoch time in seconds. Ex: 1628557200"
          example: 1628557200
          schema:
            type: number
        - name: end_time
          in: query
          description: "This parameter is used to set the end time. The expected Format for end_date is epoch time in seconds. Ex: 1628557200"
          example: 1628557200
          schema:
            type: number
        - name: start_id
          in: query
          description: "This parameter is used for pagination."
          required: false
          schema:
            type: string
        - name: num_records
          in: query
          description: "This parameter is used to specify number of records. Max Value = 200"
          required: false
          schema:
            type: number
            default: 200
            maximum: 200
        - name: query_type
          in: query
          description: "Query type to fetch data. Can be raw or aggregates"
          required: false
          schema:
            type: string
            default: "raw"
            enum: [raw, aggregates]
        - name: window
          in: query
          description: "Time window for aggregates (for aggregates queries)"
          required: false
          example: "daily"
          schema:
            type: string
            enum: [hourly, daily, weekly, monthly]
        - name: date
          in: query
          description: "Specific date for historical aggregates (YYYY-MM-DD or YYYY-MM-DDTHH for hourly)"
          required: false
          example: "2024-01-15"
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}(T\d{2})?$'
        - name: start_date
          in: query
          description: "Start date for historical aggregates range (YYYY-MM-DD or YYYY-MM-DDTHH for hourly)"
          required: false
          example: "2024-01-01"
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}(T\d{2})?$'
        - name: end_date
          in: query
          description: "End date for historical aggregates range (YYYY-MM-DD or YYYY-MM-DDTHH for hourly)"
          required: false
          example: "2024-01-31"
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}(T\d{2})?$'
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleTSDataAPISuccessResponse"
              examples:
                Raw Data Response:
                  $ref: "#/components/examples/SimpleTSDataResponse"
                Current Aggregates Response:
                  $ref: "#/components/examples/SimpleTSDataCurrentAggregatesResponse"
                Historical Aggregate Response:
                  $ref: "#/components/examples/SimpleTSDataHistoricalAggregateResponse"
                Aggregates Range Response:
                  $ref: "#/components/examples/SimpleTSDataAggregatesRangeResponse"
                Cumulative Aggregates Response:
                  $ref: "#/components/examples/SimpleTSDataCumulativeAggregatesResponse"
                No Data Response:
                  $ref: "#/components/examples/SimpleTSDataNoDataResponse"
                Aggregates Response:
                  $ref: "#/components/examples/SimpleTSDataAggregatesResponse"
        "400":
          description: failures
            <br>Error Codes And Error Description
            <br>100002- API Version is not supported
            <br>100021- Invalid query param
            <br>136001- Please Provide a valid Node ID
            <br>136002- Please Provide a valid parameter name
            <br>136005- Please provide a valid data type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleTSDataAPIFailureResponse"
        "500":
          description: Server failures
            <br>Error Codes And Error Description
            <br>100001- Error in fetching user details
            <br>136003- Error getting data from DB. Please try after some time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleTSDataAPIFailureResponse"
      security:
        - AccessToken: []

  /{version}/user/nodes/{node_id}/groups/{group_id}/controller:
    put:
      tags:
        - Rainmaker Controller
      summary: Using this API, a node can subscribe to a group in the role of a Rainmaker controller.
      description: |
        The user must have primary access to both the node and the group, and the node must already be a member of the group.
        <br>Once the node becomes a controller, it can subscribe to specific topics within the context of the group.
        <br>
        The controller node can subscribe to the following topics:
        <ul>
        <li>node/*/params/local/{group_id}</li>
        <li>node/*/params/local/{group_id}</li>
        <li>node/*/params/remote/{group_id}</li></ul>
      operationId: SubscribeToGroupAsRainmakerController
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
        - name: node_id
          in: path
          description: Node ID
          required: true
          schema:
            type: string
        - name: group_id
          in: path
          description: Group ID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APISuccessResponse"
        "400":
          description: failure
            <br>Error Codes And Error Description
            <br>100002- API Version is not supported
            <br>108152- Node does not belong to the specified group
            <br>103055- Node id and Group id are required for controller subscribe/unsubscribe operation
            <br>103058- Invalid value for operation, valid values are 'subscribe' or 'unsubscribe'
            <br>103059- Invalid request, operation is missing from the request
            <br>103061- Invalid request, user is not primary for the node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
        "500":
          description: Server failures
            <br>Error Codes And Error Description
            <br>103056- Error occurred while subscribing to group as controller
            <br>103057- Error occurred while unsubscribing from group as controller
            <br>103060- Controller subscription or unsubscription failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
      security:
        - AccessToken: []


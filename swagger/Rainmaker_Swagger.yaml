  /authorize:
    get:
      operationId: authorize
      security: []
      tags:
        - OAuth in RainMaker (For OAuth only deployments)
      summary: Initiate the OAuth2 flow. (Beta)
      description: |
        The user logs in by choosing the provider on the page. Returns authorization code on the redirect URI.
      parameters:
        - name: response_type
          in: query
          description: The response type. Should be "code".
          required: true
          schema:
            type: string
            enum: ["code"]
        - name: client_id
          in: query
          description: The app client ID.
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          description: The redirect URI which was previously registered for the app client whose ID is provided in the client_id query parameter.
          required: true
          example: https://redirect_uri
          schema:
            type: string
        - name: scope
          in: query
          description: The requested scope. Currently, ignored.
          required: false
          schema:
            type: string
        - name: identity_provider
          in: query
          description: The identity provider to be used. It is either GOOGLE, SIGNINWITHAPPLE or the provider name in uppercase. #In case of normal RainMaker, if this parameter is empty, it redirects to GITHUB.
          required: true #As we don't have custom login UI yet
          schema:
            type: string
      responses:
        "302":
          description: Redirect to provider auth URL
        "301":
          description: "
            <br>- server_error
            <br>- invalid_request
            <br>- unsupported_response_type"
          headers:
            Location:
              description: Redirect to redirect URL with error
              schema:
                type: string
                example: "https://redirect_uri?error=<>"
        "500":
          description: "
            <br>- Bad Request (Either redirect URI is missing, identity provider is not registered)
            <br>- server_error (Unexpected error from the server)
            <br>- unauthorized_client (The client Id is not registered)
            <br>- redirect_uri_mismatch (The redirect URI is not registered)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: failure
                  description:
                    type: string
                    description: error string

  /cognitocallback:
    get:
      operationId: cognitoCallbackGet

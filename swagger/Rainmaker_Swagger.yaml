  /{version}/admin/user/nodes:
    get:
      tags:
        - User Node Association
      summary: Get the user node association
      description: "This API is accessible to superadmins.
        When a user_id is provided, it fetches the nodes associated with the user, and when a node_id is provided, it fetches the user associated with the node.<br>
        If the role is specified as a query parameter (primary or secondary), it returns the users or nodes with that role.<br>
        To get node details, set the node_details flag to true.
        <br><br><b>Note:</b><ul>
        <li>If both user ID and user name are provided simultaneously, the user ID will take priority, and nodes will be fetched according to the user ID. </li>
        <li>If user ID and node ID, or user name and node ID, are specified at the same time, the API will return an error. </li>"
      operationId: getUserNodesForAdmins
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
        - name: user_id
          in: query
          description: user_id of the user whose nodes are to be fetched.
          required: false
          schema:
            type: string
        - name: user_name
          in: query
          description: email or phone number of the user whose nodes are to be fetched, whatever user has used to sign up. Example - username@domain.com or +<phone number with country code>
          required: false
          schema:
            type: string
        - name: node_id
          in: query
          description: node_id of the node whose associated users are to be fetched.
          required: false
          schema:
            type: string
        - name: role
          in: query
          description: the nodes associated with the user returned will have this specified role. Default - both primary and secondary
          required: false
          schema:
            type: string
        - name: node_details
          in: query
          description: optional flag **(true/false)**, to indicate if the node details are required in the response
          required: false
          schema:
            type: boolean
            default: false
        - name: start_id
          in: query
          description: use next_id from the response as start_id to fetch the next set of records
          required: false
          schema:
            type: string
        - name: num_records
          in: query
          description: number of nodes to fetch
          required: false
          schema:
            type: string

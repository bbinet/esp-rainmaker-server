openapi: 3.0.0
info:
  description: |
    The API Defintions for the Rainmaker APIs.

    It supports two types of APIs:
    - **Unauthenticated**
    - **Authenticated** (APIs having a lock symbol at the end)<br>
      To use Authenticated APIs, an accesstoken must be passed manually in the Authorization header. This can be done by clicking on the  <font color='#4ccc94'>Authorize</font> button shown below and adding the accesstoken in the Value field. This accesstoken can be obtained by logging in using the [/login2 API](https://swaggerapis.rainmaker.espressif.com/#/User%20Management/login2). (Not supported for social users for now)

    **Note:**
    - No double slashes allowed in the URL.
    - Headers such as `data`, `verify`, and `cookies` are not supported.
  version: 3.8.0-9c8896d72_2026-04-08T07:07
  title: ESP RainMaker API Definitions for the Backend Service
  termsOfService: https://rainmaker.espressif.com/docs/terms-of-use
  contact:
    email: esp-rainmaker-admin@espressif.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
tags:
  - name: API Versions
    description: API to get information about supported API versions
  - name: User Management
    description: User Creation, Login, Authentication  and Password management
  - name: RainMaker Data Access
    description: APIs to request and download RainMaker data of users
  - name: Admin User Management
    description: Admin User Management
  - name: User Node Association
    description: Associating a node with the user
  - name: Node Parameter Operations
    description: Update the state of the node or get the state of the node
  - name: OTA Service
    description: APIs to upload Firmware images and manage OTA jobs
  - name: File upload
    description: |
      APIs to upload QA report Files associated to OTA image.
      (<b>Beta</b>- These APIs are in development stage and may have breaking changes)
  - name: IOT Endpoint
    description: API to fetch IOT Endpoint
  - name: Device grouping
    description: APIs for operations on device groups
  - name: Rainmaker Controller
    description: APIs for operations on Rainmaker Controllers
  - name: Time Series Data
    description: APIs to fetch the Time Series data for the nodes.
  - name: Simple Time Series Data
    description: APIs to fetch the Simple Time Series data for the nodes.
  - name: Custom User Data
    description: User specific data management
  - name: Event Filter
    description: API to manage event filtering information events related to Integrations, by Admins.
  - name: Event Filter for Users
    description: API to manage event filtering information events related to Integrations, by Users.
  - name: Mobile Platform Endpoint
    description: Manage platform endpoint
  - name: Automation Trigger and Actions
    description: APIs for operations on automation trigger and actions
  - name: Roles and Policy Manager
    description: APIs to manage user roles and policies.
  - name: User Role Mapping
    description: APIs to assign or remove roles to or from user.
  - name: Command Response Communication
  - name: API Info
  - name: Tags Service
    description: Admin tag management
  - name: Secure Sign
    description: APIs used to securely sign the OTA image with signing key and get logs of signing requests.
  - name: Key Management
    description: APIs used to manage keys that are used to securely sign the OTA image.
  - name: OAuth in RainMaker (For OAuth only deployments)
    description: APIs for OAuth 2.0 Authentication in RainMaker (Beta)
  - name: Custom User Data for Admins
    description: User specific data management for Admin users (**Customer Deployments only**)
  - name: External API Pass Through Service
    description: This API is used to fetch configurations of external API. To retrieve a specific service, provide a service ID or to obtain a list, provide the starting characters of the service name.
  - name: User Public Profile
    description: APIs to manage user public profile
  - name: Assume Role
    description: This API allows a user to assume a role and get temporary security credentials for MQTT and other AWS services.
  - name: Deployment Settings
    description: APIs to manage deployment settings
  - name: User Node Matter Data
    description: APIs to get required data for matter devices
  - name: Node Proxy
    description: APIs for proxying node MQTT actions via users

  # Add new APIs above this
  - name: User [Deprecated]
    description: These APIs are <font color='red'>Deprecated</font>. Check the APIs in the 'User Management' group above.
  - name: Node sharing [Deprecated]
    description: These APIs are <font color='red'>Deprecated</font>. Use /user/nodes/sharing/requests instead.

paths:
  /{version}/user:
    post:
      tags:
        - User [Deprecated]
      summary: "[Deprecated] Creates the new user or confirms the user"
      deprecated: true
      description: "This API creates a new user or confirms the user. If the password is specified in the request body, a new user is created and a verification code is sent to user's mail address. If the verification code is sent in the request body, the user is confirmed."
      operationId: usercreation
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/CreateUserRequest"
                - $ref: "#/components/schemas/ConfirmUserRequest"
            examples:
              Create User:
                value:
                  user_name: "username@domain.com"
                  password: "password"
              Confirm User with User Attribute Tags (only on Private Deployments):
                value:
                  user_name: "username@domain.com"
                  verification_code: "verification_code"
                  tags: ["role:abc", "beta:true", "tag:value"]
              Confirm User:
                value:
                  user_name: "username@domain.com"
                  verification_code: "verification_code"
        description: Request body for creating new user or confirming the user
        required: true
      responses:
        "201":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APISuccessResponse"
        "400":
          description: failure <br>Error Codes and Error Description
            <br>100006- Invalid request body
            <br>101001- User name is missing
            <br>101002- Email-id is not in correct format
            <br>101003- Password or verification code is missing
            <br>101004- Password length must be between 8 to 256 characters. It should be alpha-numeric without any whitespace. It should contain atleast one uppercase, one lowercase character and a number
            <br>101006- User account already exist
            <br>101011- User name already verified
            <br>101012- Verification code is incorrect
            <br>101057- Max limit exceeded, please try after some time
            <br>100052- Error, this operation is not supported for oauth-only deployments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAPIFailureResponse"
        "500":
          description: failure <br>Error Codes and Error Description
            <br>100008- Error in fetching tenant context details
            <br>101005- Sending verification code failed
            <br>101008- Creating user failed
            <br>101013- User confirmation failed
            <br>101019- Attempt limit exceeded, please try after some time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAPIFailureResponse"
      security: []

    put:
      tags:
        - User [Deprecated]
      summary: "[Deprecated] Updates Name of the user"
      deprecated: true
      description: "This API Sets or updates the name of the user."
      operationId: usernameupdate
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNameRequest"
            examples:
              Update User Name:
                value:
                  name: "new name"
        description: Request body for updating name of the user
        required: true
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APISuccessResponse"
        "400":
          description: failure
            <br>Error Codes and Error Description
            <br>100006- Invalid request body
            <br>101001- User name is missing
            <br>101053- Error, name should have minimum 1 character and can have maximum 256 characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAPIFailureResponse"
        "404":
          description: failure<br>Error Codes and Error Description
            <br>101025- User does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAPIFailureResponse"
        "500":
          description: failure
            <br>Error Codes and Error Description
            <br>100001- Error in fetching user details
            <br>101028- Error occurred while updating user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAPIFailureResponse"
      security:
        - AccessToken: []

    get:
      tags:
        - User [Deprecated]
      summary: "[Deprecated] Fetches the details of current user"
      deprecated: true
      description:
        "This API fetches user_id, user_name, super_admin flag, URL of profile picture and name of current user.
        <br><br>The <b>super_admin</b> flag is returned only when the user is a super admin, in other cases, it will not be returned in the output.
        <br>Also the <b>picture_url</b> and <b>name</b> are not returned in the output, if it is not set by the user."
      operationId: getUser
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
        - name: custom_data
          in: query
          description: When true, will fetch the custom data of the logged in user
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUserResponse"
              examples:
                Super Admin User with MFA enabled:
                  value:
                    user_id: string
                    user_name: string
                    super_admin: true
                    picture_url: string
                    name: string
                    mfa: true
                    phone_number: <+Mobile Number with country code>
                Super Admin User with MFA disabled:
                  value:
                    user_id: string
                    user_name: string
                    super_admin: true
                    picture_url: string
                    name: string
                    mfa: false
                    phone_number: <+Mobile Number with country code>
                Other Users:
                  value:
                    user_id: string
                    user_name: string
                    picture_url: string
                    name: string
                    mfa: false
                    phone_number: <+Mobile Number with country code>
                User with custom_data=true:
                  value:
                    user_id: string
                    user_name: string
                    picture_url: string
                    name: string
                    custom_data:
                      membership_info:
                        value:
                          premium: true
                      esp.location:
                        value:
                          esp.city: "Pune"
                          esp.longitude: xx.xxxx
                          esp.latitude: xx.xxxx
                          esp.state: "Maharashtra"
                      profile:
                        value:
                          name: FirstName Lastname
                          age: 60
                Users with Attribute Tags (only on Private Deployments):
                  value:
                    user_id: string
                    user_name: string
                    picture_url: string
                    name: string
                    mfa: false
                    tags: ["role:abc", "beta:true", "tag:value"]
                Guest User:
                  value:
                    user_id: "2e31002c-0756-4e2e-b2b4-9857e7754646"
                    user_name: "guest@yRi5eHP8gHRPm2EsLvpT8Z.temp.user"
                    mfa: false
                    admin_tags:
                      - "guest_user:true"
                    expires_on: 1787657445
                    is_guest_user: true
        "500":
          description: failure<br>Error Codes and Error Description
            <br>100001- Error in fetching user details
            <br>101026- Getting user-id from user name failed
            <br>101027- Error occurred while fetching user profile picture and name
            <br>100008- Error in fetching tenant context details
            <br>100035- Failed to convert string to JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAPIFailureResponse"
      security:
        - AccessToken: []
    delete:
      tags:
        - User [Deprecated]
      summary: "[Deprecated] Deletes user account"
      deprecated: true
      description:
        "This API can be used by end-users to delete his/her account. Here are the details-
        <ul>
        <li> If the 'request' query param is true, user delete request is initiated and verification code is sent to user using email or phone number.
        <li>If 'verification_code' query param is specified, user account is deleted.</ul>"
      operationId: userdeletion
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
        - name: request
          in: query
          description: if delete user request is to be initiated, value of request param should be true.
          schema:
            type: boolean
            default: false
        - name: verification_code
          in: query
          description: if delete user request is to be verified and user account is to be deleted, the verification code received by user should be entered as value of verification_code query param.
          schema:
            type: number
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APISuccessResponse"
        "400":
          description: failure <br>Error Codes and Error Description
            <br>101001- User name is missing
            <br>119005- Verification code is incorrect
            <br>119006- User does not exist
            <br>119007- Verification code is missing
            <br>119015- No delete request exists for the user
            <br>119016- Attempt limit exceeded, please request for delete user again
            <br>119017- Super-admin user deletion is restricted!
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserNodeSharingAPIFailureResponse"
        "500":
          description: failure <br>Error Codes and Error Description
            <br>100001- Error in fetching user details
            <br>119001- Error occurred while storing user delete request
            <br>119003- Error occurred while getting user delete request
            <br>119004- Failed to delete user
            <br>119008- Sending verification code failed
            <br>119009- Failed to initiate user delete request
            <br>119014- An error occurred while removing existing user delete request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserNodeSharingAPIFailureResponse"
      security:
        - AccessToken: []

  /{version}/user2:
    post:
      operationId: userCreation2
      security: []
      tags:
        - User Management
      summary: Create or confirm a user account. The user can provide an email address or a mobile number with a country code to create an account.
      description: |
        <p>This API allows creating a new user or confirming an existing user.</p>
        <ul>
          <li><b>Creating a new user:</b> If a password is included in the request body, a new user account is created, and a verification code is sent to the provided email address or mobile number.</li>
          <li><b>Confirming a user:</b> If a verification code is included in the request body, the user is confirmed.</li>
        </ul>
        <h4>Locale:</h4>
        <p>You can configure the user's language preference by including the query param: <code>locale</code> in the request. <h5>Note: Emails and SMS will be sent based on the specified locale only for their respective message template types that support custom configuration.</h5> For example:</p>
        <pre> locale: "user_locale_value" </pre>
        <p>This query param allows the user to specify their preferred language locale for receiving emails and SMS.</p>
        <ul>
          <li><b>Reserved value:</b> <code>"rm_non_branded"</code> — This value is designated for internal use and is utilized for sending emails in a specific locale when no default email is configured for the given template type. If this value is provided, it will result in an "Invalid locale" error.</li>
          <li>If the query param: <code>locale</code> is omitted or left empty, the default locale configured by the admin will be used for emails and SMS.</li> <li> It is case-insensitive and all input locales will be considered in lowercase. </li>
        </ul>
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
        - name: locale
          in: query
          description: It allows the user to specify their preferred language locale for receiving emails and SMS. It is case-insensitive and all input locales will be considered in lowercase.
          required: false
          schema:
            type: string
            default: no_locale
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/CreateUserRequest"
                - $ref: "#/components/schemas/ConfirmUserRequest"
            examples:
              Create User:
                value:
                  user_name: "username@domain.com or <+Mobile Number with country code>"
                  password: "password"
              Confirm User with User Attribute Tags (only on Private Deployments):
                value:
                  user_name: "username@domain.com"
                  verification_code: "verification_code"
                  tags: ["role:abc", "beta:true", "tag:value"]
              Confirm User:
                value:
                  user_name: "username@domain.com or <+Mobile Number with country code>"
                  verification_code: "verification_code"
        description: Request body for creating new user or confirming the user
        required: true
      responses:
        "201":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APISuccessResponse"
        "400":
          description: failure <br>Error Codes and Error Description
            <br>100006- Invalid request body
            <br>101001- User name is missing
            <br>101002- Email-id is not in correct format
            <br>101003- Password or verification code is missing
            <br>101004- Password length must be between 8 to 256 characters. It should be alpha-numeric without any whitespace. It should contain atleast one uppercase, one lowercase character and a number
            <br>101006- User account already exist
            <br>101009- Incorrect user name or password
            <br>101011- User name already verified
            <br>101012- Verification code is incorrect
            <br>101037- Please provide valid phone number
            <br>101056- User already exists with this phone number
            <br>101057- Max limit exceeded, please try after some time
            <br>101067- Some tags are invalid. Valid tag should be of type key:value
            <br>100052- Error, this operation is not supported for oauth-only deployments
            <br>112048- Invalid locale. Please enter a valid locale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAPIFailureResponse"
        "500":
          description: failure <br>Error Codes and Error Description
            <br>100008- Error in fetching tenant context details
            <br>101005- Sending verification code failed
            <br>101008- Creating user failed
            <br>101013- User confirmation failed
            <br>101019- Attempt limit exceeded, please try after some time
            <br>101055- Error verifying phone number. Please try after some time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAPIFailureResponse"

    put:
      tags:
        - User Management
      summary: Updates Name and Phone number of the user
      description: |
        This API allows users to set or update their **name**, **phone number**, and other fields.

        Additionally, **Multi-Factor Authentication (MFA)** can be **enabled or disabled** for superadmins.

        - If **MFA is enabled**, an SMS with a verification code is sent to the **superadmin's phone number** after initial authentication to ensure a successful login.

        **Important Notes:**
        - **Phone Number Updates:**
          - The `verification_code` confirms the current `phone_number`.
          - At any point, only **one** phone number can be associated with a user.
          - Adding a **new phone number** will replace the existing one and require re-verification.
        - **MFA Settings:**
          - The MFA settings will take effect from the **next login** onwards.
        - **User Attribute Tags:**
          - Users can update **User Attribute Tags** on themselves.
          - **Users cannot remove Attribute Tags** that were added by Admins.
        - **Locale Preferences:**
          - Users can update their **configured locale language preference** for emails and SMS that support custom configuration using message templates. It is case-insensitive and all input locales will be considered in lowercase.
      operationId: userattributeupdate
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/UpdateNameRequest"
                - $ref: "#/components/schemas/UpdatePhoneNumberRequest"
                - $ref: "#/components/schemas/ConfirmPhoneNumberRequest"
                - $ref: "#/components/schemas/EnableOrDisableMFA"
                - $ref: "#/components/schemas/ConfirmTagAssignmentRequest"
                - $ref: "#/components/schemas/UpdateUserAttributeTagsRequest"
            examples:
              Update User Name:
                value:
                  name: new name
              Add or update phone number:
                value:
                  phone_number: + Mobile Number with country code
              Confirm phone number:
                value:
                  verification_code: "verification_code"
              Enable MFA:
                value:
                  mfa: true
              Disable MFA:
                value:
                  mfa: false
              Confirm Tag assignment request:
                value:
                  tags_verification_code: "verification_code"
              Add user attribute tags:
                value:
                  operation: "add"
                  tags:
                    - "installer:true"
                    - "beta:true"
              Remove user attribute tags:
                value:
                  operation: "remove"
                  tags:
                    - "installer:true"
                    - "beta:true"
              Update User Locale:
                value:
                  locale: new locale
        description: Request body for updating name / phone number of the user
        required: true
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APISuccessResponse"
        "400":
          description: failure
            <br>Error Codes and Error Description
            <br>100002- API Version is not supported
            <br>100004- You are not authorized to perform this operation, Please contact administrator
            <br>100006- Invalid request body
            <br>101001- User name is missing
            <br>101012- Verification code is incorrect
            <br>101045- Error, name, phone number or MFA is missing
            <br>101046- This API is not supported for old user pool
            <br>101047- Error, phone number not added for the user
            <br>101048- Error, phone number is not verified
            <br>101051- Error phone number update and MFA are not supported for users with phone number as the user name
            <br>101052- Error, the phone number is already verified for the user
            <br>101053- Error, name should have minimum 1 character and can have maximum 256 characters
            <br>101056- User already exists with this phone number
            <br>101066- Invalid update operation. Please provide tags with valid operations [add, remove]
            <br>101067- Some tags are invalid. Valid tag should be of type key:value
            <br>112048- Invalid locale. Please enter a valid locale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAPIFailureResponse"
        "404":
          description: failure<br>Error Codes and Error Description
            <br>101025- User does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAPIFailureResponse"
        "500":
          description: failure
            <br>Error Codes and Error Description
            <br>100001- Error in fetching user details
            <br>101028- Error occurred while updating user
            <br>101049- Error occurred while verifying phone number
            <br>101050- Error occurred while enabling or disabling MFA
            <br>101019- Attempt limit exceeded, please try after some time
            <br>101055- Error verifying phone number. Please try after some time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAPIFailureResponse"
      security:
        - AccessToken: []
    get:
      tags:
        - User Management
      summary: Fetches the details of current user
      description:
        "This API fetches user_id, user_name, super_admin flag, locale, URL of profile picture and name of current user.
        <br><br>The <b>super_admin</b> flag is returned only when the user is a super admin, in other cases, it will not be returned in the output.
        <br>If locale returned is <b>no_locale</b>, it means user has not configured any locale and it shall receive messages that are set default by admin for all template types
        <br><br>The <b>admin</b> flag is returned only when the user is a admin, in other cases, it will not be returned in the output.
        <br>Also the <b>picture_url</b> and <b>name</b> are not returned in the output, if it is not set by the user."
      operationId: getUsermobile
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
        - name: custom_data
          in: query
          description: When true, will fetch the custom data of the logged in user containing</b>.
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUserResponse"
              examples:
                Super Admin User with MFA enabled:
                  value:
                    user_id: string
                    user_name: string
                    super_admin: true
                    picture_url: string
                    name: string
                    mfa: true
                    phone_number: <+Mobile Number with country code>
                    locale: en-us
                Super Admin User with MFA disabled:
                  value:
                    user_id: string
                    user_name: string
                    super_admin: true
                    picture_url: string
                    name: string
                    mfa: false
                    phone_number: <+Mobile Number with country code>
                    locale: en-us
                Admin Users:
                  value:
                    user_id: string
                    user_name: string
                    admin: true
                    picture_url: string
                    name: string
                    mfa: false
                    phone_number: <+Mobile Number with country code>
                    locale: en-us
                Other Users:
                  value:
                    user_id: string
                    user_name: string
                    picture_url: string
                    name: string
                    mfa: false
                    phone_number: <+Mobile Number with country code>
                    locale: en-us
                User with custom_data=true:
                  value:
                    user_id: string
                    user_name: string
                    picture_url: string
                    name: string
                    custom_data:
                      membership_info:
                        value:
                          premium: true
                      esp.location:
                        value:
                          esp.city: "Pune"
                          esp.longitude: xx.xxxx
                          esp.latitude: xx.xxxx
                          esp.state: "Maharashtra"
                      profile:

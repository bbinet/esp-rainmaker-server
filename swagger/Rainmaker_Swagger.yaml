        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutPublicProfileRequest"
            examples:
              Add a public profile:
                value:
                  profile: {"key1": "value1", "key2": "value2"}
              Remove an existing profile:
                value:
                  profile: null
              Update an existing key:
                value:
                  profile: {"key2": "new_value"}
              Remove an existing key:
                value:
                  profile: {"key2": null}
              Add a new key-value:
                value:
                  profile: {"key3": "value3"}
        description: "This API is used to create or update the public profile of the requesting user only. Profile is an object of key and value where the key will be a string, and the value can be any data type (array, object, string, number, boolean). Existing keys can be updated, deleted, or assigned new values. Special cases include:<br> <ul><li>Passing an empty JSON object (<code>{}</code>) to <b> existing </b> profile field or any key inside it, leaves the profile or <b>existing</b> key unchanged.</li><li>If any <b>non-existing</b> key is assigned as an empty (<code>{}</code>) json, then the key gets added with the empty json</li><li> <b> Empty </b> strings and arrays are allowed and are preserved in the profile.</li><li>Setting <code>null</code> for <code>profile</code> deletes the profile content, resetting it to an empty JSON object (<code>{}</code>).</li><li>Nested keys can be individually updated or removed by assigning <code>null</code> values.</li><li>If all keys of a nested json are deleted, its length is zero, then the value of the key is an empty json (<code>{}</code>)}</li></ul>"
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutPublicProfileResponse"
        "400":
          description: failure
            <br>Error Codes and Error Description
            <br>100006- Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"
        "404":
          description: failure<br>Error Codes and Error Description
            <br>101025- User does not exist
          content:
            application/json:
              schema:

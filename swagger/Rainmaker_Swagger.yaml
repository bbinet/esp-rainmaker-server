          required: false
          schema:
            type: string
        - name: type
          in: query
          description: OTA Image Type
          required: false
          schema:
            type: string
        - name: model
          in: query
          description: OTA Image Model
          required: false
          schema:
            type: string
        - name: num_records
          in: query
          description: Used for pagination, number of records to be fetched
          required: false
          schema:
            type: string
        - name: start_id
          in: query
          description: Used for pagination, Start Id of the record to be fetched
          required: false
          schema:
            type: string
        - name: contains
          in: query
          description: For pattern search on image_name
          required: false
          schema:
            type: boolean

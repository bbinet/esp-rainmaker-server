        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/CreateDeviceGroupRequest"
                - $ref: "#/components/schemas/CreateMatterFabricRequest"
            examples:
              Create device group:
                value:
                  group_name: "group_name"
                  parent_group_id: "parent_group_id"
                  type: "group_metadata"
                  mutually_exclusive: true
                  nodes: ["node_id1"]
                  description: "description"
                  custom_data: {"key": "value"}
              Create matter fabric:
                value:
                  is_matter: true
                  group_name: "group_name"
                  type: "group_metadata"
                  nodes: ["node_id1"]
                  mutually_exclusive: true
                  description: "description"
                  custom_data: {"key": "value"}
        description:
          "You cannot modify a shared group. Only the group owner can do modifications
          <ul><li><b>Request body for creating new device group.</li></b>
          <br><b>Mandatory Parameters:</b>
          <ul><li>group_name</li></ul>
          <b>White Spaces are allowed only in between the characters of group_name. Leading and trailing white spaces are not allowed.</b>
          <br><br>
          <b>Optional Parameters:</b>
          <ol><li>nodes -> the list of nodes to be added to the group. </li>
          <li>parent_group_id</li>
          <li>description</li>
          <li>type</li>
          <li>mutually_exclusive -> When mutually_exclusive flag is true, group will be considered as Mutually exclusive group i.e Nodes which are part of this group can't be part of the other mutually exclusive groups having same group type and same parent(Groups having no parent IDs can also be considered having same parent)</li>
          <li>custom_data - Custom group metadata following these JSON rules: <ul>
          <li>custom_data {} - There will be no change in the metadata, also no validation error in the input.</li>
          <li>custom_data - object of key and value where key will be string and value can be any data type (array, object, string, number, boolean). Metadata will get stored in the above format; new keys will get appended and the existing keys' value will get updated accordingly.</li>
          <li>custom_data {'key' null} - Metadata JSON keys can be deleted by above syntax.</li>
          <li>If value is array, it will get overwritten and not merged.</li></ul></li></ol>
          <br>
          <li><b>Request body for creating new Matter Fabric.</li></b>
          <br><b>Mandatory Parameters:</b>
          <ul><li>group_name</li>
          <li>is_matter</li></ul>
          <br>
          <b>Optional Parameters:</b>
          <ol><li>nodes -> the list of rainmaker nodes to be added to the group.Only subgroups can add matter nodes which are already commissioned in their parent fabric </li>
          <li>description</li>
          <li>type</li>
          <li>custom_data</li>
          <li>mutually_exclusive</li></ol></ul>
          <b>If the nodes list is not specified, then node group and matter fabric is created, without any nodes in it.</b><br><br>
          <b>Note:</b> The group_metadata field has been deprecated. Use custom_data instead."
        required: true
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CreateDeviceGroupResponse"
                  - $ref: "#/components/schemas/CreateMatterFabricResponse"
        "400":
          description: failure
            <br>Error Codes and Error Description
            <br>100006- Invalid request body
            <br>108001- Group name is missing
            <br>108002- Invalid group name. Group name must be 1 to 256 characters long and \#$\| are not allowed.
            <br>108003- Number of nodes specified should be between 1 and 100
            <br>108007- Group name already exists
            <br>108009- Invalid group parent id
            <br>108011- Sub group can not be created
            <br>108013- Some of the nodes are not mapped by user
            <br>108015- Some of the nodes are not present in parent group
            <br>108025- The length of group description must be less than 500 characters
            <br>108056- You cannot modify a shared group. Only the group owner can do modifications
            <br>108073- A group can have maximum of 100 sub-groups only
            <br>108080- Parent group ID is not allowed while creating/updating matter fabric
            <br>108122- Some requested nodes are matter nodes which can be only added in the matter fabric via node commissioning flow
            <br>108127- Matter fabric is not supported for customer deployments
            <br>108132- Matter fabric quota is exceeded
            <br>108149- The specified parent group is a dynamic group, which cannot have sub-groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceGroupAPIFailureResponse"
        "500":
          description: failure
            <br>Error Codes and Error Description
            <br>108004- Error occurred while storing node group info details
            <br>108005- Error occurred while storing node group mapping details
            <br>108006- Error occurred while storing node group children details
            <br>108008- Error occurred while fetching node group info details
            <br>108010- Error occurred while fetching node group mapping details
            <br>108014- Error occurred while fetching user node association details
            <br>108042- Error adding user group sharing
            <br>108057- Error getting the shared groups
            <br>108078- Error occurred while generating Root CA certificate for matter fabric
            <br>108077- Error occurred while generating matter fabric IDs
            <br>108131- Error checking whether matter fabric quota is exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceGroupAPIFailureResponse"
      security:
        - AccessToken: []
    put:
      tags:
        - Device grouping
      summary: Update user device group or matter fabric
      description: "This API will update user device group or matter fabric"
      operationId: userupdatedevicegroup
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
        - name: group_id
          in: query
          description: group Id
          required: true
          schema:
            type: string
        - name: matter_controller
          in: query
          description: Create matter controller.Do not use group_id with this param.
          example: true/false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/UpdateDeviceGroupRequest"
                - $ref: "#/components/schemas/CreateMatterControllerRequest"
            examples:
              Update device group:
                value:
                  group_name: "group_name"
                  operation: "add/remove"
                  type: "type"
                  mutually_exclusive: true
                  nodes: ["node_id1"]
                  description: "description"
                  custom_data: {"key": "value"}
              Convert node group to matter fabric:
                value:
                  is_matter: true
              Add node to matter fabric:
                value:
                  operation: "add"
                  csr_requests:
                    [{"csr": "valid csr", "group_id": "some node group id"}]
                  csr_type: "node"
                  tags: ["tags1:value1", "tags2:value2"]
                  metadata: {"name": "value"}
              Create Matter Controller:
                value:
                  node_id: "Thing2"
                  group_id: "group_id"
              Issue NoC for User:
                value:
                  operation: "add"
                  csr_requests:
                    [
                      {"csr": "<valid csr>", "group_id": "<group_id>"},
                      {"csr": "<valid csr>", "group_id": "<group_id>"},
                    ]
                  csr_type: "user"
              Issue NoC for Controller:
                value:
                  operation: "add"
                  csr_requests:
                    [
                      {
                        "role": "primary/secondary",
                        "matter_node_id": "<matter node id>",
                        "csr": "<valid csr>",
                        "group_id": "<group_id>",
                      },
                    ]
                  csr_type: "controller"
              Confirm pure matter node commissioning:
                value:
                  request_id: "<request_id>"
                  status: "status"
                  metadata: {"key": "value"}
              Confirm rainmaker + matter node commissioning:
                value:
                  request_id: "<request_id>"
                  status: "status"
                  rainmaker_node_id: "rainmaker_node_id"
                  challenge_response: "signed matter_node_id using private key of node"
                  challenge: "signed matter_node_id using private key of node"
                  metadata: {"key": "value"}

        description: <b> Device group</b>
          <ol><li>Using this API, the user can either add or remove the nodes to the group or change the parameters of the group like group name and type.</li>
          <li>The value of operation can be <b>add or remove</b>. </li>
          <li>While adding or removing nodes, nodes array is required to be specified in the request body. </li>
          <li>For updating group name, description, custom_data and type, the new values for these parameters need to be specified.</li>
          <li>mutually_exclusive -> When mutually_exclusive flag is true, group will be considered as Mutually exclusive group i.e Nodes which are part of this group can't be part of the other mutually exclusive groups having same group type and same parent(Groups having no parent IDs can also be considered having same parent)</li>
          <li>custom_data - Custom group metadata following these JSON rules <ul>
          <li>custom_data null - The metadata will get deleted entirely</li>
          <li>custom_data {} - There will be no change in the metadata, also no validation error in the input</li>
          <li>custom_data - object of key and value where key will be string and value can be any data type (array, object, string, number, boolean). Metadata will get stored in the above format; new keys will get appended and the existing keys' value will get updated accordingly</li>
          <li>custom_data {'key' null} - Metadata JSON keys can be deleted by above syntax</li>
          <li>If value is array, it will get overwritten and not merged</li></ul></li></ol>
          <br><b> Matter fabric </b><ol>
          <li>You can update the fabric name, custom_data, type or description or can add rainmaker nodes through add operation. Only subgroups can add matter nodes which are already commissioned in their parent fabric</li>
          <li>You can convert an existing node group into the matter fabric.
          <li>You can provide a Certificate Signing Request to add a matter node to matter fabric.You can optionally add tags and metadata(This metadata follows the same JSON rules as custom_data above) to the nodes.</li>
          <li>You can provide a Certificate Signing Request to get Noc for a user for specified matter fabric.</li>
          <li>Confirm the node commissioning with appropriate status by providing the request id received in 'Add node to fabric' step.</li>
          <li>You can remove any type of nodes(pure_matter/rainmaker_matter/rainmaker) from the fabric.In the case of pure matter nodes, they will get deleted completely.In the case of rainmaker_matter nodes, they will become just rainmaker nodes</li>
          <li>User will no longer be associated with the matter nodes if nodes are removed from the fabric</li>
          <li><b>User can specify both challenge and challenge_response in the rainmaker + matter node commissioning confirmation step as of now.challenge will be deprecated soon</b></li>
          <li>Multi controller is supported where in a controller assume the identity of a matter node to make the API calls. Check the Issue NoC for Controller example. Appropriate support is needed in controller firmware.Also check the Create Matter Controller example to create the matter controller to get the MAtter Node ID for getting NOC</li>
          </ol>
        required: true
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/APISuccessResponse"
                  - $ref: "#/components/schemas/AddNodeToFabricResponse"
                  - $ref: "#/components/schemas/GetUserNoCResponse"
                  - $ref: "#/components/schemas/ConvertGroupToMatterFabricResponse"
                  - $ref: "#/components/schemas/CreateMatterControllerResponse"
              examples:
                Update device group:
                  summary: Update device group
                  value:
                    status: "success"
                    description: "success description"
                Add node to matter fabric:
                  summary: Add node to matter fabric
                  value:
                    status: "success"
                    description: "success description"
                    certificates:
                      [
                        {
                          matter_node_id: "someid",
                          node_noc: "node_noc",
                          group_id: "group_id",
                        },
                      ]
                    request_id: "some request id"
                Get User NoC For matter fabric:
                  summary: Get User NoC for matter fabric
                  value:
                    status: "success"
                    description: "success description"
                    certificates:
                      [
                        {
                          group_id: "group_id",
                          matter_user_id: "someid",
                          user_noc: "user_noc",
                        },
                      ]
                Get NoC for Controller:
                  summary: Get NoC for Matter multi controller
                  value:
                    status: "success"
                    description: "success description"
                    certificates:
                      [
                        {
                          group_id: "group_id",
                          matter_user_id: "someid",
                          user_noc: "user_noc",
                        },
                      ]
                Confirm node commissioning:
                  summary: Confirm node commissioning
                  value:
                    status: "success"
                    description: "success description"
                Convert node group into the matter fabric:
                  summary: Convert node group into the matter fabric
                  value:
                    {
                      "status": "success",
                      "group_id": "<group_id>",
                      "description": "Successfully converted existing group into rainmaker fabric",
                      "fabric_id": "<fabric_id>",
                      "root_ca": "<root_ca_cert>",
                      "group_cat_id_admin": "<group_cat_id_admin>",
                      "group_cat_id_operate": "<group_cat_id_operate>",
                      "matter_user_id": "<matter_user_id>",
                      "user_cat_id": "<user_cat_id>",
                      "ipk": "<ipk>",
                    }

        "400":
          description: failure
            <br>Error Codes and Error Description
            <br>100006- Invalid request body
            <br>108002- Invalid group name. Group name must be 1 to 256 characters long and \#$\| are not allowed.
            <br>108003- Number of nodes specified should be between 1 and 100
            <br>108007- Group name already exists
            <br>108012- Some of the nodes are not claimed by user
            <br>108015- Some of the nodes are not present in parent group
            <br>108016- Group id is missing
            <br>108017- Invalid operation specified.[Valid operation values are add/remove]
            <br>108023- Group does not exist
            <br>108024- Either group name, type, description, mutually_exclusive, custom_data regroup [true] or operation needs to specified
            <br>108025- The length of group description must be less than 500 characters
            <br>108056- You cannot modify a shared group. Only the group owner can do modifications
            <br>108013- Some of the nodes are not mapped by user
            <br>108109- Group Id as query parameter cannot be specified for csr requests
            <br>108090- Only is_matter flag is allowed while converting an existing group into the matter fabric
            <br>108111- Error, one or more group does not exist or you do not have access
            <br>108108- CSR not specified
            <br>108107- Invalid csr type, valid values are user, node and controller
            <br>108134- Invalid role value, valid values are primary or secondary
            <br>108137- Invalid request, matter node id and role are required for controller csr type
            <br>108116- Invalid request, CSR and type is specified but operation not specified
            <br>108113- For node csr type, only one csr is allowed
            <br>108110- For each CSR request, group id and csr both are required
            <br>108112- Duplicate group id in request
            <br>108088- Invalid request, one or more node group is not a matter fabric
            <br>108105- Request id and status are missing
            <br>108095- Confirming node commissioning requires both the Challenge Response and RainMaker Node ID
            <br>108102- Invalid Status, valid status is a success or failed
            <br>108091- Only Groups having no parents are allowed while converting an existing group into the matter fabric
            <br>108092- This group is already a matter fabric.
            <br>108085- Error, invalid CSR
            <br>108103 - Request id does not exists
            <br>108099- Node commissioning can not be confirmed as the request is in %s status
            <br>108100- Group id from the add node to fabric request is different than node commissioning confirmation request
            <br>108104- Request has timedout
            <br>108096- Invalid Challenge Response for node commissioning confirmation request
            <br>108081- CSR cannot be specified with other attributes
            <br>108122- Some requested nodes are matter nodes which can be only added in the matter fabric via node commissioning flow
            <br>108123- Tags parameter is not allowed without CSR requests and csr_type other than node
            <br>108124- Metadata parameter is not allowed without CSR requests and csr_type other than node.
            <br>108101- Node id %s does not exist
            <br>108127- Matter fabric is not supported for customer deployments
            <br>108130- Converting an existing rainmaker group to fabric is not supported if subgroups are individually shared
            <br>108132- Matter fabric quota is exceeded
            <br> 108138- Group Id is required for matter controller request
            <br> 108139- Node Id is required for matter controller request
            <br> 108140- Secondary user of fabric can't request for primary role of controller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceGroupAPIFailureResponse"
        "500":
          description: failure
            <br>Error Codes and Error Description
            <br>108005- Error occurred while storing node group info details
            <br>108008- Error occurred while fetching node group info details
            <br>108010- Error occurred while fetching node group mapping details
            <br>108014- Error occurred while fetching user node association details
            <br>108018- Error occurred while updating node group info details
            <br>108019- Error occurred while removing node group mappings
            <br>108020- Error occurred while fetching sub groups
            <br>108042- Error adding user group sharing
            <br>108057- Error getting the shared groups
            <br>108086-Error occurred while creating NoC
            <br>108082- Error decoding fabric's root ca certificate
            <br>108084- Error parsing fabric's root ca certificate
            <br>108083- Error parsing fabric's root ca private key
            <br>108087- Error occurred while adding fabric node mapping request
            <br>108097- Error occurred while confirming node commissioning
            <br>108125- Error occurred while deleting pure matter nodes
            <br>108126- Error occurred while removing matter fields from the rainmaker+matter nodes
            <br>108114- Error converting to matter fabric
            <br>108098- Adding user to nodes mapping failed
            <br>108131- Error checking whether matter fabric quota is exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceGroupAPIFailureResponse"
      security:
        - AccessToken: []
    get:
      tags:
        - Device grouping
      summary: Get user device group
      description:
        "This API will get the details about the user device group and matter fabrics.
        <ol><li>By Default all the groups with their details will be returned.Matter fabrics will also be returned with additional fields i.e is_matter and fabric_id</li>
        <li>To get list of nodes in a group or for all groups, set node_list flag to true.</li>
        <li>To get sub groups in a group or for all groups, set sub_groups flag to true.</li>
        <li>start_id and num_records are used for pagination of groups.</li>
        <li>When group_id is passes then details of that group will be returned.</li>
        <li>When group_name is passes then details of that group will be returned.</li>
        <ul>
        <li>To get node details set node_details flag to true.</li>
        <li>When node details is requested, the nodes array will be removed from the output.</li></ul>
        <li>The node_details flag is applicable only when group_id or group_name is passed</li>
        <li>The matter_node_list flag is applicable only when group_id or group_name is passed, If true, all the matter node IDs along with their rainmaker IDs get displayed in case of matter nodes.This flag can only be applied if group_id or group_name is present. node_details flag has the higher priority over this flag</li>
        <li>When is_matter flag is requested, all the matter fabrics will be displayed.is_matter flag can be used with all the above mentioned flags except group_id/group_name.
        <li>When fabric_details flag is requested, fabric details will get displayed.This flag can be used with group_id/group_name/is_matter.
        </ol>"
      operationId: usergetdevicegroup
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
        - name: group_id
          in: query
          description: group Id
          schema:
            type: string
        - name: optional group_name
          in: query
          description: group Name
          schema:
            type: string
        - name: node_list
          in: query
          description: optional flag **(true/false)**, to indicate if the node list is required in the response
          schema:
            type: boolean
            default: false
        - name: sub_groups
          in: query
          description: optional flag **(true/false)**, to indicate if the sub groups list is required in the response
          schema:
            type: boolean
            default: false
        - name: node_details
          in: query
          description: optional flag **(true/false)**, to indicate if the node_details is required in the response
          schema:
            type: boolean
            default: false
        - name: is_matter
          in: query
          description: optional flag **(true/false)**, If true, all the matter fabrics will be displayed
          schema:
            type: boolean
            default: false
        - name: matter_node_list
          in: query
          description: optional flag **(true/false)**, If true, all the matter node IDs along with their rainmaker IDs get displayed in case of matter nodes.This flag can only be applied if group_id or group_name is present
          schema:
            type: boolean
            default: false
        - name: fabric_details
          in: query
          description: optional flag **(true/false)**, to indicate if the fabric_details is required in the response
          schema:
            type: boolean
            default: false
        - name: start_id
          in: query
          description: This is used for the pagination
          schema:
            type: string
        - name: num_records
          in: query
          description: This is used for the pagination
          schema:
            type: string
            default: "25"
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUserDeviceGroupResponse"
              examples:
                group_id specified, node_details=false, node_list=true, sub_groups=true:
                  $ref: "#/components/examples/GetDeviceGroupResponseGroupID"
                group_id specified, node_details=false, node_list=true, sub_groups=false:
                  $ref: "#/components/examples/GetDeviceGroupNodeListGroupID"
                group_id specified, node_details=false, node_list=false, sub_groups=true:
                  $ref: "#/components/examples/GetDeviceGroupWithoutNodesListResponseGroupID"
                group_id specified, node_details=false, node_list=false, sub_groups=false:
                  $ref: "#/components/examples/GetDeviceGroupBaseGroupID"
                group_id specified, node_details=true, sub_groups=true, node_list=true/false:
                  $ref: "#/components/examples/GetUserNodeGroupByIdArrayWithNodeDetails"
                group_id specified, node_details=true, sub_groups=false, node_list=true/false:
                  $ref: "#/components/examples/GetUserNodeGroupByIdArrayWithNodeDetailsWithoutSubGroups"
                group_id not specified, group_name not specified, node_list=true, sub_groups=true:
                  $ref: "#/components/examples/GetDeviceGroupResponse"
                group_id not specified, group_name not specified, node_list=true, sub_groups=false:
                  $ref: "#/components/examples/GetDeviceGroupNodeList"
                group_id not specified, group_name not specified, node_list=false, sub_groups=true:
                  $ref: "#/components/examples/GetDeviceGroupWithoutNodesListResponse"
                group_id not specified, group_name not specified, node_list=false, sub_groups=false:
                  $ref: "#/components/examples/GetDeviceGroupBase"
                group_name is specified, node_details=false, node_list=true, sub_groups=true:
                  $ref: "#/components/examples/GetDeviceGroupResponseGroupName"
                group_name specified, node_details=false, node_list=true, sub_groups=false:
                  $ref: "#/components/examples/GetDeviceGroupNodeListGroupName"
                group_name specified, node_details=false, node_list=false, sub_groups=true:
                  $ref: "#/components/examples/GetDeviceGroupWithoutNodesListResponseGroupName"
                group_name specified, node_details=false, node_list=false, sub_groups=false:
                  $ref: "#/components/examples/GetDeviceGroupBaseGroupName"
                group_name specified, node_details=true, sub_groups=true, node_list=true/false:
                  $ref: "#/components/examples/GetUserNodeGroupByNameArrayWithNodeDetails"
                group_name specified, node_details=true, sub_groups=false, node_list=true/false:
                  $ref: "#/components/examples/GetUserNodeGroupByNameArrayWithNodeDetailsWithoutSubGroups"
                is_matter= true, fabric_details= true:
                  $ref: "#/components/examples/GetMatterFabricsUserGroupsWithFabricDetails"
                group_id is specified, matter_node_list=true:
                  $ref: "#/components/examples/GetMatterFabricsNodeDetails"
        "400":
          description: failure
            <br> Error Codes and Error Description
            <br>108023- Group does not exist
            <br>108030- Specify either group_id or group_name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceGroupAPIFailureResponse"
        "500":
          description: failure
            <br> Error Codes and Error Description
            <br>108008- Error occurred while fetching node group info details
            <br>108010- Error occurred while fetching node group mapping details
            <br>108020- Error occurred while fetching sub groups
            <br>108026- Error occurred while getting node details
            <br>108064- Error occurred while updating node count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceGroupAPIFailureResponse"
        "404":
          description: failure
            <br> Error Codes and Error Description
            <br>108029- Group with the group name doesn't exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceGroupAPIFailureResponse"
      security:
        - AccessToken: []
    delete:
      tags:
        - Device grouping
      summary: Delete user device group or matter fabric
      description: "This API will delete user device group/matter fabric if user is primary.It allows the users to leave from their own groups/matter fabric. It also allows primary users to remove the sharing for other users"
      operationId: userdeletedevicegroup
      parameters:
        - name: version
          in: path
          description: API Version (Current supported API Version is 'v1')
          required: true
          schema:
            type: string
            default: "v1"
        - name: group_id
          in: query
          description: group id
          required: true
          schema:
            type: string
        - name: leave
          in: query
          description:
            Primary/secondary users can specify this parameter to leave the group.For primary users, if that's the only primary for the group, this option won't work and user need to delete the group.
            For secondary users, it will be true by default if nothing is specified.
          schema:
            type: boolean
            default: false
        - name: remove_sharing
          in: query
          description: remove_sharing should be used with user_name
          schema:
            type: boolean
            default: false
        - name: user_name
          in: query
          description: user_name of the user for which sharing needs to be removed
          schema:
            type: string
      responses:
        "200":

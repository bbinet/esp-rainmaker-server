            <br>104015- OTA image not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OTAImageAPIFailureResponse"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIFailureResponse"

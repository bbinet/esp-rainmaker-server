[project]
name = "esp-rainmaker-server"
version = "0.1.0"
description = "Self-hosted ESP RainMaker backend"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
readme = "README.md"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "minio>=7.2",
    "paho-mqtt>=2.1",
    "aiomqtt>=2.3",
    "cryptography>=43",
    "pyjwt>=2.9",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "httpx>=0.28",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
    "structlog>=24.4",
    "orjson>=3.10",
    "tenacity>=9.0",
    "arq>=0.26",
    "aiosmtplib>=3.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "anyio>=4.6",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-passlib",
    "httpx>=0.28",
    "respx>=0.21",
    "testcontainers[postgres]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4", "SIM", "RET"]
ignore = ["S101", "B008", "ASYNC110"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "TC001", "TC002", "TC003", "TC006"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "alembic/*"]
